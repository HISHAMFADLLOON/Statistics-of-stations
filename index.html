  mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0},

  min(a){return a.length?Math.min(...a):0},

  analyze(reports,stations){

rows.forEach((r,idx)=>{const rn=7+idx;const row=ws.addRow([r.name,r.ticketsCount,r.ticketsRevenue,r.diverseRevenue,{formula:`C${rn}+D${rn}`},r.bankAhlyDiscount,r.bankMisrDiscount,{formula:`F${rn}+G${rn}`},{formula:`E${rn}-H${rn}`},r.weekCount,r.weekRevenue,r.monthCount,r.monthRevenue,r.quarterCount,r.quarterRevenue,r.subCardsCount,r.subCardsRevenue,r.walletCardsCount,r.walletCardsRevenue,r.rechargeCount,r.rechargeRevenue,r.formsCount,r.formsRevenue,r.subDiverseRevenue,{formula:`K${rn}+M${rn}+O${rn}+Q${rn}+S${rn}+U${rn}+W${rn}+X${rn}`},r.subBankAhlyDiscount,r.subBankMisrDiscount,{formula:`Z${rn}+AA${rn}`},{formula:`Y${rn}-AB${rn}`},{formula:`I${rn}+AC${rn}`},r.present?'مسجّل':'—',r.stadiumTicketsCount]);row.eachCell({includeEmpty:true},(cell,col)=>{cell.border=thinB();cell.alignment={horizontal:col===1?'right':'center',vertical:'middle'};cell.font={size:10,name:'Segoe UI'};if(idx%2===0)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF8FAFC'}};if(col>=2&&col<=30){if(cc.includes(col))cell.numFmt='#,##0';else if(dc.includes(col)){cell.numFmt='#,##0';cell.font={size:10,color:{argb:'FFB91C1C'},bold:true}}else if(gc.includes(col)){cell.numFmt='#,##0';cell.font={size:10,color:{argb:'FF047857'},bold:true}}else if(rc.includes(col)){cell.numFmt='#,##0';cell.font={size:10,color:{argb:'FFB45309'},bold:true}}}if(col===32){cell.numFmt='#,##0';cell.font={size:11,color:{argb:'FF667EEA'},bold:true}}if(col===1)cell.font={bold:true,size:11,name:'Segoe UI'};if(col===31){if(r.present){cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD1FAE5'}};cell.font={bold:true,size:10,color:{argb:'FF047857'}}}else{cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFEE2E2'}};cell.font={bold:true,size:10,color:{argb:'FFB91C1C'}}}}});row.height=22});
const tr=7+rows.length;const tv=['الإجمالي العام'];for(let col=2;col<=30;col++)tv.push({formula:`SUM(${CL(col)}7:${CL(col)}${tr-1})`});tv.push(T.done+' محطة');tv.push({formula:`SUM(AF7:AF${tr-1})`});const trow=ws.addRow(tv);trow.eachCell({includeEmpty:true},(cell,col)=>{cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFECFDF5'}};cell.font={bold:true,size:12,color:{argb:'FF047857'}};cell.border=medB('FF059669');cell.alignment={horizontal:'center',vertical:'middle'};if(col>=2&&col<=30)cell.numFmt='#,##0';if(col===32)cell.numFmt='#,##0'});trow.height=28;ws.addRow([]);const fr=ws.addRow([`تم الإنشاء: ${new Date().toLocaleString('ar-EG')} — Powered by Hisham Fadloun`]);ws.mergeCells(fr.number,1,fr.number,32);const fc=ws.getCell(fr.number,1);fc.font={italic:true,size:9,color:{argb:'FF64748B'}};fc.alignment={horizontal:'center',vertical:'middle'};ws.autoFilter={from:{row:6,column:1},to:{row:tr-1,column:32}};return ws}
async function exportDayExcel(rows){toast('⏳ تجهيز...');const T=totalsOf(rows);let wb;try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv(buildAOA(rows,T),'تقرير');return}try{wb.views=[{rightToLeft:true}];const logo=await loadLogo();buildPremiumSheet(wb,rows,T,'إحصاء '+dashDate,`التاريخ: ${dashDate} — المسجّل: ${T.done}/${rows.length}`,logo);const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`إحصاء ${dashDate}.xlsx`);toast('✅ تم التنزيل')}catch(e){csv(buildAOA(rows,T),'تقرير')}}
async function exportWeekExcel(){toast('⏳ تجهيز...');try{const[all,stations]=await Promise.all([getAllReports(),getAllStations()]);const end=dashDate;const sd=new Date(end+'T12:00');sd.setDate(sd.getDate()-6);const si=sd.toISOString().slice(0,10);const inR=all.filter(r=>String(r.date)>=si&&String(r.date)<=end);const rows=stations.map(st=>{const rs=inR.filter(r=>String(r.stationCode)===st.code);const z={};NUM_FIELDS.forEach(f=>z[f]=rs.reduce((a,r)=>a+num(r[f]),0));const c=calcRow(z);return{code:st.code,name:st.name,...z,tBefore:c.tBefore,tDisc:c.tDisc,tAfter:c.tAfter,sBefore:c.sBefore,sDisc:c.sDisc,sAfter:c.sAfter,grand:c.grand,totalCount:c.count,totalRevenue:c.grand,present:rs.length>0}});const T=totalsOf(rows);let wb;try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv(buildAOA(rows,T),'اسبوعي');return}wb.views=[{rightToLeft:true}];const logo=await loadLogo();buildPremiumSheet(wb,rows,T,'اسبوعي',`الفترة: ${si} → ${end}`,logo);const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`اسبوعي ${end}.xlsx`);toast('✅ تم')}catch(e){toast('❌ خطأ')}}
async function exportMonthExcel(){toast('⏳ تجهيز...');try{const[all,stations]=await Promise.all([getAllReports(),getAllStations()]);const ym=dashDate.slice(0,7);const inR=all.filter(r=>String(r.date).slice(0,7)===ym);const rows=stations.map(st=>{const rs=inR.filter(r=>String(r.stationCode)===st.code);const z={};NUM_FIELDS.forEach(f=>z[f]=rs.reduce((a,r)=>a+num(r[f]),0));const c=calcRow(z);return{code:st.code,name:st.name,...z,tBefore:c.tBefore,tDisc:c.tDisc,tAfter:c.tAfter,sBefore:c.sBefore,sDisc:c.sDisc,sAfter:c.sAfter,grand:c.grand,totalCount:c.count,totalRevenue:c.grand,present:rs.length>0}});const T=totalsOf(rows);let wb;try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv(buildAOA(rows,T),'شهري');return}wb.views=[{rightToLeft:true}];const logo=await loadLogo();buildPremiumSheet(wb,rows,T,'شهري',`شهر: ${ym}`,logo);const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`شهري ${ym}.xlsx`);toast('✅ تم')}catch(e){toast('❌ خطأ')}}
async function exportLogExcel(rec){toast('⏳ تجهيز...');let wb;const H=['كود','المحطة','التاريخ',...NUM_FIELDS,'إجمالي عدد','إجمالي إيراد','المسجل'];try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv([H,...rec.map(r=>[r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy])],'سجل');return}try{wb.views=[{rightToLeft:true}];const ws=wb.addWorksheet('سجل البيانات');const logo=await loadLogo();if(logo){const id=wb.addImage({base64:logo.b64,extension:logo.ext});ws.addImage(id,{tl:{col:0.02,row:0.02},ext:{width:70,height:70}})}const hr=ws.addRow(H);hr.font={bold:true,size:10};const sorted=[...rec].sort((a,b)=>String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')));sorted.forEach(r=>{ws.addRow([r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy])});const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'سجل.xlsx');toast('✅ تم')}catch(e){toast('❌ خطأ')}}
