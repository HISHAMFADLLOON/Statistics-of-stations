<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg-primary:#020617;
  --bg-secondary:#0f172a;
  --bg-card:#1e293b;
  --bg-hover:#334155;
  --border:#1e293b;
  --primary:#06b6d4;
  --primary-dark:#0891b2;
  --primary-light:#67e8f9;
  --secondary:#8b5cf6;
  --accent:#f59e0b;
  --success:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --text-primary:#f1f5f9;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --gradient-primary:linear-gradient(135deg,#06b6d4 0%,#8b5cf6 100%);
  --gradient-secondary:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.3);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.3);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.5),0 4px 6px -4px rgba(0,0,0,.4);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.6),0 8px 10px -6px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  color:var(--text-primary);
  background:var(--bg-primary);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(800px 400px at 90% 10%,rgba(6,182,212,.15),transparent 60%),
    radial-gradient(600px 350px at 10% 90%,rgba(139,92,246,.12),transparent 60%),
    radial-gradient(500px 300px at 50% 50%,rgba(245,158,11,.08),transparent 60%);
  pointer-events:none;
  z-index:0;
}
::selection{background:rgba(6,182,212,.35);color:var(--text-primary)}
a{color:inherit;text-decoration:none;transition:all .2s}
button{font-family:inherit;touch-action:manipulation;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--primary-dark)}
.ic{width:20px;height:20px;flex:none}

#splash{
  position:fixed;inset:0;z-index:1000;
  background:linear-gradient(135deg,var(--bg-primary) 0%,var(--bg-secondary) 100%);
  display:grid;place-items:center;
  transition:opacity .6s cubic-bezier(.4,0,.2,1);
}
#splash.off{opacity:0;pointer-events:none}
.splash-container{
  text-align:center;
  animation:slideUp .8s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
.splash-icon{
  width:120px;height:120px;
  background:var(--gradient-primary);
  border-radius:28px;
  display:grid;place-items:center;
  font-size:64px;
  box-shadow:0 20px 60px rgba(6,182,212,.4),inset 0 2px 10px rgba(255,255,255,.2);
  animation:iconPulse 2s ease-in-out infinite,popIn .6s cubic-bezier(.4,0,.2,1) .2s;
  position:relative;
  overflow:hidden;
}
.splash-icon::before{
  content:'';
  position:absolute;
  inset:-50%;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shimmer 3s infinite;
}
@keyframes shimmer{
  0%{transform:translateX(-100%) rotate(45deg)}
  100%{transform:translateX(100%) rotate(45deg)}
}
@keyframes iconPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}
@keyframes popIn{
  from{opacity:0;transform:scale(.5)}
  to{opacity:1;transform:scale(1)}
}
.splash-title{
  font:800 32px 'Changa';
  margin-top:24px;
  background:var(--gradient-primary);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.splash-subtitle{
  color:var(--text-secondary);
  font-size:14px;
  font-weight:500;
  margin-top:8px;
}

.track-strip{
  position:fixed;
  bottom:0;left:0;right:0;
  height:100px;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.track-rail{
  position:absolute;
  bottom:30px;left:0;right:0;
  height:6px;
  background:linear-gradient(90deg,transparent,var(--primary),var(--secondary),transparent);
  border-radius:3px;
  opacity:.4;
}
.mtrain{
  position:absolute;
  bottom:35px;
  left:-180px;
  animation:ride 25s linear infinite;
  filter:drop-shadow(0 8px 20px rgba(6,182,212,.4));
}
@keyframes ride{
  to{left:110%}
}
.mtrain .body{
  width:160px;height:32px;
  background:linear-gradient(180deg,var(--primary-light),var(--primary));
  border-radius:16px 20px 10px 10px;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(6,182,212,.5),inset 0 2px 10px rgba(255,255,255,.3);
}
.mtrain .body::before{
  content:'';
  position:absolute;
  left:12px;right:12px;top:8px;height:10px;
  background:repeating-linear-gradient(90deg,var(--bg-secondary) 0 14px,var(--primary-light) 14px 18px);
  border-radius:4px;
  opacity:.8;
}
.mtrain .body::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:6px;
  background:var(--bg-primary);
  opacity:.3;
}
.mtrain .window{
  position:absolute;
  top:4px;left:16px;right:16px;height:8px;
  background:rgba(255,255,255,.9);
  border-radius:4px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(15,23,42,.85);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(30,41,59,.8);
  box-shadow:var(--shadow-lg);
}
.topbar-in{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:16px;
  padding:12px 24px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.brand-badge{
  width:48px;height:48px;
  border-radius:14px;
  background:var(--gradient-primary);
  display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(6,182,212,.4),inset 0 2px 8px rgba(255,255,255,.2);
  transition:transform .3s;
}
.brand-badge:hover{transform:rotate(-10deg) scale(1.1)}
.brand-badge .ic{width:28px;height:28px;color:var(--bg-primary)}
.brand b{font:800 20px 'Changa';display:block;color:var(--text-primary)}
.brand small{color:var(--text-secondary);font-size:12px;font-weight:600;letter-spacing:.5px}
nav.top-nav{
  display:flex;
  gap:6px;
  margin-inline-start:auto;
  flex-wrap:wrap;
}
nav.top-nav a{
  padding:10px 16px;
  border-radius:12px;
  color:var(--text-secondary);
  font-weight:600;
  font-size:14px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  display:flex;
  gap:8px;
  align-items:center;
  position:relative;
  overflow:hidden;
}
nav.top-nav a::before{
  content:'';
  position:absolute;
  inset:0;
  background:var(--gradient-primary);
  opacity:0;
  transition:opacity .25s;
}
nav.top-nav a:hover::before{opacity:.1}
nav.top-nav a .ic{width:18px;height:18px;position:relative;z-index:1}
nav.top-nav a:hover{color:var(--primary-light);transform:translateY(-2px)}
nav a.active{
  color:var(--primary-light);
  background:rgba(6,182,212,.15);
  box-shadow:0 0 0 2px rgba(6,182,212,.2);
}
.head-meta{display:flex;align-items:center;gap:10px}
#clockTime{font:700 18px 'Changa';color:var(--primary-light)}
#clockDate{font-size:12px;color:var(--text-secondary)}
.chip{
  font-size:11px;
  font-weight:700;
  padding:4px 12px;
  border-radius:99px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow:var(--shadow-sm);
}
.chip.ok{
  color:#34d399;
  background:rgba(16,185,129,.15);
  border:1px solid rgba(16,185,129,.4);
}
.chip.warn{
  color:#fbbf24;
  background:rgba(245,158,11,.15);
  border:1px solid rgba(245,158,11,.4);
}
@media(max-width:900px){nav.top-nav{display:none}}

.bottom-nav{
  display:none;
  position:fixed;
  bottom:0;inset-inline:0;
  z-index:60;
  background:rgba(15,23,42,.95);
  backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid rgba(30,41,59,.8);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.4);
}
.bottom-nav a{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--text-secondary);
  font-size:11px;
  font-weight:600;
  padding:8px;
  border-radius:12px;
  transition:all .25s;
  position:relative;
}
.bottom-nav a::before{
  content:'';
  position:absolute;
  inset:0;
  background:var(--gradient-primary);
  opacity:0;
  border-radius:12px;
  transition:opacity .25s;
}
.bottom-nav a .ic{width:22px;height:22px;position:relative;z-index:1;transition:transform .25s}
.bottom-nav a.active::before{opacity:.15}
.bottom-nav a.active{color:var(--primary-light)}
.bottom-nav a.active .ic{transform:scale(1.1)}
@media(max-width:900px){.bottom-nav{display:flex}main{padding-bottom:100px}}

main{position:relative;z-index:1;max-width:1400px;margin:auto;padding:28px 24px 40px}
footer{
  position:relative;
  z-index:1;
  border-top:1px solid var(--border);
  padding:20px 24px 28px;
  color:var(--text-muted);
  font-size:13px;
  text-align:center;
  background:rgba(15,23,42,.5);
}
.view{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.loading{
  color:var(--text-secondary);
  padding:60px 0;
  text-align:center;
  font-weight:600;
  font-size:16px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--gradient-primary);
  color:var(--bg-primary);
  font:700 14px 'IBM Plex Sans Arabic';
  padding:12px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 20px rgba(6,182,212,.35),inset 0 2px 8px rgba(255,255,255,.2);
  position:relative;
  overflow:hidden;
}
.btn::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);
  opacity:0;
  transition:opacity .25s;
}
.btn:hover::before{opacity:1}
.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 28px rgba(6,182,212,.45),inset 0 2px 8px rgba(255,255,255,.3);
}
.btn:active{transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.ghost{
  background:transparent;
  border:1.5px solid var(--border);
  color:var(--text-primary);
  box-shadow:none;
}
.btn.ghost:hover{
  border-color:var(--primary);
  color:var(--primary-light);
  background:rgba(6,182,212,.1);
}
.btn.navy{
  background:var(--bg-card);
  color:var(--primary-light);
  border:1.5px solid var(--border);
  box-shadow:none;
}
.btn.navy:hover{
  background:var(--bg-hover);
  border-color:var(--primary);
}
.btn.danger{
  background:transparent;
  border:1.5px solid rgba(239,68,68,.5);
  color:var(--danger);
  box-shadow:none;
}
.btn.danger:hover{
  background:rgba(239,68,68,.1);
  border-color:var(--danger);
}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn.big{padding:14px 28px;font-size:15px;border-radius:14px}
.icon-btn{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg-card);
  color:var(--text-secondary);
  cursor:pointer;
  transition:all .25s;
  box-shadow:var(--shadow-sm);
}
.icon-btn:hover{
  color:var(--primary-light);
  border-color:var(--primary);
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
}
.icon-btn .ic{width:18px;height:18px}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.card{
  background:linear-gradient(180deg,var(--bg-card),var(--bg-secondary));
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  box-shadow:var(--shadow-xl);
  margin-bottom:20px;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:var(--gradient-primary);
  opacity:0;
  transition:opacity .3s;
}
.card:hover::before{opacity:1}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(6,182,212,.3);
  box-shadow:0 24px 40px rgba(0,0,0,.5);
}
.card h2{
  font:700 22px 'Changa';
  margin-bottom:16px;
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--text-primary);
}
.card h2 .ic{color:var(--primary);width:24px;height:24px}

.board-head{
  display:flex;
  align-items:flex-end;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.page-title{font:800 36px 'Changa';background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-sub{color:var(--text-secondary);font-size:15px;margin-top:4px}
.board-head .grow{flex:1}
.search{
  background:var(--bg-card);
  border:1.5px solid var(--border);
  border-radius:14px;
  color:var(--text-primary);
  padding:12px 16px;
  font-family:inherit;
  width:260px;
  transition:all .25s;
  box-shadow:var(--shadow-sm);
}
.search:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(6,182,212,.2),var(--shadow-md);
}

.progress-wrap{
  display:flex;
  align-items:center;
  gap:16px;
  margin:0 0 20px;
  font-size:14px;
  color:var(--text-secondary);
  font-weight:600;
}
.progress{
  flex:1;
  height:10px;
  border-radius:99px;
  background:var(--bg-card);
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.3);
}
.progress i{
  display:block;
  height:100%;
  width:0;
  background:var(--gradient-primary);
  border-radius:99px;
  transition:width 1.2s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 10px rgba(6,182,212,.5);
}
.progress-wrap b{color:var(--primary-light);font-family:'Changa';font-size:16px}

.stations{
  list-style:none;
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  background:var(--bg-secondary);
  box-shadow:var(--shadow-xl);
}
.station-row{
  display:grid;
  grid-template-columns:64px 1fr auto auto;
  align-items:center;
  gap:16px;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  transition:all .25s;
  animation:fadeUp .5s both;
  animation-delay:calc(var(--i)*40ms);
  position:relative;
}
.station-row::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:4px;
  background:var(--gradient-primary);
  opacity:0;
  transition:opacity .25s;
}
.station-row:last-child{border-bottom:0}
.station-row:hover{
  background:var(--bg-card);
  padding-inline-start:24px;
}
.station-row:hover::before{opacity:1}
.s-code{
  font:800 15px 'Changa';
  color:var(--primary-light);
  background:rgba(6,182,212,.1);
  border:1.5px solid rgba(6,182,212,.4);
  border-radius:12px;
  text-align:center;
  padding:10px 0;
  min-width:60px;
}
.s-name{font:700 18px 'Changa';color:var(--text-primary)}
.s-status{
  font-size:12px;
  color:var(--text-secondary);
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:4px;
  font-weight:600;
}
.dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--text-muted);
  flex:none;
  box-shadow:0 0 8px currentColor;
}
.s-status.on{color:var(--success)}
.s-status.on .dot{
  background:var(--success);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(16,185,129,.6)}
  70%{box-shadow:0 0 0 10px rgba(16,185,129,0)}
  100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}
}
.s-rev{
  font:700 16px 'Changa';
  color:var(--accent);
  min-width:120px;
  text-align:left;
}
.s-actions{display:flex;gap:10px;align-items:center}

.back-link{
  display:inline-flex;
  gap:10px;
  align-items:center;
  color:var(--text-secondary);
  font-size:14px;
  font-weight:600;
  margin-bottom:16px;
  transition:all .25s;
}
.back-link:hover{color:var(--primary-light);transform:translateX(-4px)}
.station-sign{
  position:relative;
  background:linear-gradient(180deg,var(--bg-card),var(--bg-secondary));
  border:2px solid var(--border);
  border-radius:20px;
  padding:24px 30px;
  display:flex;
  align-items:center;
  gap:20px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:var(--shadow-xl);
}
.station-sign::after{
  content:'';
  position:absolute;
  inset:8px;
  border:1.5px solid rgba(6,182,212,.4);
  border-radius:16px;
  pointer-events:none;
}
.sign-code{
  font:800 22px 'Changa';
  color:var(--bg-primary);
  background:var(--gradient-primary);
  padding:14px 18px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(6,182,212,.4);
}
.station-sign h1{font:800 clamp(24px,4vw,36px) 'Changa';color:var(--text-primary)}
.sign-meta{color:var(--text-secondary);font-size:13px;margin-top:4px;font-weight:600}
.meta-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:20px;
}
@media(max-width:600px){.meta-grid{grid-template-columns:1fr}}
.form-sec{margin-bottom:20px}
.sec-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.sec-ord{
  min-width:60px;height:36px;
  padding:0 12px;
  border-radius:12px;
  background:var(--gradient-primary);
  color:var(--bg-primary);
  font:800 14px 'Changa';
  display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(6,182,212,.4);
}
.sec-head h3{font:700 20px 'Changa';color:var(--text-primary)}
.sec-head .ic{color:var(--primary);width:24px;height:24px}
.sec-sum{
  margin-inline-start:auto;
  font:700 14px 'Changa';
  color:var(--primary-light);
  background:rgba(6,182,212,.1);
  border:1px dashed rgba(6,182,212,.45);
  padding:6px 16px;
  border-radius:99px;
}
.pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
@media(max-width:520px){.pair{grid-template-columns:1fr}}
.sub-row{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  transition:all .25s;
}
.sub-row:hover{border-color:rgba(6,182,212,.3)}
.sub-row:last-child{margin-bottom:0}
.sub-name{
  font:700 15px 'Changa';
  color:var(--primary-light);
  margin-bottom:12px;
  display:flex;
  gap:10px;

async function supaFetch(path,opts={},ms=10000){
  const url=BASE+'/'+path;
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{...opts,signal:c.signal,headers:{...HEADERS,...(opts.headers||{})}});
    return {status:r.status,json:await r.json().catch(()=>null),ok:r.ok};
  }catch(e){
    console.warn('Supabase fetch failed, using mock:',e);
    useMock=true;
    return {status:200,json:null,ok:false};
  }finally{clearTimeout(t);}
}

async function getAllReports(){
  if(useMock)return MOCK_REPORTS.map(fromSnake);
  try{
    const res=await supaFetch('station_reports?select=*');
    if(res.status===200&&Array.isArray(res.json))return res.json.map(fromSnake);
    useMock=true;return MOCK_REPORTS.map(fromSnake);
  }catch(e){useMock=true;return MOCK_REPORTS.map(fromSnake);}
}

async function getAllStations(){
  if(useMock)return MOCK_STATIONS;
  try{
    const res=await supaFetch('stations?select=*&order=id');
    if(res.status===200&&Array.isArray(res.json))return res.json;
    useMock=true;return MOCK_STATIONS;
  }catch(e){useMock=true;return MOCK_STATIONS;}
}

async function saveReport(rec){
  if(useMock){MOCK_REPORTS.push(toSnake(rec));return true;}
  try{
    const res=await supaFetch('station_reports',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(toSnake(rec))},15000);
    return res.ok;
  }catch(e){return false;}
}

async function addStation(code,name){
  if(useMock){MOCK_STATIONS.push({id:MOCK_STATIONS.length+1,code,name});return true;}
  try{
    const res=await supaFetch('stations',{method:'POST',body:JSON.stringify({code,name})});
    return res.ok;
  }catch(e){return false;}
}

async function deleteStation(id){
  if(useMock){const idx=MOCK_STATIONS.findIndex(s=>s.id==id);if(idx>-1)MOCK_STATIONS.splice(idx,1);return true;}
  try{
    const res=await supaFetch('stations?id=eq.'+id,{method:'DELETE'});
    return res.ok;
  }catch(e){return false;}
}

async function login(username,password){

function copyText(t,msg){
  const done=()=>toast(msg||'تم النسخ ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();});}
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
}

function buildDayRows(records,dateStr,stations){
  const byCode=new Map(records.filter(r=>String(r.date)===dateStr).map(r=>[String(r.stationCode),r]));
  const mk=(code,name,rec)=>{
    const z={};
    NUM_FIELDS.forEach(f=>z[f]=rec?num(rec[f]):0);
    return {
      code,name,...z,
      totalCount:COUNT_FIELDS.reduce((a,f)=>a+z[f],0),
      totalRevenue:REV_FIELDS.reduce((a,f)=>a+z[f],0),
      present:!!rec
    };
  };
  const rows=stations.map(s=>mk(s.code,s.name,byCode.get(s.code)));
  byCode.forEach((r,code)=>{
    if(!stations.some(s=>s.code===code))rows.push(mk(code,r.stationName||code,r));
  });
  return rows;
}

function totalsOf(rows){
  return {
    count:rows.reduce((a,r)=>a+r.totalCount,0),
    revenue:rows.reduce((a,r)=>a+r.totalRevenue,0),
    done:rows.filter(r=>r.present).length
  };
}

function drawDash(reports,stations){
  const app=$('#app');
  const dayRows=buildDayRows(reports,dashDate,stations);
  const T=totalsOf(dayRows);
  const top=[...dayRows].filter(r=>r.present).sort((a,b)=>b.totalRevenue-a.totalRevenue)[0];
  app.innerHTML=`<div class="view">
    <div class="board-head">
      <div>
        <h1 class="page-title">لوحة التجميع</h1>
        <p class="page-sub">كل بيانات المحطات في مكان واحد — صدّرها Excel بضغطة</p>
      </div>
      <div class="grow"></div>
      <button class="btn ghost sm" id="dashRefresh">${ic('refresh')} تحديث</button>
      <button class="btn sm" id="exDay">${ic('sheet')} تصدير إحصاء اليوم Excel</button>
      <button class="btn ghost sm" id="exLog">${ic('download')} السجل الكامل</button>
    </div>
    <div class="dash-controls">
      <input type="date" id="dashDate" value="${dashDate}">
      <button class="btn ghost sm" id="todayBtn">اليوم</button>
      <span class="src-badge">${useMock?'وضع محاكاة':'المصدر: Supabase ✓'}</span>
    </div>
    <div class="stats-strip">
      <div class="stat">
        <small>محطات مسجّلة اليوم</small>
        <b>${T.done} / ${dayRows.length}</b>
      </div>
      <div class="stat gold">
        <small>إجمالي الإيرادات</small>
        <b>${money(T.revenue)}</b>
      </div>
      <div class="stat">
        <small>إجمالي العمليات</small>
        <b>${fmt(T.count)}</b>
      </div>
      <div class="stat">
        <small>أعلى محطة إيرادًا</small>
        <b style="font-size:20px;padding-top:8px">${top?esc(top.name):'—'}</b>
      </div>
    </div>
    <div class="table-wrap">
      <table class="gt">
        <thead>
          <tr>
            <th rowspan="2">المحطة</th>
            ${GROUPS.map(g=>`<th colspan="2">${g.t}</th>`).join('')}
            <th rowspan="2">الحالة</th>
          </tr>
          <tr>${GROUPS.map(()=>'<th>عدد</th><th>إيراد</th>').join('')}</tr>
        </thead>
        <tbody>
          ${dayRows.map(r=>`<tr class="${r.present?'':'miss'}">
            <td class="st">${esc(r.name)}</td>
            ${GROUPS.map(g=>`<td>${fmt(r[g.c])}</td><td class="rev">${fmt(r[g.r])}</td>`).join('')}
            <td><span class="st-pill ${r.present?'on':'off'}"><span class="dot"></span>${r.present?'مسجّل':'لم يُسجّل'}</span></td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td class="st">الإجمالي العام</td>
            ${GROUPS.map(g=>{
              const c=dayRows.reduce((a,r)=>a+r[g.c],0),v=dayRows.reduce((a,r)=>a+r[g.r],0);
              return `<td>${fmt(c)}</td><td>${fmt(v)}</td>`;
            }).join('')}
            <td>${T.done} محطة</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="dash-note">ملحوظة: كل الأيام بتتحفظ في نفس الجدول — اختار أي تاريخ من فوق وشوف بيانه.</p>
  </div>`;
  $('#dashDate').addEventListener('change',e=>{dashDate=e.target.value||todayISO();drawDash(reports,stations);});
  $('#todayBtn').addEventListener('click',()=>{dashDate=todayISO();drawDash(reports,stations);});
  $('#dashRefresh').addEventListener('click',renderDash);
  $('#exDay').addEventListener('click',()=>exportDayExcel(dayRows));
  $('#exLog').addEventListener('click',()=>exportLogExcel(reports));
}

async function renderStats(){
  setActive('stats');
  $('#topNav').style.display='';
  $('#logoutBtn').style.display='';
  updateModeChip();
  const app=$('#app');
  app.innerHTML='<div class="view"><p class="loading">جارٍ تحميل الإحصائيات…</p></div>';
  const [reports,stations]=await Promise.all([getAllReports(),getAllStations()]);
  const totalRevenue=reports.reduce((a,r)=>a+num(r.totalRevenue),0);
  const totalTickets=reports.reduce((a,r)=>a+num(r.ticketsCount),0);
  const uniqueDays=new Set(reports.map(r=>r.date)).size;
  const byStation={};
  reports.forEach(r=>{
    if(!byStation[r.stationCode])byStation[r.stationCode]={name:r.stationName,revenue:0,count:0};
    byStation[r.stationCode].revenue+=num(r.totalRevenue);
    byStation[r.stationCode].count+=num(r.totalCount);
  });
  const topStation=Object.entries(byStation).sort((a,b)=>b[1].revenue-a[1].revenue)[0];
  const last7=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayRev=reports.filter(r=>r.date===iso).reduce((a,r)=>a+num(r.totalRevenue),0);
    last7.push({date:iso,day:d.toLocaleDateString('ar-EG',{weekday:'short'}),revenue:dayRev});
  }
  app.innerHTML=`<div class="view">
    <div class="board-head">
      <div>
        <h1 class="page-title">الإحصائيات</h1>
        <p class="page-sub">نظرة عامة على أداء المحطات</p>
      </div>
    </div>
    <div class="stats-strip">
      <div class="stat gold">
        <small>إجمالي الإيرادات</small>
        <b>${money(totalRevenue)}</b>
      </div>
      <div class="stat">
        <small>إجمالي التذاكر</small>
        <b>${fmt(totalTickets)}</b>
      </div>
      <div class="stat">
        <small>أيام مسجلة</small>
        <b>${uniqueDays}</b>
      </div>
      <div class="stat">
        <small>عدد المحطات</small>
        <b>${stations.length}</b>
      </div>
    </div>
    ${topStation?`<div class="card">
      <h2>${ic('chart')} أفضل محطة إيرادًا</h2>
      <div style="font-size:28px;font-weight:800;color:var(--accent)">${esc(topStation[1].name)}</div>
      <div style="color:var(--text-secondary);margin-top:8px">إجمالي الإيرادات: <b style="color:var(--primary-light);font-size:20px">${money(topStation[1].revenue)}</b></div>
    </div>`:''}
    <div class="card">
      <h2>${ic('chart')} الإيرادات — آخر 7 أيام</h2>
      <div class="chart-container"><canvas id="chart7"></canvas></div>
    </div>
    <div class="card">
      <h2>${ic('chart')} ترتيب المحطات حسب الإيراد</h2>
      <div class="chart-container"><canvas id="chartStations"></canvas></div>
    </div>
  </div>`;
  new Chart($('#chart7'),{
    type:'bar',
    data:{
      labels:last7.map(d=>d.day),
      datasets:[{
        label:'الإيراد',
        data:last7.map(d=>d.revenue),
        backgroundColor:'rgba(6,182,212,.6)',
        borderColor:'#06b6d4',
        borderWidth:2,
        borderRadius:8
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#f1f5f9'}}},
      scales:{
        x:{ticks:{color:'#94a3b8'},grid:{color:'rgba(51,65,85,.3)'}},
        y:{ticks:{color:'#94a3b8',callback:v=>fmt(v)+' ج.م'},grid:{color:'rgba(51,65,85,.3)'}}
      }
    }
  });
  const sorted=Object.entries(byStation).sort((a,b)=>b[1].revenue-a[1].revenue);
  new Chart($('#chartStations'),{
    type:'bar',
    data:{
      labels:sorted.map(([k,v])=>v.name),
      datasets:[{
        label:'الإيراد',
        data:sorted.map(([k,v])=>v.revenue),
        backgroundColor:'rgba(245,158,11,.6)',
        borderColor:'#f59e0b',
        borderWidth:2,
        borderRadius:8
      }]
    },
    options:{
      indexAxis:'y',
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#f1f5f9'}}},
      scales:{
        x:{ticks:{color:'#94a3b8',callback:v=>fmt(v)},grid:{color:'rgba(51,65,85,.3)'}},
        y:{ticks:{color:'#94a3b8'},grid:{color:'rgba(51,65,85,.3)'}}
      }
    }
  });
}

async function renderStations(){
  setActive('stations');
  $('#topNav').style.display='';
  $('#logoutBtn').style.display='';
  updateModeChip();
  const app=$('#app');
  app.innerHTML='<div class="view"><p class="loading">جارٍ تحميل المحطات…</p></div>';
  const stations=await getAllStations();
  app.innerHTML=`<div class="view">
    <div class="board-head">
      <div>
        <h1 class="page-title">إدارة المحطات</h1>
        <p class="page-sub">إضافة وحذف المحطات</p>
      </div>
    </div>
    <div class="card">
      <h2>${ic('plus')} إضافة محطة جديدة</h2>
      <form id="addStForm" style="display:flex;gap:12px;flex-wrap:wrap">
        <input type="text" id="newCode" placeholder="الكود (مثل: ABC)" required style="flex:1;min-width:140px;background:var(--bg-primary);border:1.5px solid var(--border);color:var(--text-primary);padding:12px;border-radius:12px;font-family:inherit">
        <input type="text" id="newName" placeholder="اسم المحطة" required style="flex:2;min-width:220px;background:var(--bg-primary);border:1.5px solid var(--border);color:var(--text-primary);padding:12px;border-radius:12px;font-family:inherit">
        <button class="btn" type="submit">${ic('plus')} إضافة</button>
      </form>
    </div>
    <div class="card">
      <h2>${ic('board')} المحطات الحالية (${stations.length})</h2>
      <div class="st-mng">
        ${stations.map(s=>`<div class="st-mng-row">
          <span class="s-code">${esc(s.code)}</span>
          <b>${esc(s.name)}</b>
          <button class="icon-btn" data-copy="${esc(stationLink(s))}" title="نسخ الرابط">${ic('link')}</button>
          <button class="icon-btn" data-del="${s.id}" title="حذف المحطة">${ic('trash')}</button>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
  $('#addStForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const code=$('#newCode').value.trim().toUpperCase();
    const name=$('#newName').value.trim();
    if(!code||!name)return toast('املأ كل الحقول');
    const ok=await addStation(code,name);
    if(ok){
      const auth=getAuth();
      await addAudit('إضافة محطة',{code,name},auth?.username);
      toast('تمت إضافة المحطة ✓');
      renderStations();
    }else{
      toast('فشل الإضافة — الكود موجود بالفعل؟');
    }
  });
  $$('[data-del]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.del;
    const s=stations.find(x=>x.id==id);
    if(confirm('حذف محطة '+(s?s.name:'')+'؟')){
      const ok=await deleteStation(id);
      if(ok){
        const auth=getAuth();
        await addAudit('حذف محطة',{code:s.code,name:s.name},auth?.username);
        toast('تم الحذف ✓');
        renderStations();
      }
    }
  });
}

function exportDayExcel(dayRows){
  const T=totalsOf(dayRows);
  const aoa=[
    ['تقرير إحصاء المحطات — مونوريل شرق النيل'],
    ['التاريخ: '+dashDate+'  ('+fmtDateAr(dashDate)+')','','','','','','','','','','','','','','','','','المسجّل: '+T.done+' من '+dayRows.length],
    [],
    ['المحطة','التذاكر','','الاشتراكات','','','','','','كروت الاشتراكات','','كروت المحفظة','','شحن المحفظة','','الإجمالي','','الحالة'],
    ['','عدد','إيراد','أسبوعي (عدد)','أسبوعي (إيراد)','شهري (عدد)','شهري (إيراد)','ربع سنوي (عدد)','ربع سنوي (إيراد)','عدد','إيراد','عدد','إيراد','عدد','إيراد','عدد','إيراد','']
  ];
  dayRows.forEach(r=>aoa.push([
    r.name,r.ticketsCount,r.ticketsRevenue,
    r.weekCount,r.weekRevenue,r.monthCount,r.monthRevenue,r.quarterCount,r.quarterRevenue,
    r.subCardsCount,r.subCardsRevenue,r.walletCardsCount,r.walletCardsRevenue,
    r.rechargeCount,r.rechargeRevenue,
    r.totalCount,r.totalRevenue,
    r.present?'مسجّل':'لم يُسجّل'
  ]));
  const totalRow=['الإجمالي العام'];
  GROUPS.forEach((g,idx)=>{
    const col1=String.fromCharCode(66+idx*2);
    const col2=String.fromCharCode(67+idx*2);
    const endRow=5+dayRows.length;
    totalRow.push(`=SUM(${col1}5:${col1}${endRow})`);
    totalRow.push(`=SUM(${col2}5:${col2}${endRow})`);
  });
  totalRow.push(T.done+' محطة');
  aoa.push(totalRow);
  if(!window.XLSX)return;
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:17}},
    {s:{r:3,c:0},e:{r:4,c:0}},
    {s:{r:3,c:1},e:{r:3,c:2}},{s:{r:3,c:3},e:{r:3,c:8}},
    {s:{r:3,c:9},e:{r:3,c:10}},{s:{r:3,c:11},e:{r:3,c:12}},{s:{r:3,c:13},e:{r:3,c:14}},
    {s:{r:3,c:15},e:{r:3,c:16}},{s:{r:3,c:17},e:{r:4,c:17}}
  ];
  ws['!cols']=[{wch:22},...Array(16).fill({wch:14}),{wch:12}];
  ws['!rows']=[{hpt:32},{hpt:24},{hpt:10},{hpt:28},{hpt:24}];
  for(let R=0;R<=aoa.length-1;R++){
    for(let C=0;C<=17;C++){
      const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(cell){
        if(R===0){
          cell.s={fill:{fgColor:{rgb:'06B6D4'}},font:{bold:true,color:{rgb:'FFFFFF'},size:16},alignment:{horizontal:'center'}};
        }else if(R===3||R===4){
          cell.s={fill:{fgColor:{rgb:'1E293B'}},font:{bold:true,color:{rgb:'67E8F9'},size:13},alignment:{horizontal:'center'}};
        }else if(R===aoa.length-1){
          cell.s={fill:{fgColor:{rgb:'10B981'}},font:{bold:true,color:{rgb:'FFFFFF'},size:14},alignment:{horizontal:'center'}};
        }else if(C===0&&R>4&&R<aoa.length-1){
          cell.s={font:{bold:true,size:13},alignment:{horizontal:'right'}};
        }
      }
    }
  }
  const wb=XLSX.utils.book_new();
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'إحصاء '+dashDate);
  XLSX.writeFile(wb,'إحصاء محطات المونوريل '+dashDate+'.xlsx');
  toast('تم تنزيل ملف Excel ✓');
}

function exportLogExcel(records){
  const AR={
    stationCode:'كود المحطة',stationName:'المحطة',date:'التاريخ',
    ticketsCount:'عدد التذاكر',ticketsRevenue:'إيراد التذاكر',
    weekCount:'اشتراك أسبوعي (عدد)',weekRevenue:'اشتراك أسبوعي (إيراد)',
    monthCount:'اشتراك شهري (عدد)',monthRevenue:'اشتراك شهري (إيراد)',
    quarterCount:'اشتراك ربع سنوي (عدد)',quarterRevenue:'اشتراك ربع سنوي (إيراد)',
    subCardsCount:'كروت اشتراكات (عدد)',subCardsRevenue:'كروت اشتراكات (إيراد)',
    walletCardsCount:'كروت محفظة (عدد)',walletCardsRevenue:'كروت محفظة (إيراد)',
    rechargeCount:'شحن محفظة (عدد)',rechargeRevenue:'شحن محفظة (إيراد)',
    totalCount:'إجمالي العدد',totalRevenue:'إجمالي الإيراد',
    submittedBy:'المُسجِّل',submittedAt:'وقت التسجيل'
  };
  const sorted=[...records].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const aoa=[FIELDS.map(f=>AR[f]),...sorted.map(r=>FIELDS.map(f=>r[f]??''))];
  if(!window.XLSX)return;
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:22},{wch:12},...Array(16).fill({wch:15}),{wch:14},{wch:22}];
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:FIELDS.length-1}})};
  const wb=XLSX.utils.book_new();
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'السجل الكامل');
  XLSX.writeFile(wb,'سجل بيانات مونوريل شرق النيل.xlsx');
  toast('تم تنزيل السجل الكامل ✓');
}
