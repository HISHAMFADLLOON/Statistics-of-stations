<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
--bg-primary:#0a0e1a;--bg-secondary:#111827;
--surface:rgba(30,41,59,.6);--surface-hover:rgba(30,41,59,.85);
--grad-primary:linear-gradient(135deg,#667eea,#764ba2);
--grad-accent:linear-gradient(135deg,#4facfe,#00f2fe);
--grad-gold:linear-gradient(135deg,#f6d365,#fda085);
--grad-mix:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#4facfe 100%);
--border-light:rgba(255,255,255,.08);--border-medium:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.18);
--shadow-md:0 8px 24px rgba(0,0,0,.4);--shadow-lg:0 16px 48px rgba(0,0,0,.5);--shadow-xl:0 24px 64px rgba(0,0,0,.6);
--font-primary:'IBM Plex Sans Arabic',sans-serif;--font-display:'Changa',sans-serif;
--r-md:12px;--r-lg:16px;--r-xl:24px;--r-2xl:32px;
--tr-base:.3s cubic-bezier(.4,0,.2,1);
--tx:#e2e8f0;--tx-dim:rgba(255,255,255,.6);
--ok:#43e97b;--warn:#fa709a;--gold:#f6d365;--pr:#667eea;
}
[data-theme=light]{
--bg-primary:#f8fafc;--bg-secondary:#eef2f7;
--surface:rgba(255,255,255,.75);--surface-hover:rgba(255,255,255,.95);
--border-light:rgba(0,0,0,.06);--border-medium:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.16);
--shadow-md:0 8px 24px rgba(0,0,0,.1);--shadow-lg:0 16px 48px rgba(0,0,0,.14);--shadow-xl:0 24px 64px rgba(0,0,0,.18);
--tx:#0f172a;--tx-dim:rgba(15,23,42,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-primary);color:var(--tx);background:var(--bg-primary);min-height:100vh;overflow-x:hidden;line-height:1.6}
.bg-animation{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-animation::before{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle at 20% 50%,rgba(102,126,234,.15) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(240,147,251,.12) 0%,transparent 50%),radial-gradient(circle at 40% 20%,rgba(79,172,254,.12) 0%,transparent 50%);animation:rotate 40s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--grad-primary);border-radius:99px}
::selection{background:rgba(102,126,234,.35);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(67,233,123,.5)}70%{box-shadow:0 0 0 10px rgba(67,233,123,0)}100%{box-shadow:0 0 0 0 rgba(67,233,123,0)}}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 0 rgba(102,126,234,0)}50%{text-shadow:0 0 18px rgba(102,126,234,.5)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
.view{animation:fadeIn .5s var(--tr-base) both}
#nprogress{position:fixed;top:0;left:0;right:0;height:3px;z-index:2000;pointer-events:none;opacity:0}
#nprogress i{display:block;height:100%;width:0;background:var(--grad-mix);transition:width .3s}
#nprogress.on{opacity:1}
#splash{position:fixed;inset:0;z-index:1000;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#splash.off{opacity:0;pointer-events:none}
.splash-container{text-align:center}
.splash-icon{width:140px;height:140px;background:#fff;border-radius:var(--r-2xl);display:flex;align-items:center;justify-content:center;font-size:70px;margin:auto;box-shadow:0 24px 70px rgba(102,126,234,.35);animation:pop .8s var(--tr-base),float 3.2s ease-in-out .9s infinite}
.splash-icon img{width:100%;height:100%;object-fit:cover;border-radius:var(--r-2xl)}
.splash-title{font:800 34px var(--font-display);margin-top:26px;background:var(--grad-mix);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.splash-subtitle{color:var(--tx-dim);margin-top:8px}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.82);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-light)}
[data-theme=light] .topbar{background:rgba(248,250,252,.88)}
.topbar-in{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-badge{width:44px;height:44px;border-radius:var(--r-lg);background:var(--grad-primary);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow-md);overflow:hidden}
.brand-badge img{width:100%;height:100%;object-fit:cover}
.brand b{font:700 20px var(--font-display);color:var(--tx)}
.brand small{color:var(--tx-dim);font-size:12px}
nav.top-nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
nav.top-nav a{padding:9px 16px;border-radius:var(--r-md);color:var(--tx-dim);font-weight:500;font-size:14px;transition:all var(--tr-base)}
nav.top-nav a:hover{color:var(--tx);background:rgba(255,255,255,.05)}
nav a.active{color:#fff;background:var(--grad-primary);box-shadow:var(--shadow-md)}
.head-meta{display:flex;align-items:center;gap:8px}
#clockTime{font:700 18px var(--font-display);color:var(--pr)}
#clockDate{font-size:12px;color:var(--tx-dim)}
.chip{font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px}
.chip.ok{color:var(--ok);background:rgba(67,233,123,.15)}
.chip.warn{color:var(--warn);background:rgba(250,112,154,.15)}
@media(max-width:900px){nav.top-nav{display:none}}
.bottom-nav{display:none;position:fixed;bottom:14px;left:14px;right:14px;z-index:60;background:rgba(10,14,26,.88);backdrop-filter:blur(20px);border:1px solid var(--border-medium);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:8px;gap:6px}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tx-dim);font-size:11px;font-weight:600;padding:9px 4px;border-radius:var(--r-lg);transition:all var(--tr-base)}
.bottom-nav a.active{color:#fff;background:var(--grad-primary)}
@media(max-width:900px){.bottom-nav{display:flex}main{padding-bottom:110px}}
.fab{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;width:58px;height:58px;border-radius:var(--r-xl);background:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(102,126,234,.4);overflow:hidden;animation:float 3.2s ease-in-out infinite}
.fab img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.fab{display:flex}}
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:32px 24px}
.crumbs{font-size:12px;color:var(--tx-dim);margin-bottom:12px}
.crumbs a{color:var(--pr)}
footer{position:relative;z-index:10;border-top:1px solid var(--border-light);padding:26px 20px;text-align:center;margin-top:44px}
.footer-powered{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border-medium);border-radius:99px;font:700 16px var(--font-display);box-shadow:var(--shadow-md)}
.footer-powered .name{background:var(--grad-mix);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:18px}
.footer-subtitle{margin-top:14px;font-size:13px;color:var(--tx-dim)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;background:var(--grad-primary);color:#fff;font-family:var(--font-primary);font-weight:600;font-size:14px;border:none;border-radius:var(--r-lg);cursor:pointer;overflow:hidden;transition:all var(--tr-base);box-shadow:var(--shadow-md);text-decoration:none}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 50%);opacity:0;transition:opacity var(--tr-base)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg),0 0 30px rgba(102,126,234,.5)}
.btn:hover::before{opacity:1}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;border:1px solid var(--border-medium);color:var(--tx)}
.btn.ghost:hover{background:rgba(255,255,255,.05);border-color:var(--border-strong)}
.btn.navy{background:var(--surface);color:var(--pr);border:1px solid var(--border-medium)}
.btn.danger{background:transparent;border:1px solid rgba(250,112,154,.5);color:var(--warn)}
.btn.sm{padding:9px 14px;font-size:12px}
.btn.big{padding:14px 28px;font-size:16px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--r-lg);border:1px solid var(--border-medium);background:var(--surface);color:var(--tx-dim);position:relative;overflow:hidden;transition:all var(--tr-base)}
.icon-btn:hover{color:var(--tx);background:var(--surface-hover)}
.icon-btn.is-fav{color:var(--gold);border-color:rgba(246,211,101,.5)}
.icon-btn svg{width:18px;height:18px}
.spin{animation:rot 1s linear infinite}
.card{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border-medium);border-radius:var(--r-xl);padding:24px;margin-bottom:24px;box-shadow:var(--shadow-lg);transition:all var(--tr-base)}
.card:hover{border-color:var(--border-strong)}
.card h2{font:700 21px var(--font-display);margin-bottom:16px;display:flex;gap:10px;align-items:center;color:var(--tx)}
.board-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font:800 44px var(--font-display);background:var(--grad-mix);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em;margin-bottom:4px}
.page-sub{color:var(--tx-dim);font-size:16px}
.board-head .grow{flex:1}
.search{background:rgba(0,0,0,.2);border:1px solid var(--border-light);border-radius:var(--r-lg);color:var(--tx);padding:12px 16px;width:260px;transition:all var(--tr-base)}
.search:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(102,126,234,.2)}
.progress-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;color:var(--tx-dim)}
.progress{flex:1;height:10px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--grad-mix);transition:width 1.2s var(--tr-base)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.feed-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border-light)}
.feed-item:last-child{border-bottom:0}
.stations{list-style:none;border:1px solid var(--border-medium);border-radius:var(--r-xl);overflow:hidden;background:var(--surface);backdrop-filter:blur(20px);box-shadow:var(--shadow-lg)}
.station-row{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border-light);transition:background .2s}
.station-row:hover{background:rgba(255,255,255,.03)}
.station-row:last-child{border-bottom:0}
.s-code{font:800 15px var(--font-display);color:var(--pr);background:rgba(102,126,234,.12);border-radius:var(--r-lg);text-align:center;padding:11px 0}
.s-name{font:700 18px var(--font-display);color:var(--tx)}
.s-status{font-size:12px;color:var(--tx-dim);display:flex;align-items:center;gap:8px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx-dim)}
.s-status.on{color:var(--ok)}
.s-status.on .dot{background:var(--ok)}
.s-status.late{color:var(--warn)}
.s-status.late .dot{background:var(--warn)}
.s-rev{font:700 16px var(--font-display);color:var(--gold);animation:pulseGlow 2.4s ease-in-out infinite}
.s-actions{display:flex;gap:10px;align-items:center}
.chips-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:12px}
.chip-btn{flex:none;padding:9px 15px;border-radius:99px;background:var(--surface);border:1px solid var(--border-medium);color:var(--tx-dim);font:600 12px var(--font-primary);transition:all var(--tr-base)}
.chip-btn:hover{color:var(--tx)}
.station-sign{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border-medium);border-radius:var(--r-xl);padding:22px 28px;display:flex;align-items:center;gap:20px;margin-bottom:18px;box-shadow:var(--shadow-lg)}
.sign-code{font:800 22px var(--font-display);color:#fff;background:var(--grad-primary);padding:14px 20px;border-radius:var(--r-lg);box-shadow:var(--shadow-md)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border-light)}
.sec-ord{min-width:56px;height:34px;border-radius:var(--r-md);background:var(--grad-primary);color:#fff;font:800 14px var(--font-display);display:grid;place-items:center;box-shadow:var(--shadow-md)}
.sec-sum{margin-inline-start:auto;font:700 14px var(--font-display);color:var(--pr);background:rgba(102,126,234,.12);padding:7px 16px;border-radius:99px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub-row{background:rgba(0,0,0,.15);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.sub-name{font:700 15px var(--font-display);color:var(--pr);margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--tx-dim);margin-bottom:8px;font-weight:600}
.in-wrap{position:relative}
.in-wrap input{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--border-light);border-radius:var(--r-lg);color:var(--tx);font:600 18px var(--font-display);padding:12px 16px;transition:all var(--tr-base)}
.in-wrap input:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(102,126,234,.2)}
.in-wrap input.has-unit{padding-left:56px}
.unit{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--tx-dim)}
.totals-bar{position:sticky;bottom:16px;margin-top:22px;background:var(--grad-gold);color:#241703;border-radius:var(--r-xl);padding:18px 24px;display:flex;gap:28px;flex-wrap:wrap;z-index:30;box-shadow:var(--shadow-xl)}
.tot-item b{font:800 26px var(--font-display)}
.totals-bar .btn{margin-inline-start:auto}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-medium);border-radius:var(--r-xl);background:var(--surface);backdrop-filter:blur(20px);overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow-lg)}
.stat{padding:20px 22px;position:relative}
.stat+.stat{border-inline-start:1px solid var(--border-light)}
.stat small{color:var(--tx-dim);font-size:12px;font-weight:600;letter-spacing:.05em}
.stat b{display:block;font:800 28px var(--font-display);margin-top:6px;color:var(--tx)}
.stat.gold b{color:var(--gold);animation:pulseGlow 2.4s ease-in-out infinite}
@media(max-width:900px){.stats-strip{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}.stat:nth-child(3),.stat:nth-child(4){border-top:1px solid var(--border-light)}}
.table-wrap{overflow:auto;border:1px solid var(--border-medium);border-radius:var(--r-xl);background:var(--surface);backdrop-filter:blur(20px);box-shadow:var(--shadow-lg)}
table.gt{border-collapse:separate;border-spacing:0;min-width:1600px;width:100%}
.gt th,.gt td{padding:12px 14px;border-bottom:1px solid var(--border-light);text-align:center;font-size:13px;white-space:nowrap;color:var(--tx)}
.gt thead th{background:rgba(0,0,0,.3);color:var(--pr);font:700 12px var(--font-display);letter-spacing:.05em;border-bottom:1px solid var(--border-medium)}
.gt tbody tr{transition:background .2s}
.gt tbody tr:hover{background:rgba(255,255,255,.03)}
.gt td.st{text-align:right;font:700 15px var(--font-display)}
.gt td:first-child,.gt thead th:first-child{position:sticky;right:0;background:var(--bg-secondary)}
.gt .rev{color:var(--gold)}
.gt tfoot td{background:rgba(67,233,123,.1);color:var(--ok);font:800 15px var(--font-display)}
.st-pill{font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px}
.st-pill.on{color:var(--ok);background:rgba(67,233,123,.15)}
.st-pill.off{color:var(--warn);background:rgba(250,112,154,.15)}
.login-box{max-width:440px;margin:70px auto;padding:38px;background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border-medium);border-radius:var(--r-2xl);box-shadow:var(--shadow-xl)}
.login-box h2{font:800 28px var(--font-display);text-align:center;margin-bottom:22px;background:var(--grad-mix);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay{position:fixed;inset:0;background:rgba(10,14,26,.85);backdrop-filter:blur(12px);display:grid;place-items:center;z-index:100;padding:20px}
.overlay[hidden]{display:none}
.okring{width:90px;height:90px;margin:0 auto 18px}
.success-box{text-align:center;max-width:480px}
.receipt{background:var(--grad-gold);color:#241703;border-radius:var(--r-xl);padding:24px;text-align:right;margin-bottom:20px;box-shadow:var(--shadow-xl)}
.receipt .r-line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.receipt .perf{border-top:2px dashed rgba(0,0,0,.2);margin:16px 0}
.success-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.qr-box{background:var(--grad-gold);border-radius:var(--r-2xl);padding:28px;text-align:center;color:#241703;max-width:360px;box-shadow:var(--shadow-xl)}
.audit-list{display:flex;flex-direction:column;gap:10px}
.audit-item{background:rgba(0,0,0,.15);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:16px;display:flex;gap:16px}
.st-mng{display:flex;flex-direction:column;gap:10px}
.st-mng-row{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.15);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:12px 16px}
.danger-zone{border:1px solid rgba(250,112,154,.35);background:rgba(250,112,154,.06);border-radius:var(--r-xl);padding:22px;margin-top:22px}
.pal-box{width:min(560px,92vw);background:var(--bg-secondary);border:1px solid var(--border-medium);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-xl)}
.pal-box input{width:100%;background:transparent;border-bottom:1px solid var(--border-light);color:var(--tx);padding:15px 16px;font-size:15px}
.pal-list{max-height:50vh;overflow:auto}
.pal-item{padding:12px 16px;cursor:pointer;transition:background .2s}
.pal-item:hover{background:rgba(102,126,234,.12)}
.unsaved-warning{position:fixed;top:20px;right:20px;background:var(--grad-gold);color:#241703;padding:12px 20px;border-radius:var(--r-lg);z-index:1000;display:none;font-weight:700;box-shadow:var(--shadow-xl)}
.unsaved-warning.show{display:block;animation:slideRight .3s var(--tr-base)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--bg-secondary);border:1px solid var(--border-medium);color:var(--tx);padding:14px 26px;border-radius:var(--r-lg);z-index:200;font-weight:600;max-width:90vw;text-align:center;transition:all var(--tr-base);box-shadow:var(--shadow-lg)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:8px;flex-wrap:wrap}
.stats-tab{padding:10px 18px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border-medium);color:var(--tx-dim);font:600 13px var(--font-primary);cursor:pointer;transition:all var(--tr-base);white-space:nowrap}
.stats-tab:hover{color:var(--tx)}
.stats-tab.active{background:var(--grad-primary);color:#fff;box-shadow:var(--shadow-md)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.kpi-card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border-medium);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;transition:all var(--tr-base)}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-xl)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad-primary)}
.kpi-label{font-size:11px;color:var(--tx-dim);letter-spacing:.05em;font-weight:600;margin-bottom:8px}
.kpi-value{font:800 26px var(--font-display);color:var(--tx);margin-bottom:4px}
.kpi-sub{font-size:11px;color:var(--tx-dim);display:flex;align-items:center;gap:6px}
.kpi-sub.up{color:var(--ok)}
.kpi-sub.down{color:var(--warn)}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:900px){.adv-grid{grid-template-columns:1fr}}
.adv-row{display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,.15);border-radius:var(--r-md)}
.ai-insight{background:rgba(102,126,234,.08);border:1px solid rgba(102,126,234,.3);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.ai-insight-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-insight-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--grad-primary);display:grid;place-items:center}
.ai-insight-icon svg{width:20px;height:20px;color:#fff}
.ai-insight-title{font:700 15px var(--font-display);color:var(--tx)}
.ai-insight-body{font-size:13px;line-height:1.7;color:var(--tx-dim)}
.ai-insight-body b{color:var(--tx)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:14px;background:rgba(0,0,0,.15);border:1px solid var(--border-light);border-radius:var(--r-lg)}
.filter-bar input,.filter-bar select{background:rgba(0,0,0,.2);border:1px solid var(--border-light);border-radius:var(--r-md);padding:8px 12px;color:var(--tx);font-size:13px}
.filter-bar label{font-size:11px;color:var(--tx-dim);font-weight:600}
.filter-group{display:flex;flex-direction:column;gap:4px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font:700 12px var(--font-display);margin-left:8px}
.rank-badge.gold{background:var(--grad-gold);color:#241703}
.rank-badge.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#241703}
.rank-badge.bronze{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff}
.skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-md)}
.sk-row{height:70px;margin:10px 0}
.sk-wrap{padding:14px}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .6s linear;background:rgba(255,255,255,.5);pointer-events:none}
.empty{padding:50px 20px;text-align:center;color:var(--tx-dim)}
@media(max-width:760px){.page-title{font-size:32px}.station-row{grid-template-columns:52px 1fr}.s-rev{display:none}.s-actions{grid-column:1/-1}.card{padding:18px}}

variance:function(a){if(a.length<2)return 0;var m=this.mean(a);return a.reduce(function(s,v){return s+Math.pow(v-m,2);},0)/(a.length-1);},
min:function(a){return a.length?Math.min.apply(null,a):0;},
