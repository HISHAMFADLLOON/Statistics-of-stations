<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1e2e">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg0:#0a0e1a;--bg1:#0f1724;--bg2:#151f32;--line:#1e293b;
  --acc:#06b6d4;--acc-d:#0891b2;--acc-lite:#67e8f9;
  --gold:#f59e0b;--cream:#fef3c7;
  --ink:#f1f5f9;--muted:#94a3b8;--green:#10b981;--red:#ef4444;
  --purple:#8b5cf6;--orange:#f97316;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,var(--bg0) 0%,var(--bg1) 50%,var(--bg2) 100%);}
::selection{background:rgba(6,182,212,.35)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;touch-action:manipulation}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:9px}
.ic{width:20px;height:20px;flex:none}

/* أنيميشن المونوريل */
.track-strip{position:fixed;bottom:0;left:0;right:0;height:80px;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,transparent 0%,rgba(6,182,212,.05) 100%)}
.track-strip::before{content:'';position:absolute;bottom:20px;left:0;right:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.3}
.mtrain{position:absolute;bottom:25px;left:-150px;animation:ride 20s linear infinite;filter:drop-shadow(0 4px 12px rgba(6,182,212,.4))}
@keyframes ride{to{left:110%}}
.mtrain .body{width:140px;height:24px;background:linear-gradient(180deg,var(--acc-lite),var(--acc));border-radius:12px 16px 8px 8px;position:relative;overflow:hidden}
.mtrain .body::before{content:'';position:absolute;left:10px;right:10px;top:6px;height:8px;
  background:repeating-linear-gradient(90deg,var(--bg0) 0 12px,var(--acc-lite) 12px 16px);border-radius:3px}
.mtrain .body::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--bg0);opacity:.3}

#splash{position:fixed;inset:0;z-index:300;background:var(--bg0);display:grid;place-items:center;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
.splash-in{text-align:center;display:grid;gap:6px;justify-items:center}
.splash-badge{width:86px;height:86px;border-radius:22px;background:linear-gradient(160deg,var(--acc),var(--acc-d));display:grid;place-items:center;font-size:46px;box-shadow:0 12px 40px rgba(6,182,212,.4);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.splash-in b{font:800 24px 'Changa'}
.splash-in small{color:var(--muted);font-weight:600}

.bottom-nav{display:none;position:fixed;bottom:0;inset-inline:0;z-index:60;background:rgba(15,23,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;padding:7px 0;border-radius:10px;transition:.2s}
.bottom-nav a .ic{width:21px;height:21px}
.bottom-nav a.active{color:var(--acc-lite)}
@media(max-width:900px){.bottom-nav{display:flex}main{padding-bottom:120px}}

.topbar{position:sticky;top:0;z-index:50;background:rgba(15,23,36,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1160px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,var(--acc),var(--acc-d));display:grid;place-items:center;box-shadow:0 5px 16px rgba(6,182,212,.35)}
.brand-badge .ic{width:26px;height:26px;color:var(--bg0)}
.brand b{font:800 19px/1.1 'Changa';display:block}
.brand small{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px}
nav.top-nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
nav.top-nav a{padding:8px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;transition:.2s;display:flex;gap:7px;align-items:center}
nav.top-nav a .ic{width:16px;height:16px}
nav.top-nav a:hover{color:var(--ink);background:#1e293b}
nav a.active{color:var(--acc-lite);background:rgba(6,182,212,.15)}
.head-meta{display:flex;align-items:center;gap:8px}
#clockTime{font:700 17px 'Changa';color:var(--acc-lite)}
#clockDate{font-size:11px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block}
.chip.ok{color:#34d399;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4)}
.chip.warn{color:#fbbf24;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4)}
@media(max-width:900px){nav.top-nav{display:none}}

main{position:relative;z-index:1;max-width:1160px;margin:auto;padding:26px 20px 80px}
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:16px 20px 24px;color:#64748b;font-size:12.5px;text-align:center}
.view{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.loading{color:var(--muted);padding:40px 0;text-align:center;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,var(--acc),var(--acc-d));color:var(--bg0);font:700 14px 'IBM Plex Sans Arabic';padding:10px 18px;border-radius:11px;border:0;cursor:pointer;transition:.2s;box-shadow:0 6px 16px rgba(6,182,212,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,182,212,.45)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc-lite)}
.btn.navy{background:#1e293b;color:var(--acc-lite);border:1.5px solid #334155;box-shadow:none}
.btn.danger{background:transparent;border:1.5px solid rgba(239,68,68,.5);color:var(--red);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.big{padding:12px 26px;font-size:15px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#1e293b;color:var(--muted);cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--acc-lite);border-color:var(--acc);transform:translateY(-2px)}
.icon-btn .ic{width:17px;height:17px}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.board-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-title{font:800 30px 'Changa'}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.board-head .grow{flex:1}
.search{background:#1e293b;border:1.5px solid var(--line);border-radius:11px;color:var(--ink);padding:10px 14px;font-family:inherit;width:220px;transition:.2s}
.search:focus{outline:0;border-color:var(--acc)}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:13px;color:var(--muted);font-weight:600}
.progress{flex:1;height:9px;border-radius:99px;background:#1e293b;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc-lite));border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.progress-wrap b{color:var(--acc-lite);font-family:'Changa'}
.stations{list-style:none;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0f1724;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.station-row{display:grid;grid-template-columns:58px 1fr auto auto;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #1e293b;transition:background .2s;animation:fadeUp .5s both;animation-delay:calc(var(--i)*35ms)}
.station-row:last-child{border-bottom:0}
.station-row:hover{background:#1e293b}
.s-code{font:800 14px 'Changa';color:var(--acc-lite);background:rgba(6,182,212,.1);border:1.5px solid rgba(6,182,212,.4);border-radius:10px;text-align:center;padding:9px 0}
.s-name{font:700 17px 'Changa'}
.s-status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#475569;flex:none}
.s-status.on{color:#34d399}
.s-status.on .dot{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.s-rev{font:700 15px 'Changa';color:#fbbf24;min-width:105px;text-align:left}
.s-actions{display:flex;gap:8px;align-items:center}

.back-link{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:14px;transition:.2s}
.back-link:hover{color:var(--acc-lite)}
.station-sign{position:relative;background:linear-gradient(180deg,#1e293b,#0f1724);border:2px solid #334155;border-radius:18px;padding:20px 26px;display:flex;align-items:center;gap:18px;overflow:hidden;margin-bottom:16px}
.station-sign::after{content:'';position:absolute;inset:7px;border:1.5px solid rgba(6,182,212,.45);border-radius:12px;pointer-events:none}
.sign-code{font:800 20px 'Changa';color:var(--bg0);background:linear-gradient(160deg,var(--acc),var(--acc-d));padding:12px 15px;border-radius:12px;box-shadow:0 6px 16px rgba(6,182,212,.35)}
.station-sign h1{font:800 clamp(22px,4vw,32px) 'Changa'}
.sign-meta{color:var(--muted);font-size:12.5px;margin-top:3px;font-weight:600}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:560px){.meta-grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#1e293b,#0f1724);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.35);margin-bottom:16px}
.card h2{font:700 20px 'Changa';margin-bottom:12px;display:flex;gap:9px;align-items:center}
.card h2 .ic{color:var(--acc)}
.form-sec{margin-bottom:16px}
.sec-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.sec-ord{min-width:56px;height:32px;padding:0 10px;border-radius:10px;background:linear-gradient(160deg,var(--acc),var(--acc-d));color:var(--bg0);font:800 13.5px 'Changa';display:grid;place-items:center;box-shadow:0 4px 10px rgba(6,182,212,.3)}
.sec-head h3{font:700 19px 'Changa'}
.sec-head .ic{color:var(--acc);width:22px;height:22px}
.sec-sum{margin-inline-start:auto;font:700 13.5px 'Changa';color:var(--acc-lite);background:rgba(6,182,212,.1);border:1px dashed rgba(6,182,212,.45);padding:4px 13px;border-radius:999px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.pair{grid-template-columns:1fr}}
.sub-row{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sub-row:last-child{margin-bottom:0}
.sub-name{font:700 14px 'Changa';color:#67e8f9;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.sub-name::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--acc)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.in-wrap{position:relative}
.in-wrap input{width:100%;background:#0f1724;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font:600 18px 'Changa';padding:11px 14px;transition:border-color .2s,box-shadow .2s}
.in-wrap input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
.in-wrap input.has-unit{padding-left:52px}
.unit{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-weight:700}
.totals-bar{position:sticky;bottom:14px;margin-top:22px;background:var(--cream);color:#1e293b;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:24px;box-shadow:0 16px 40px rgba(0,0,0,.5);border:2px dashed #d4a574;z-index:30;flex-wrap:wrap}
.tot-item small{display:block;font-size:10.5px;color:#64748b;font-weight:700}
.tot-item b{font:800 23px 'Changa';color:#0f1724;display:inline-block}
.tot-item.money b{color:#b45309}
.totals-bar .btn{margin-inline-start:auto}
.bump{animation:bump .35s}
@keyframes bump{45%{transform:scale(1.14)}}

.dash-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
input[type=date]{background:#1e293b;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px}
input[type=date]:focus{outline:0;border-color:var(--acc)}
.src-badge{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#1e293b,#0f1724);overflow:hidden;margin-bottom:16px}
.stat{padding:15px 18px;border-inline-start:1px dashed #334155}
.stat:first-child{border-inline-start:0}
.stat small{color:var(--muted);font-size:11.5px;font-weight:700}
.stat b{display:block;font:800 25px 'Changa';margin-top:2px;font-variant-numeric:tabular-nums}
.stat.gold b{color:var(--gold)}
@media(max-width:860px){.stats-strip{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#0f1724;box-shadow:0 14px 40px rgba(0,0,0,.35)}
table.gt{border-collapse:collapse;min-width:1250px;width:100%}
.gt th,.gt td{padding:9px 10px;border-bottom:1px solid #1e293b;text-align:center;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gt thead th{background:#1e293b;color:var(--acc-lite);font:700 12.5px 'Changa';border-bottom:2px solid #475569}
.gt tbody tr{transition:background .15s}
.gt tbody tr:hover{background:#1e293b}
.gt td.st{text-align:right;font:700 14.5px 'Changa'}
.gt td:first-child,.gt thead th:first-child{position:sticky;right:0;background:#0f1724;z-index:1}
.gt thead th:first-child{background:#1e293b;z-index:2}
.gt .rev{color:#fbbf24}
.gt tr.miss td{color:#64748b}
.gt tfoot td{background:#064e3b;color:#67e8f9;font:800 14px 'Changa';border-top:2px solid var(--green);border-bottom:0}
.st-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.st-pill.on{color:#34d399;background:rgba(16,185,129,.1)}
.st-pill.off{color:#f87171;background:rgba(239,68,68,.1)}
.dash-note{color:var(--muted);font-size:12px;margin-top:12px}

.chart-container{position:relative;height:300px;margin:16px 0}

.login-box{max-width:400px;margin:60px auto;padding:30px;background:linear-gradient(180deg,#1e293b,#0f1724);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h2{font:800 24px 'Changa';text-align:center;margin-bottom:20px;color:var(--acc-lite)}
.login-box .field{margin-bottom:16px}

.overlay{position:fixed;inset:0;background:rgba(10,14,26,.9);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:20px;animation:fadeUp .3s}
.overlay[hidden]{display:none}
.success-box{text-align:center;max-width:440px;width:100%}
.okring{width:76px;height:76px;border-radius:50%;background:rgba(16,185,129,.15);border:2px solid var(--green);display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.okring .ic{width:36px;height:36px;color:var(--green)}
.success-box h2{font:800 24px 'Changa';margin-bottom:4px}
.success-box .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.receipt{background:var(--cream);color:#1e293b;border-radius:14px;padding:18px 22px;text-align:right;box-shadow:0 30px 60px rgba(0,0,0,.5);position:relative;margin-bottom:16px}
.receipt h4{font:800 17px 'Changa';text-align:center;margin-bottom:4px}
.receipt .r-sub{text-align:center;font-size:11.5px;color:#64748b;font-weight:700}
.receipt .perf{border-top:2px dashed #d4a574;margin:12px 0}
.receipt .r-line{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;padding:3px 0}
.receipt .r-line b{font-family:'Changa'}
.receipt .r-total{font-size:15px;color:#b45309}
.barcode{height:30px;margin-top:12px;background:repeating-linear-gradient(90deg,#1e293b 0 2px,transparent 2px 5px,#1e293b 5px 7px,transparent 7px 11px)}
.success-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qr-box{background:var(--cream);border-radius:16px;padding:22px;text-align:center;color:#1e293b;max-width:330px}
.qr-box img{width:230px;height:230px;border-radius:10px;background:#fff;padding:8px}
.qr-box h3{font:800 19px 'Changa';margin:10px 0 4px}
.qr-box p{font-size:11px;color:#64748b;word-break:break-all;direction:ltr}

.audit-list{display:flex;flex-direction:column;gap:8px}
.audit-item{background:#1e293b;border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.audit-item .time{color:var(--muted);font-size:11px;white-space:nowrap}
.audit-item .action{font-weight:700;color:var(--acc-lite)}
.audit-item .details{color:var(--muted);font-size:12.5px;margin-top:4px}

.st-mng{display:flex;flex-direction:column;gap:8px}
.st-mng-row{display:flex;align-items:center;gap:12px;background:#1e293b;border:1px solid var(--line);border-radius:11px;padding:9px 14px}
.st-mng-row .s-code{padding:5px 10px;min-width:52px}
.st-mng-row b{font:700 15px 'Changa';flex:1}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;background:#1e293b;border:1px solid #334155;color:var(--ink);padding:12px 22px;border-radius:12px;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.45);font-weight:600;font-size:14px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  #clockTime,#clockDate{display:none}
  .head-meta{min-width:0}
  .station-row{grid-template-columns:48px 1fr;grid-auto-rows:auto;row-gap:8px}
  .s-rev{display:none}
  .s-actions{grid-column:1/-1;justify-content:flex-start}
  .totals-bar{gap:14px;bottom:calc(76px + env(safe-area-inset-bottom))}
  .totals-bar .btn{margin-inline-start:0;width:100%}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="splash-in">
  <span class="splash-badge">🚝</span>
  <b>إحصاء المحطات</b>
  <small>مونوريل شرق النيل</small>
</div></div>

<!-- أنيميشن المونوريل -->
<div class="track-strip" aria-hidden="true">
  <div class="mtrain"><div class="body"></div></div>
</div>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/">
      <span class="brand-badge" id="brandIcon"></span>
      <span><b>إحصاء المحطات</b><small>مونوريل شرق النيل</small></span>
    </a>
    <nav class="top-nav" id="topNav">
      <a href="#/" data-nav="home">لوحة المحطات</a>
      <a href="#/dash" data-nav="dash">لوحة التجميع</a>
      <a href="#/stats" data-nav="stats">الإحصائيات</a>
      <a href="#/audit" data-nav="audit">سجل التدقيق</a>

// ==========================================

async function supaFetch(path,opts={},ms=10000){
  const url=BASE+'/'+path;
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{...opts,signal:c.signal,headers:{...HEADERS,...(opts.headers||{})}});
    return {status:r.status,json:await r.json().catch(()=>null),ok:r.ok};
  }catch(e){
    console.warn('Supabase fetch failed, using mock:',e);
    useMock=true;
    return {status:200,json:null,ok:false};
  }finally{clearTimeout(t);}
}

async function getAllReports(){
  if(useMock)return MOCK_REPORTS.map(fromSnake);
  try{
    const res=await supaFetch('station_reports?select=*');
    if(res.status===200&&Array.isArray(res.json))return res.json.map(fromSnake);
    useMock=true;return MOCK_REPORTS.map(fromSnake);
  }catch(e){useMock=true;return MOCK_REPORTS.map(fromSnake);}
}

function makeIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');
  const r=size*0.22;
  const g=x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,var(--acc));g.addColorStop(1,var(--acc-d));
  x.beginPath();x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();
  x.fillStyle=g;x.fill();
  x.font=Math.round(size*0.52)+'px serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('🚝',size/2,size*0.56);
  return c.toDataURL('image/png');
}
function setupPWA(){

function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const seg=h.split('?')[0].split('/').filter(Boolean);
  closeOverlay();window.scrollTo(0,0);
  const auth=getAuth();
  
  // لو جاي من لينك محطة، ممنوع يدخل على التجميع أو الإحصائيات أو الإدارة
  const isStationLink=seg[0]==='s';
  if(isStationLink){
    if(seg[0]==='s')return renderForm(seg[1]||'',decodeURIComponent(seg[2]||''));
    location.hash='#/';
    return;
  }
  
  if(!auth&&seg[0]!=='login'&&seg[0]!=='s'){location.hash='#/login';return;}
  if(seg[0]==='login')return renderLogin();
  if(seg[0]==='dash')return renderDash();
  if(seg[0]==='stats')return renderStats();
  if(seg[0]==='audit')return renderAudit();
  if(seg[0]==='stations')return renderStations();
  if(seg[0]==='s')return renderForm(seg[1]||'',decodeURIComponent(seg[2]||''));
  renderHome();
}

function fieldHTML(key,label,unit){return `<div class="field"><label>${label}</label><div class="in-wrap"><input type="text" inputmode="numeric" autocomplete="off" placeholder="0" data-field="${key}" class="${unit?'has-unit':''}">${unit?`<span class="unit">${unit}</span>`:''}</div></div>`;}

function renderForm(code,nameParam){
  setActive('');
  $('#topNav').style.display='none';
  $('#logoutBtn').style.display='none';
  const app=$('#app');
  app.innerHTML=`<div class="view">
    <a class="back-link" href="#/">${ic('board')} العودة إلى لوحة المحطات</a>
    <div class="station-sign"><span class="sign-code">${esc(code)}</span><div><h1>محطة ${esc(nameParam)}</h1><div class="sign-meta">نموذج تسجيل البيان اليومي — مونوريل شرق النيل</div></div></div>
    <div class="card" style="margin-bottom:16px">
      <div class="meta-grid">
        <div class="field"><label>تاريخ البيان</label><div class="in-wrap"><input type="date" id="fDate" value="${todayISO()}"></div></div>
        <div class="field"><label>اسم المُسجِّل (اختياري)</label><div class="in-wrap"><input type="text" id="fBy" placeholder="موظف المحطة" autocomplete="off"></div></div>
      </div>
    </div>
    <form id="entryForm" novalidate>
      ${SECTIONS.map(s=>`<section class="card form-sec">
        <div class="sec-head"><span class="sec-ord">${s.ord}</span>${ic(s.icon)}<h3>${s.title}</h3><span class="sec-sum" data-sec="${s.id}">0 ج.م</span></div>
        ${s.rows.map(r=>{const inner=`<div class="pair">${fieldHTML(r.c,'العدد')}${fieldHTML(r.r,'الإيراد','ج.م')}</div>`;return s.rows.length>1?`<div class="sub-row"><div class="sub-name">${r.label}</div>${inner}</div>`:inner;}).join('')}
      </section>`).join('')}
      <div class="totals-bar">
        <div class="tot-item"><small>إجمالي عدد العمليات</small><b id="tCount">0</b></div>
        <div class="tot-item money"><small>إجمالي الإيرادات</small><b id="tRev">0 ج.م</b></div>
        <button class="btn navy big" type="submit" id="submitBtn">${ic('send')} إرسال البيان</button>
      </div>
    </form>
  </div>`;

  const form=$('#entryForm');
  const readForm=()=>{const v={};form.querySelectorAll('[data-field]').forEach(i=>v[i.dataset.field]=num(norm(i.value)));return v;};
  function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
  function recalc(){
    const v=readForm();
    const tC=COUNT_FIELDS.reduce((a,f)=>a+v[f],0), tR=REV_FIELDS.reduce((a,f)=>a+v[f],0);
    const e1=$('#tCount'),e2=$('#tRev');
    if(e1.textContent!==fmt(tC)){e1.textContent=fmt(tC);bump(e1);}
    const m=money(tR);if(e2.textContent!==m){e2.textContent=m;bump(e2);}
    SECTIONS.forEach(s=>{const sum=s.rows.reduce((a,r)=>a+v[r.r],0);const el=form.querySelector(`[data-sec="${s.id}"]`);if(el)el.textContent=money(sum);});
  }
  form.addEventListener('input',recalc);

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const v=readForm();
    if(NUM_FIELDS.every(f=>!v[f])&&!confirm('كل القيم صفر أو فارغة. هل تريد المتابعة؟'))return;
    const btn=$('#submitBtn');btn.disabled=true;btn.innerHTML=ic('spinner','spin')+' جارٍ الإرسال…';
    const dateVal=$('#fDate').value||todayISO();
    $('#fDate').value=dateVal;
    const tC=COUNT_FIELDS.reduce((a,f)=>a+v[f],0), tR=REV_FIELDS.reduce((a,f)=>a+v[f],0);
    const auth=getAuth();
    const rec={stationCode:code,stationName:nameParam,date:dateVal,...v,totalCount:tC,totalRevenue:tR,submittedBy:$('#fBy').value.trim()||auth?.username||'unknown',submittedAt:new Date().toISOString()};
    const ok=await saveReport(rec);
    btn.disabled=false;btn.innerHTML=ic('send')+' إرسال البيان';
    if(ok){await addAudit('تسجيل بيان',{station:code,date:dateVal,total:tR},auth?.username);showSuccess(rec);}
    else{toast('فشل الإرسال — تأكد من الاتصال');}
    recalc();
  });
}
function showSuccess(rec){
  openOverlay(`<div class="success-box">
    <div class="okring">${ic('check')}</div>
    <h2>تم تسجيل البيان بنجاح</h2><p class="sub">✓ تم إرسال البيانات ${useMock?'(محاكاة)':'إلى Supabase'}</p>

const GROUPS=[
 {t:'التذاكر',c:'ticketsCount',r:'ticketsRevenue'},

 {t:'شهري',c:'monthCount',r:'monthRevenue'},

 {t:'شحن المحفظة',c:'rechargeCount',r:'rechargeRevenue'},
 {t:'الإجمالي',c:'totalCount',r:'totalRevenue'}
];
async function renderDash(){

  const [reports,stations]=await Promise.all([getAllReports(),getAllStations()]);
  drawDash(reports,stations);
}
function buildDayRows(records,dateStr,stations){
  const byCode=new Map(records.filter(r=>String(r.date)===dateStr).map(r=>[String(r.stationCode),r]));
  const mk=(code,name,rec)=>{const z={};NUM_FIELDS.forEach(f=>z[f]=rec?num(rec[f]):0);return {code,name,...z,totalCount:COUNT_FIELDS.reduce((a,f)=>a+z[f],0),totalRevenue:REV_FIELDS.reduce((a,f)=>a+z[f],0),present:!!rec};};
  const rows=stations.map(s=>mk(s.code,s.name,byCode.get(s.code)));
  byCode.forEach((r,code)=>{if(!stations.some(s=>s.code===code))rows.push(mk(code,r.stationName||code,r));});
  return rows;
}
function totalsOf(rows){return {count:rows.reduce((a,r)=>a+r.totalCount,0),revenue:rows.reduce((a,r)=>a+r.totalRevenue,0),done:rows.filter(r=>r.present).length};}
function drawDash(reports,stations){
  const app=$('#app');
  const dayRows=buildDayRows(reports,dashDate,stations);
  const T=totalsOf(dayRows);
  const top=[...dayRows].filter(r=>r.present).sort((a,b)=>b.totalRevenue-a.totalRevenue)[0];
  app.innerHTML=`<div class="view">
    <div class="board-head">
      <div><h1 class="page-title">لوحة التجميع</h1><p class="page-sub">كل بيانات المحطات في مكان واحد — صدّرها Excel بضغطة</p></div>

    </div>
    <div class="stats-strip">
      <div class="stat"><small>محطات مسجّلة اليوم</small><b>${T.done} / ${dayRows.length}</b></div>
      <div class="stat gold"><small>إجمالي الإيرادات</small><b>${money(T.revenue)}</b></div>
      <div class="stat"><small>إجمالي العمليات</small><b>${fmt(T.count)}</b></div>
      <div class="stat"><small>أعلى محطة إيرادًا</small><b style="font-size:18px;padding-top:6px">${top?esc(top.name):'—'}</b></div>
    </div>
    <div class="table-wrap"><table class="gt">
      <thead><tr><th rowspan="2">المحطة</th>${GROUPS.map(g=>`<th colspan="2">${g.t}</th>`).join('')}<th rowspan="2">الحالة</th></tr>
      <tr>${GROUPS.map(()=>'<th>عدد</th><th>إيراد</th>').join('')}</tr></thead>
      <tbody>${dayRows.map(r=>`<tr class="${r.present?'':'miss'}"><td class="st">${esc(r.name)}</td>${GROUPS.map(g=>`<td>${fmt(r[g.c])}</td><td class="rev">${fmt(r[g.r])}</td>`).join('')}<td><span class="st-pill ${r.present?'on':'off'}"><span class="dot"></span>${r.present?'مسجّل':'لم يُسجّل'}</span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td class="st">الإجمالي العام</td>${GROUPS.map(g=>{const c=dayRows.reduce((a,r)=>a+r[g.c],0),v=dayRows.reduce((a,r)=>a+r[g.r],0);return `<td>${fmt(c)}</td><td>${fmt(v)}</td>`;}).join('')}<td>${T.done} محطة</td></tr></tfoot>
    </table></div>
    <p class="dash-note">ملحوظة: كل الأيام بتتحفظ في نفس الجدول — اختار أي تاريخ من فوق وشوف بيانه.</p>
  </div>`;
  $('#dashDate').addEventListener('change',e=>{dashDate=e.target.value||todayISO();drawDash(reports,stations);});
  $('#todayBtn').addEventListener('click',()=>{dashDate=todayISO();drawDash(reports,stations);});
  $('#dashRefresh').addEventListener('click',renderDash);
  $('#exDay').addEventListener('click',()=>exportDayExcel(dayRows));
  $('#exLog').addEventListener('click',()=>exportLogExcel(reports));
}

function exportDayExcel(dayRows){
  const T=totalsOf(dayRows);
  const aoa=[
    ['تقرير إحصاء المحطات — مونوريل شرق النيل'],
    ['التاريخ: '+dashDate+'  ('+fmtDateAr(dashDate)+')','','','','','','','','','','','','','','','','','المسجّل: '+T.done+' من '+dayRows.length],
    [],
    ['المحطة','التذاكر','','الاشتراكات','','','','','','كروت الاشتراكات','','كروت المحفظة','','شحن المحفظة','','الإجمالي','','الحالة'],
    ['','عدد','إيراد','أسبوعي (عدد)','أسبوعي (إيراد)','شهري (عدد)','شهري (إيراد)','ربع سنوي (عدد)','ربع سنوي (إيراد)','عدد','إيراد','عدد','إيراد','عدد','إيراد','عدد','إيراد','']
  ];
  dayRows.forEach(r=>aoa.push([r.name,r.ticketsCount,r.ticketsRevenue,r.weekCount,r.weekRevenue,r.monthCount,r.monthRevenue,r.quarterCount,r.quarterRevenue,r.subCardsCount,r.subCardsRevenue,r.walletCardsCount,r.walletCardsRevenue,r.rechargeCount,r.rechargeRevenue,r.totalCount,r.totalRevenue,r.present?'مسجّل':'لم يُسجّل']));
  
  // الإجمالي العام بمعادلات
  const totalRow=['الإجمالي العام'];
  GROUPS.forEach(g=>{
    const startCol=String.fromCharCode(66+GROUPS.indexOf(g)*2); // B, D, F...
    const endRow=4+dayRows.length;
    totalRow.push(`=SUM(${startCol}5:${startCol}${endRow})`);
    totalRow.push(`=SUM(${String.fromCharCode(67+GROUPS.indexOf(g)*2)}5:${String.fromCharCode(67+GROUPS.indexOf(g)*2)}${endRow})`);
  });
  totalRow.push(T.done+' محطة');
  aoa.push(totalRow);
  
  if(!window.XLSX)return;
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  
  // دمج الخلايا
  ws['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:17}},
    {s:{r:3,c:0},e:{r:4,c:0}},
    {s:{r:3,c:1},e:{r:3,c:2}},{s:{r:3,c:3},e:{r:3,c:8}},
    {s:{r:3,c:9},e:{r:3,c:10}},{s:{r:3,c:11},e:{r:3,c:12}},{s:{r:3,c:13},e:{r:3,c:14}},
    {s:{r:3,c:15},e:{r:3,c:16}},{s:{r:3,c:17},e:{r:4,c:17}}
  ];
  
  // تنسيق الأعمدة
  ws['!cols']=[{wch:20},...Array(16).fill({wch:14}),{wch:11}];
  ws['!rows']=[{hpt:28},{hpt:20},{hpt:8},{hpt:24},{hpt:20}];
  
  // تنسيق الألوان
  for(let R=0;R<=aoa.length-1;R++){
    for(let C=0;C<=17;C++){
      const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(cell){
        if(R===0){cell.s={fill:{fgColor:{rgb:'06B6D4'}},font:{bold:true,color:{rgb:'FFFFFF'}},alignment:{horizontal:'center'}};}
        else if(R===3||R===4){cell.s={fill:{fgColor:{rgb:'1E293B'}},font:{bold:true,color:{rgb:'67E8F9'}},alignment:{horizontal:'center'}};}
        else if(R===aoa.length-1){cell.s={fill:{fgColor:{rgb:'10B981'}},font:{bold:true,color:{rgb:'FFFFFF'}},alignment:{horizontal:'center'}};}
      }
    }
  }
  
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'إحصاء '+dashDate);
  XLSX.writeFile(wb,'إحصاء محطات المونوريل '+dashDate+'.xlsx');
  toast('تم تنزيل ملف Excel ✓');
}

function exportLogExcel(records){
  const AR={stationCode:'كود المحطة',stationName:'المحطة',date:'التاريخ',ticketsCount:'عدد التذاكر',ticketsRevenue:'إيراد التذاكر',weekCount:'اشتراك أسبوعي (عدد)',weekRevenue:'اشتراك أسبوعي (إيراد)',monthCount:'اشتراك شهري (عدد)',monthRevenue:'اشتراك شهري (إيراد)',quarterCount:'اشتراك ربع سنوي (عدد)',quarterRevenue:'اشتراك ربع سنوي (إيراد)',subCardsCount:'كروت اشتراكات (عدد)',subCardsRevenue:'كروت اشتراكات (إيراد)',walletCardsCount:'كروت محفظة (عدد)',walletCardsRevenue:'كروت محفظة (إيراد)',rechargeCount:'شحن محفظة (عدد)',rechargeRevenue:'شحن محفظة (إيراد)',totalCount:'إجمالي العدد',totalRevenue:'إجمالي الإيراد',submittedBy:'المُسجِّل',submittedAt:'وقت التسجيل'};
  const sorted=[...records].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const aoa=[FIELDS.map(f=>AR[f]),...sorted.map(r=>FIELDS.map(f=>r[f]??''))];
  if(!window.XLSX)return;
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:20},{wch:12},...Array(16).fill({wch:15}),{wch:14},{wch:20}];
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:FIELDS.length-1}})};
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'السجل الكامل');
  XLSX.writeFile(wb,'سجل بيانات مونوريل شرق النيل.xlsx');
  toast('تم تنزيل السجل الكامل ✓');
}
