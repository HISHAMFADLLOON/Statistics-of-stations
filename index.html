async function exportLogExcel(rec){toast('⏳ تجهيز السجل...');let wb;const H=['كود المحطة','المحطة','التاريخ',...NUM_FIELDS.map((f,i)=>i%2===0?f+' عدد':f+' إيراد'),'إجمالي عدد','إجمالي إيراد','المسجل','وقت التسجيل'];try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv([H,...rec.map(r=>[r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy])],'سجل');return}try{wb.views=[{rightToLeft:true}];const ws=wb.addWorksheet('سجل البيانات',{views:[{rightToLeft:true}],pageSetup:{paperSize:9,orientation:'landscape'}});ws.columns=[{key:'code',width:10},{key:'name',width:25},{key:'date',width:12},...NUM_FIELDS.map((f,i)=>({key:f,width:i%2===0?12:15})),{key:'totalCount',width:12},{key:'totalRevenue',width:15},{key:'submittedBy',width:15},{key:'submittedAt',width:20}];const logo=await loadLogo();if(logo){const imgId=wb.addImage({base64:logo.b64,extension:logo.ext});ws.addImage(imgId,{tl:{col:0.02,row:0.02},ext:{width:70,height:70}})}ws.mergeCells('C1:T1');const title=ws.getCell('C1');title.value='سجل بيانات المحطات - مونوريل شرق النيل';title.font={bold:true,size:16,color:{argb:'FFFFFFFF'},name:'Arial'};title.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF06B6D4'}};title.alignment={horizontal:'center',vertical:'middle'};title.border={top:{style:'thick'},left:{style:'thick'},bottom:{style:'thick'},right:{style:'thick'}};ws.getRow(1).height=35;ws.addRow([]);ws.getRow(2).height=10;const headerRow=ws.addRow(H);headerRow.font={bold:true,size:10,color:{argb:'FF67E8F9'},name:'Arial'};headerRow.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E293B'}};headerRow.alignment={horizontal:'center',vertical:'middle',wrapText:true};headerRow.border={top:{style:'thick',color:{argb:'FF06B6D4'}},bottom:{style:'thick',color:{argb:'FF06B6D4'}}};ws.getRow(3).height=30;const sorted=[...rec].sort((a,b)=>String(b.date).localeCompare(String(a.date)));sorted.forEach((r,idx)=>{const row=ws.addRow([r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy,r.submittedAt]);const rowNum=4+idx;const rowCells=ws.getRow(rowNum);if(idx%2===0)rowCells.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF8FAFC'}};rowCells.eachCell(cell=>{cell.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};cell.alignment={horizontal:'center',vertical:'middle'};cell.font={size:9};if(cell.column>3&&cell.column<19){if(typeof cell.value==='number'){if(cell.column%2===1){cell.numFmt='#,##0'}else{cell.numFmt='#,##0.00 "ج.م"';cell.font={color:{argb:'FFF59E0B'},bold:true}}}}if(cell.column===2){cell.font={bold:true,size:10};cell.alignment={horizontal:'right'}}});rowCells.height=22});ws.autoFilter={from:{row:3,column:1},to:{row:3,column:20}};const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'سجل_البيانات_الكامل.xlsx');toast('✅ تم تنزيل السجل باحترافية')}catch(e){console.error('Excel error:',e);csv([H,...rec.map(r=>[r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy])],'سجل');toast('CSV بديل')}}
