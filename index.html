<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المونوريل">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg0:#070d1a;--bg1:#0b1220;--card:rgba(23,32,51,.66);--card-solid:#141d33;--br:rgba(148,163,184,.14);--br-strong:rgba(148,163,184,.24);--pr:#22d3ee;--prl:#67e8f9;--acc:#fbbf24;--ok:#34d399;--err:#f87171;--warn:#fbbf24;--tx:#eef2ff;--tx2:#9aa7c7;--mut:#5b6a8c;--grad:linear-gradient(135deg,#22d3ee 0%,#38bdf8 45%,#8b5cf6 100%);--grad-soft:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.16));--r-lg:24px;--r-md:18px;--r-sm:12px;--sh-1:0 1px 2px rgba(2,6,23,.5),0 10px 30px rgba(2,6,23,.35);--sh-2:0 14px 44px rgba(34,211,238,.14);--ring:0 0 0 3px rgba(34,211,238,.22);--glass:rgba(255,255,255,.045);--ease:cubic-bezier(.22,1,.36,1)}
[data-theme=light]{--bg0:#f4f7ff;--bg1:#e9eefb;--card:rgba(255,255,255,.8);--card-solid:#fff;--br:rgba(15,23,42,.08);--br-strong:rgba(15,23,42,.16);--tx:#0b1220;--tx2:#44506e;--mut:#7c89a8;--glass:rgba(255,255,255,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--tx);background:var(--bg0);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#22d3ee,#8b5cf6);border-radius:99px;border:2px solid var(--bg0)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(110px);opacity:.16;animation:drift 30s var(--ease) infinite alternate}
.aurora i:nth-child(1){background:#0ea5e9;top:-22%;right:-12%}
.aurora i:nth-child(2){background:#8b5cf6;bottom:-24%;left:-14%;animation-delay:-8s}
.aurora i:nth-child(3){background:#f59e0b;top:42%;left:52%;opacity:.08;animation-delay:-16s}
@keyframes drift{to{transform:translate(9%,7%) scale(1.12)}}
#nprogress{position:fixed;top:0;left:0;right:0;height:3px;z-index:2000;pointer-events:none;opacity:0}
#nprogress i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
#nprogress.on{opacity:1}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select{font-family:inherit;border:none;outline:none;color:inherit}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .6s linear;background:rgba(255,255,255,.5);pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.skeleton{background:linear-gradient(90deg,var(--glass) 25%,rgba(148,163,184,.12) 50%,var(--glass) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.sk-row{height:70px;margin:10px 0}
.sk-wrap{padding:14px}
#splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(1200px 600px at 50% -10%,rgba(34,211,238,.18),transparent),var(--bg0);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#splash.off{opacity:0;pointer-events:none}
.splash-container{text-align:center}
.splash-icon{width:140px;height:140px;background:#fff;border-radius:36px;display:flex;align-items:center;justify-content:center;font-size:70px;margin:auto;box-shadow:0 24px 70px rgba(34,211,238,.35);animation:pop .8s var(--ease)}
.splash-icon img{width:100%;height:100%;object-fit:cover;border-radius:36px}
.splash-title{font:800 34px 'Changa';margin-top:26px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.splash-subtitle{color:var(--tx2);margin-top:8px}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg1) 78%,transparent);backdrop-filter:blur(22px);border-bottom:1px solid var(--br)}
.topbar-in{max-width:1400px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-badge{width:48px;height:48px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;box-shadow:0 0 0 2px rgba(34,211,238,.4),0 8px 24px rgba(34,211,238,.25);animation:float 4s ease-in-out infinite}
.brand-badge img{width:100%;height:100%;object-fit:cover}
.brand b{font:800 20px 'Changa';display:block}
.brand small{color:var(--tx2);font-size:12px}
nav.top-nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
nav.top-nav a{padding:10px 16px;border-radius:14px;color:var(--tx2);font-weight:600;font-size:14px;transition:.25s var(--ease)}
nav.top-nav a:hover{color:var(--tx);background:var(--glass)}
nav a.active{color:var(--prl);background:var(--grad-soft);box-shadow:inset 0 0 0 1px rgba(34,211,238,.35)}
.head-meta{display:flex;align-items:center;gap:8px}
#clockTime{font:700 18px 'Changa';color:var(--prl)}
#clockDate{font-size:12px;color:var(--tx2)}
.chip{font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px}
.chip.ok{color:var(--ok);background:rgba(52,211,153,.14);box-shadow:inset 0 0 0 1px rgba(52,211,153,.3)}
.chip.warn{color:var(--warn);background:rgba(251,191,36,.14);box-shadow:inset 0 0 0 1px rgba(251,191,36,.3)}
@media(max-width:900px){nav.top-nav{display:none}}
.bottom-nav{display:none;position:fixed;bottom:14px;left:14px;right:14px;z-index:60;background:color-mix(in srgb,var(--card-solid) 86%,transparent);backdrop-filter:blur(22px);border:1px solid var(--br);border-radius:22px;box-shadow:var(--sh-1);padding:8px;gap:6px}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:11px;font-weight:600;padding:9px 4px;border-radius:16px}
.bottom-nav a.active{color:var(--prl);background:var(--grad-soft)}
@media(max-width:900px){.bottom-nav{display:flex}main{padding-bottom:110px}}
.fab{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;width:58px;height:58px;border-radius:20px;background:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(34,211,238,.4);overflow:hidden}
.fab img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.fab{display:flex}}
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:26px 22px 20px;min-height:calc(100vh - 220px)}
.crumbs{font-size:12px;color:var(--mut);margin-bottom:12px}
.crumbs a{color:var(--prl)}
footer{position:relative;z-index:10;border-top:1px solid var(--br);padding:26px 20px;text-align:center;margin-top:44px;background:var(--glass)}
.footer-powered{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;background:var(--grad-soft);border:1px solid rgba(34,211,238,.35);border-radius:99px;font:700 16px 'Changa'}
.footer-powered .name{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:18px}
.footer-subtitle{margin-top:14px;font-size:13px;color:var(--tx2)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 20px rgba(34,211,238,.3)}50%{box-shadow:0 0 40px rgba(34,211,238,.6)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.05)}70%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.view{animation:fadeInUp .6s var(--ease) both}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#04121f;font:700 14px 'IBM Plex Sans Arabic';padding:12px 20px;border-radius:14px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(34,211,238,.28);transition:.25s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--glass);box-shadow:inset 0 0 0 1px var(--br-strong);color:var(--tx)}
.btn.navy{background:var(--card-solid);color:var(--prl);box-shadow:inset 0 0 0 1px var(--br-strong)}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1px rgba(248,113,113,.5);color:var(--err)}
.btn.sm{padding:9px 14px;font-size:13px}
.btn.big{padding:14px 28px;font-size:15px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;box-shadow:inset 0 0 0 1px var(--br-strong);background:var(--glass);color:var(--tx2);position:relative;overflow:hidden}
.icon-btn:hover{color:var(--tx);background:rgba(148,163,184,.12)}
.icon-btn.is-fav{color:var(--acc)}
.icon-btn svg{width:18px;height:18px}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--br);border-radius:var(--r-lg);padding:22px;margin-bottom:18px;box-shadow:var(--sh-1);animation:fadeInUp .5s var(--ease) both}
.card h2{font:700 21px 'Changa';margin-bottom:16px;display:flex;gap:10px;align-items:center}
.board-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font:800 36px 'Changa';background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:shimmer 4s linear infinite}
.page-sub{color:var(--tx2);font-size:14px;margin-top:4px}
.board-head .grow{flex:1}
.search{background:var(--glass);box-shadow:inset 0 0 0 1px var(--br-strong);border-radius:14px;color:var(--tx);padding:12px 16px;width:260px}
.progress-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;color:var(--tx2)}
.progress{flex:1;height:10px;border-radius:99px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--br);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--grad);transition:width 1.2s var(--ease)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.feed-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--br-strong)}
.feed-item:last-child{border-bottom:0}
.stations{list-style:none;border:1px solid var(--br);border-radius:var(--r-lg);overflow:hidden;background:var(--card);backdrop-filter:blur(14px)}
.station-row{display:grid;grid-template-columns:64px 1fr auto auto;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--br);animation:slideInRight .4s var(--ease) both}
.station-row:hover{background:var(--glass)}
.station-row:last-child{border-bottom:0}
.s-code{font:800 15px 'Changa';color:var(--prl);background:var(--grad-soft);border-radius:14px;text-align:center;padding:11px 0}
.s-name{font:700 18px 'Changa'}
.s-status{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:8px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.s-status.on{color:var(--ok)}
.s-status.on .dot{background:var(--ok)}
.s-status.late{color:var(--warn)}
.s-status.late .dot{background:var(--warn)}
.s-rev{font:700 16px 'Changa';color:var(--acc)}
.s-actions{display:flex;gap:10px;align-items:center}
.chips-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:12px}
.chip-btn{flex:none;padding:9px 15px;border-radius:99px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--br-strong);color:var(--tx2);font:600 12px 'IBM Plex Sans Arabic'}
.station-sign{background:var(--card);border:1px solid var(--br);border-radius:var(--r-lg);padding:22px 28px;display:flex;align-items:center;gap:20px;margin-bottom:18px}
.sign-code{font:800 22px 'Changa';color:#04121f;background:var(--grad);padding:14px 20px;border-radius:16px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px dashed var(--br-strong)}
.sec-ord{min-width:56px;height:34px;border-radius:12px;background:var(--grad);color:#04121f;font:800 14px 'Changa';display:grid;place-items:center}
.sec-sum{margin-inline-start:auto;font:700 14px 'Changa';color:var(--prl);background:var(--grad-soft);padding:7px 16px;border-radius:99px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub-row{background:var(--glass);border:1px solid var(--br);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
.sub-name{font:700 15px 'Changa';color:var(--prl);margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:8px;font-weight:600}
.in-wrap input{width:100%;background:var(--bg1);border:1px solid var(--br-strong);border-radius:14px;color:var(--tx);font:600 18px 'Changa';padding:12px 16px}
.in-wrap input.has-unit{padding-left:56px}
.unit{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut)}
.totals-bar{position:sticky;bottom:16px;margin-top:22px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#241703;border-radius:20px;padding:18px 24px;display:flex;gap:28px;flex-wrap:wrap;z-index:30}
.tot-item b{font:800 26px 'Changa'}
.totals-bar .btn{margin-inline-start:auto}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--br);border-radius:var(--r-lg);background:var(--card);backdrop-filter:blur(14px);overflow:hidden;margin-bottom:18px}
.stat{padding:20px 22px;position:relative;animation:fadeInUp .5s var(--ease) both}
.stat+.stat{border-inline-start:1px solid var(--br)}
.stat small{color:var(--tx2);font-size:12px;font-weight:600}
.stat b{display:block;font:800 28px 'Changa';margin-top:6px;text-shadow:0 0 20px currentColor;animation:pulseGlow 3s ease infinite}
.stat.gold b{color:var(--acc)}
@media(max-width:900px){.stats-strip{grid-template-columns:1fr 1fr}}
.table-wrap{overflow:auto;border:1px solid var(--br);border-radius:var(--r-lg);background:var(--card)}
table.gt{border-collapse:collapse;min-width:1600px;width:100%}
.gt th,.gt td{padding:12px 14px;border-bottom:1px solid var(--br);text-align:center;font-size:13px;white-space:nowrap}
.gt thead th{background:var(--grad-soft);color:var(--prl);font:700 13px 'Changa'}
.gt tbody tr:hover{background:var(--glass)}
.gt td.st{text-align:right;font:700 15px 'Changa'}
.gt td:first-child,.gt thead th:first-child{position:sticky;right:0;background:var(--card-solid)}
.gt .rev{color:var(--acc)}
.gt tfoot td{background:rgba(52,211,153,.1);color:var(--ok);font:800 15px 'Changa'}
.st-pill{font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px}
.st-pill.on{color:var(--ok);background:rgba(52,211,153,.14)}
.st-pill.off{color:var(--err);background:rgba(248,113,113,.14)}
.login-box{max-width:440px;margin:70px auto;padding:38px;background:var(--card);border:1px solid var(--br);border-radius:28px}
.login-box h2{font:800 28px 'Changa';text-align:center;margin-bottom:22px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay{position:fixed;inset:0;background:rgba(4,8,18,.82);backdrop-filter:blur(12px);display:grid;place-items:center;z-index:100;padding:20px}
.overlay[hidden]{display:none}
.okring{width:90px;height:90px;margin:0 auto 18px}
.success-box{text-align:center;max-width:480px}
.receipt{background:linear-gradient(180deg,#fef3c7,#fde68a);color:#241703;border-radius:20px;padding:24px;text-align:right;margin-bottom:20px}
.receipt .r-line{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.receipt .perf{border-top:2px dashed rgba(0,0,0,.2);margin:16px 0}
.success-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.qr-box{background:#fef3c7;border-radius:24px;padding:28px;text-align:center;color:#241703;max-width:360px}
.audit-list{display:flex;flex-direction:column;gap:10px}
.audit-item{background:var(--glass);border:1px solid var(--br);border-radius:var(--r-md);padding:16px;display:flex;gap:16px}
.st-mng{display:flex;flex-direction:column;gap:10px}
.st-mng-row{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--br);border-radius:var(--r-md);padding:12px 16px}
.danger-zone{border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.06);border-radius:var(--r-lg);padding:22px;margin-top:22px}
.pal-box{width:min(560px,92vw);background:var(--card-solid);border:1px solid var(--br);border-radius:20px;overflow:hidden}
.pal-box input{width:100%;background:transparent;border-bottom:1px solid var(--br);color:var(--tx);padding:15px 16px;font-size:15px}
.pal-list{max-height:50vh;overflow:auto}
.pal-item{padding:12px 16px;cursor:pointer}
.pal-item:hover{background:var(--grad-soft)}
.unsaved-warning{position:fixed;top:20px;right:20px;background:var(--warn);color:#241703;padding:12px 20px;border-radius:14px;z-index:1000;display:none;font-weight:700}
.unsaved-warning.show{display:block;animation:slideIn .3s var(--ease)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--card-solid);border:1px solid var(--br-strong);color:var(--tx);padding:14px 26px;border-radius:16px;z-index:200;font-weight:600;max-width:90vw;text-align:center;transition:all .3s var(--ease)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.station-row{grid-template-columns:52px 1fr}.s-rev{display:none}.s-actions{grid-column:1/-1}.page-title{font-size:28px}.card{padding:18px}}
.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.chat-fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--grad);color:#04121f;display:grid;place-items:center;box-shadow:0 12px 40px rgba(34,211,238,.5);cursor:pointer;z-index:80;border:none;font-size:26px}
.chat-fab::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(34,211,238,.4);animation:pulseGlow 2s infinite}
.chat-window{position:fixed;right:20px;bottom:calc(164px + env(safe-area-inset-bottom));width:380px;max-width:calc(100vw - 40px);height:520px;max-height:calc(100vh - 200px);background:var(--card-solid);border:1px solid var(--br);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.5);z-index:90;display:none;flex-direction:column;overflow:hidden}
.chat-window.open{display:flex;animation:bounceIn .4s var(--ease)}
.chat-header{background:var(--grad);color:#04121f;padding:16px 20px;font:700 16px 'Changa';display:flex;align-items:center;gap:10px}
.chat-header .dot{width:8px;height:8px;border-radius:50%;background:#04121f;animation:pulse 1.4s infinite}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg1)}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;animation:fadeInUp .3s var(--ease)}
.chat-msg.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--br)}
.chat-msg.user{align-self:flex-end;background:var(--grad);color:#04121f;font-weight:600}
.chat-msg .chart-mini{margin-top:8px;height:100px}
.chat-input-wrap{padding:12px;border-top:1px solid var(--br);display:flex;gap:8px;background:var(--card)}

function buildPremiumSheet(wb,rows,T,sheetName,line2,logo){var ws=wb.addWorksheet(sheetName,{views:[{rightToLeft:true,state:'frozen',ySplit:6,showGridLines:true}]});ws.columns=[{width:26},{width:10},{width:12},{width:12},{width:14},{width:10},{width:10},{width:12},{width:16},{width:10},{width:12},{width:10},{width:12},{width:10},{width:12},{width:11},{width:12},{width:11},{width:12},{width:10},{width:12},{width:10},{width:12},{width:12},{width:16},{width:10},{width:10},{width:12},{width:18},{width:14},{width:11},{width:13}];if(logo){var imgId=wb.addImage({base64:logo.b64,extension:logo.ext});ws.addImage(imgId,{tl:{col:0.05,row:0.05},ext:{width:100,height:100}})}ws.mergeCells('D1:AF1');var t=ws.getCell('D1');t.value='تقرير إحصاء المحطات — مونوريل شرق النيل';ws.mergeCells('D2:AF2');var d=ws.getCell('D2');d.value=line2;ws.mergeCells('A4:A6');ws.getCell('A4').value='المحطة';ws.mergeCells('B4:I4');ws.getCell('B4').value='التذاكر';ws.mergeCells('J4:AC4');ws.getCell('J4').value='الاشتراكات';ws.mergeCells('AD4:AD6');ws.getCell('AD4').value='الإجمالي';ws.mergeCells('AE4:AE6');ws.getCell('AE4').value='الحالة';ws.mergeCells('AF4:AF6');ws.getCell('AF4').value='استاد';ws.getCell('B6').value='عدد';ws.getCell('C6').value='إيراد';ws.getCell('Z6').value='أهلي';ws.getCell('AA6').value='مصر';rows.forEach(function(r,idx){var rn=7+idx;ws.addRow([r.name,r.ticketsCount,r.ticketsRevenue,r.diverseRevenue,{formula:'C'+rn+'+D'+rn},r.bankAhlyDiscount,r.bankMisrDiscount,{formula:'F'+rn+'+G'+rn},{formula:'E'+rn+'-H'+rn},r.weekCount,r.weekRevenue,r.monthCount,r.monthRevenue,r.quarterCount,r.quarterRevenue,r.subCardsCount,r.subCardsRevenue,r.walletCardsCount,r.walletCardsRevenue,r.rechargeCount,r.rechargeRevenue,r.formsCount,r.formsRevenue,r.subDiverseRevenue,{formula:'K'+rn+'+M'+rn+'+O'+rn+'+Q'+rn+'+S'+rn+'+U'+rn+'+W'+rn+'+X'+rn},r.subBankAhlyDiscount,r.subBankMisrDiscount,{formula:'Z'+rn+'+AA'+rn},{formula:'Y'+rn+'-AB'+rn},{formula:'I'+rn+'+AC'+rn},r.present?'مسجّل':'—',r.stadiumTicketsCount])});var tr=7+rows.length;var tv=['الإجمالي'];for(var col=2;col<=30;col++){tv.push({formula:'SUM('+CL(col)+'7:'+CL(col)+(tr-1)+')'})}tv.push(T.done);tv.push({formula:'SUM(AF7:AF'+(tr-1)+')'});ws.addRow(tv);ws.autoFilter={from:{row:6,column:1},to:{row:tr-1,column:32}};return ws}
function exportDayExcel(rows){toast('⏳...');var T=totalsOf(rows);ensureExcelJS().then(function(){var wb=new ExcelJS.Workbook();return loadLogo().then(function(logo){buildPremiumSheet(wb,rows,T,'إحصاء '+dashDate,'التاريخ: '+dashDate,logo);return wb.xlsx.writeBuffer()}).then(function(buf){dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'إحصاء '+dashDate+'.xlsx');toast('✅')})}).catch(function(e){csv(buildAOA(rows,T),'تقرير');toast('CSV')})}
function exportWeekExcel(){toast('⏳...');Promise.all([getAllReports(),getAllStations()]).then(function(res){var all=res[0],stations=res[1];var end=dashDate;var sd=new Date(end+'T12:00');sd.setDate(sd.getDate()-6);var sISO=sd.toISOString().slice(0,10);var inR=all.filter(function(r){return String(r.date)>=sISO&&String(r.date)<=end});var rows=stations.map(function(st){var rs=inR.filter(function(r){return String(r.stationCode)===st.code});var z={};NUM_FIELDS.forEach(function(f){z[f]=rs.reduce(function(a,r){return a+num(r[f])},0)});var c=calcRow(z);return Object.assign({code:st.code,name:st.name,present:rs.length>0},z,{tBefore:c.tBefore,tDisc:c.tDisc,tAfter:c.tAfter,sBefore:c.sBefore,sDisc:c.sDisc,sAfter:c.sAfter,grand:c.grand,totalCount:c.count,totalRevenue:c.grand})});var T=totalsOf(rows);return ensureExcelJS().then(function(){var wb=new ExcelJS.Workbook();return loadLogo().then(function(logo){buildPremiumSheet(wb,rows,T,'اسبوعي','الفترة: '+sISO+' → '+end,logo);return wb.xlsx.writeBuffer()}).then(function(buf){dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'اسبوعي.xlsx');toast('✅')})})}).catch(function(e){toast('❌')})}
function exportMonthExcel(){toast('⏳...');Promise.all([getAllReports(),getAllStations()]).then(function(res){var all=res[0],stations=res[1];var ym=dashDate.slice(0,7);var inR=all.filter(function(r){return String(r.date).slice(0,7)===ym});var rows=stations.map(function(st){var rs=inR.filter(function(r){return String(r.stationCode)===st.code});var z={};NUM_FIELDS.forEach(function(f){z[f]=rs.reduce(function(a,r){return a+num(r[f])},0)});var c=calcRow(z);return Object.assign({code:st.code,name:st.name,present:rs.length>0},z,{tBefore:c.tBefore,tDisc:c.tDisc,tAfter:c.tAfter,sBefore:c.sBefore,sDisc:c.sDisc,sAfter:c.sAfter,grand:c.grand,totalCount:c.count,totalRevenue:c.grand})});var T=totalsOf(rows);return ensureExcelJS().then(function(){var wb=new ExcelJS.Workbook();return loadLogo().then(function(logo){buildPremiumSheet(wb,rows,T,'شهري','شهر '+ym,logo);return wb.xlsx.writeBuffer()}).then(function(buf){dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'شهري.xlsx');toast('✅')})})}).catch(function(e){toast('❌')})}
function exportLogExcel(rec){toast('⏳...');var H=['كود','المحطة','التاريخ'].concat(NUM_FIELDS).concat(['عدد','إيراد','مسجل']);ensureExcelJS().then(function(){var wb=new ExcelJS.Workbook();var ws=wb.addWorksheet('سجل',{views:[{rightToLeft:true}]});ws.addRow(H);rec.forEach(function(r){ws.addRow([r.stationCode,r.stationName,r.date].concat(NUM_FIELDS.map(function(f){return r[f]}).concat([r.totalCount,r.totalRevenue,r.submittedBy]))});return wb.xlsx.writeBuffer().then(function(buf){dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'سجل.xlsx');toast('✅')})}).catch(function(e){csv([H].concat(rec.map(function(r){return[r.stationCode,r.stationName,r.date].concat(NUM_FIELDS.map(function(f){return r[f])}).concat([r.totalCount,r.totalRevenue,r.submittedBy])})),'سجل');toast('CSV')})}
function tick(){var n=new Date();var ct=$('#clockTime');if(ct)ct.textContent=n.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});var cd=$('#clockDate');if(cd)cd.textContent=n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
setInterval(tick,1000);tick();
$('#logoutBtn').onclick=logout;
document.body.insertAdjacentHTML('beforeend','<nav class="bottom-nav"><a href="#/" data-nav="home">🏠<span>المحطات</span></a><a href="#/dash" data-nav="dash">📊<span>التجميع</span></a><a href="#/stats" data-nav="stats">📈<span>إحصاء</span></a><a href="#/stations" data-nav="stations">⚙️<span>إدارة</span></a></nav>');
lucide.createIcons();
syncPend();
route();
console.log('✅ OK');
var chatFab=$('#chatFab'),chatWindow=$('#chatWindow'),chatMessages=$('#chatMessages'),chatInput=$('#chatInput'),chatSend=$('#chatSend'),chatSuggestions=$('#chatSuggestions');
var chatOpen=false;
chatFab.onclick=function(){chatOpen=!chatOpen;chatWindow.classList.toggle('open',chatOpen);if(chatOpen&&!chatMessages.children.length){botSay('مرحبًا 👋 اسألني عن البيانات');renderSuggestions()}};
chatSend.onclick=sendChat;
chatInput.addEventListener('keydown',function(e){if(e.key==='Enter')sendChat()});
function renderSuggestions(){chatSuggestions.innerHTML=['إجمالي اليوم','أعلى محطة','كم محطة سجلت','الإيراد هذا الأسبوع'].map(function(s){return '<button data-q="'+s+'">'+s+'</button>'}).join('');chatSuggestions.querySelectorAll('button').forEach(function(b){b.onclick=function(){chatInput.value=b.dataset.q;sendChat()}})}
function sendChat(){var q=chatInput.value.trim();if(!q)return;userSay(q);chatInput.value='';setTimeout(function(){answer(q)},400)}
function userSay(t){var d=document.createElement('div');d.className='chat-msg user';d.textContent=t;chatMessages.appendChild(d);chatMessages.scrollTop=chatMessages.scrollHeight}
function botSay(t,chart){var d=document.createElement('div');d.className='chat-msg bot';d.innerHTML=t;if(chart)d.appendChild(chart);chatMessages.appendChild(d);chatMessages.scrollTop=chatMessages.scrollHeight}
function answer(q){Promise.all([getAllReports(),getAllStations()]).then(function(res){var all=res[0],stations=res[1];var today=todayISO();var tr=all.filter(function(r){return String(r.date)===today});var ql=q.toLowerCase();if(ql.indexOf('إجمالي')>=0&&ql.indexOf('اليوم')>=0){var total=tr.reduce(function(a,r){return a+num(r.totalRevenue)},0);botSay('💰 إجمالي اليوم: <b>'+money(total)+'</b> من <b>'+tr.length+'</b> بيان');return}if(ql.indexOf('أعلى')>=0||ql.indexOf('اعلى')>=0){var by={};tr.forEach(function(r){by[r.stationCode]=(by[r.stationCode]||0)+num(r.totalRevenue)});var top=Object.keys(by).sort(function(a,b){return by[b]-by[a]})[0];if(top){var st=stations.find(function(s){return s.code===top});botSay('🏆 الأعلى: <b>'+(st?st.name:top)+'</b> بـ '+money(by[top]))}else botSay('📭 لا بيانات');return}if(ql.indexOf('كم')>=0&&ql.indexOf('سجل')>=0){botSay('✅ سجلت <b>'+tr.length+'</b> من <b>'+stations.length+'</b>');return}if(ql.indexOf('أسبوع')>=0||ql.indexOf('اسبوع')>=0){var w=new Date();w.setDate(w.getDate()-7);var wISO=w.toISOString().slice(0,10);var wt=all.filter(function(r){return String(r.date)>=wISO}).reduce(function(a,r){return a+num(r.totalRevenue)},0);botSay('📅 آخر 7 أيام: <b>'+money(wt)+'</b>');return}botSay('🤔 جرب: إجمالي اليوم / أعلى محطة / كم محطة سجلت')})}
}catch(e){console.error('❌',e);hideSplash();}
</script>
