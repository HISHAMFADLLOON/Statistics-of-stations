<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1887a5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المونوريل">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-primary: #020617;
  --bg-secondary: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --border: #1e293b;
  --primary: #06b6d4;
  --primary-dark: #0891b2;
  --primary-light: #67e8f9;
  --secondary: #8b5cf6;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --gradient-primary: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.3);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.4), 0 2px 4px -2px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.5), 0 4px 6px -4px rgba(0,0,0,.4);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,.6), 0 8px 10px -6px rgba(0,0,0,.5);
}

[data-theme="light"] {
  --bg-primary: #f1f5f9;
  --bg-secondary: #e2e8f0;
  --bg-card: #ffffff;
  --bg-hover: #f8fafc;
  --border: #cbd5e1;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #64748b;
}

[data-theme="light"] .topbar,
[data-theme="light"] .bottom-nav {
  background: rgba(255,255,255,.92);
}

[data-theme="light"] .card,
[data-theme="light"] .stations,
[data-theme="light"] .table-wrap,
[data-theme="light"] .login-box,
[data-theme="light"] .st-mng-row,
[data-theme="light"] .sub-row,
[data-theme="light"] .audit-item {
  background: #fff;
}

[data-theme="light"] .in-wrap input,
[data-theme="light"] .search,
[data-theme="light"] input[type=date],
[data-theme="light"] .filter-item input,
[data-theme="light"] .filter-item select {
  background: #fff;
}

[data-theme="light"] .gt thead th {
  background: #e2e8f0;
  color: #0f172a;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
  color: var(--text-primary);
  background: var(--bg-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(800px 400px at 90% 10%, rgba(6,182,212,.15), transparent 60%),
    radial-gradient(600px 350px at 10% 90%, rgba(139,92,246,.12), transparent 60%),
    radial-gradient(500px 300px at 50% 50%, rgba(245,158,11,.08), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

::selection {
  background: rgba(6,182,212,.35);
  color: var(--text-primary);
}

a {
  color: inherit;
  text-decoration: none;
  transition: all .2s;
}

button {
  font-family: inherit;
  touch-action: manipulation;
  border: none;
  cursor: pointer;
}

input, select, textarea {
  font-family: inherit;
  border: none;
  outline: none;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: var(--bg-secondary);
}

::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--primary-dark);
}

.ic {
  width: 20px;
  height: 20px;
  flex: none;
}

/* Aurora Background */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.aurora i {
  position: absolute;
  width: 60vmax;
  height: 60vmax;
  border-radius: 50%;
  filter: blur(90px);
  opacity: .13;
  animation: drift 26s infinite alternate;
}

.aurora i:nth-child(1) {
  background: #06b6d4;
  top: -20%;
  left: -10%;
}

.aurora i:nth-child(2) {
  background: #8b5cf6;
  bottom: -20%;
  right: -10%;
  animation-delay: -8s;
}

.aurora i:nth-child(3) {
  background: #f59e0b;
  top: 40%;
  left: 50%;
  animation-delay: -16s;
}

@keyframes drift {
  to {
    transform: translate(10%, 8%) scale(1.15);
  }
}

/* Progress Bar */
#nprogress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 2000;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s;
}

#nprogress i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gradient-primary);
  box-shadow: 0 0 12px rgba(6,182,212,.8);
  transition: width .3s;
}

#nprogress.on {
  opacity: 1;
}

/* Tooltips */
[data-tip] {
  position: relative;
}

[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #0b1220;
  color: #e2e8f0;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 8px;
  white-space: nowrap;
  border: 1px solid #273549;
  z-index: 80;
  box-shadow: var(--shadow-md);
  animation: fadeUp .2s both;
}

/* Ripple Effect */
.ripple {
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  animation: rip .6s linear;
  background: rgba(255,255,255,.5);
  pointer-events: none;
}

@keyframes rip {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

/* Skeleton Loading */
.skeleton {
  background: linear-gradient(90deg, #1e293b 25%, #2a3a52 50%, #1e293b 75%);
  background-size: 200% 100%;
  animation: sk 1.2s infinite;
  border-radius: 10px;
}

@keyframes sk {
  to {
    background-position: -200% 0;
  }
}

.sk-row {
  height: 70px;
  margin: 10px 0;
}

.sk-wrap {
  padding: 14px;
}

/* Empty State */
.empty {
  padding: 50px 20px;
  text-align: center;
  color: var(--text-muted);
}

.empty svg {
  width: 64px;
  height: 64px;
  margin: 0 auto 14px;
  display: block;
  opacity: .45;
}

.empty p {
  font-weight: 600;
  font-size: 14px;
}

/* Splash Screen */
#splash {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .6s cubic-bezier(.4,0,.2,1);
}

#splash.off {
  opacity: 0;
  pointer-events: none;
}

.splash-container {
  text-align: center;
  animation: slideUp .8s cubic-bezier(.4,0,.2,1);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.splash-icon {
  width: 140px;
  height: 140px;
  background: #fff;
  border-radius: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 70px;
  box-shadow: 0 20px 60px rgba(6,182,212,.4), 0 0 0 4px rgba(24,135,165,.35);
  animation: iconPulse 2s ease-in-out infinite, popIn .6s cubic-bezier(.4,0,.2,1) .2s;
  position: relative;
  overflow: hidden;
}

.splash-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 32px;
}

@keyframes iconPulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.splash-title {
  font: 800 32px 'Changa';
  margin-top: 24px;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.splash-subtitle {
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  margin-top: 8px;
}

/* Monorail Animation */
.track-strip {
  position: relative;
  height: 66px;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(6,182,212,.03), transparent);
  z-index: 1;
}

.track-strip .ground {
  position: absolute;
  inset-inline: 0;
  bottom: 6px;
  height: 2px;
  background: #1c3a55;
}

.track-strip .pillars {
  position: absolute;
  inset-inline: 0;
  bottom: 8px;
  height: 24px;
  background: repeating-linear-gradient(90deg, transparent 0 96px, #1d3d59 96px 104px);
}

.track-strip .beam {
  position: absolute;
  inset-inline: 0;
  bottom: 32px;
  height: 7px;
  background: linear-gradient(180deg, #33587a, #1a3852);
  box-shadow: 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
}

.mtrain {
  position: absolute;
  bottom: 37px;
  left: -280px;
  animation: ride 24s linear infinite;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
}

@keyframes ride {
  to {
    left: 106%;
  }
}

.mtrain .body {
  width: 132px;
  height: 21px;
  background: linear-gradient(180deg, #f4f8fb, #c9d7e2);
  border-radius: 11px 16px 6px 6px;
  position: relative;
  overflow: hidden;
}

.mtrain .body::before {
  content: '';
  position: absolute;
  inset-inline: 9px;
  top: 5px;
  height: 7px;
  background: repeating-linear-gradient(90deg, #12314a 0 11px, #e8eef3 11px 14px);
  border-radius: 2px;
}

.mtrain .body::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: 3px;
  height: 3px;
  background: var(--primary);
}

/* Top Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(15,23,42,.85);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(30,41,59,.8);
  box-shadow: var(--shadow-lg);
}

.topbar-in {
  max-width: 1400px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 24px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-badge {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 8px 24px rgba(6,182,212,.4);
  transition: transform .3s;
  overflow: hidden;
}

.brand-badge:hover {
  transform: rotate(-10deg) scale(1.1);
}

.brand-badge img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand b {
  font: 800 20px 'Changa';
  display: block;
  color: var(--text-primary);
}

.brand small {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .5px;
}

nav.top-nav {
  display: flex;
  gap: 6px;
  margin-inline-start: auto;
  flex-wrap: wrap;
}

nav.top-nav a {
  padding: 10px 16px;
  border-radius: 12px;
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 14px;
  transition: all .25s;
  display: flex;
  gap: 8px;
  align-items: center;
  position: relative;
  overflow: hidden;
}

nav.top-nav a::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gradient-primary);
  opacity: 0;
  transition: opacity .25s;
}

nav.top-nav a:hover::before {
  opacity: .1;
}

nav.top-nav a .ic {
  width: 18px;
  height: 18px;
  position: relative;
  z-index: 1;
}

nav.top-nav a:hover {
  color: var(--primary-light);
  transform: translateY(-2px);
}

nav a.active {
  color: var(--primary-light);
  background: rgba(6,182,212,.15);
  box-shadow: 0 0 0 2px rgba(6,182,212,.2);
}

.head-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

#clockTime {
  font: 700 18px 'Changa';
  color: var(--primary-light);
}

#clockDate {
  font-size: 12px;
  color: var(--text-secondary);
}

.chip {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}

.chip.ok {
  color: #34d399;
  background: rgba(16,185,129,.15);
  border: 1px solid rgba(16,185,129,.4);
}

.chip.warn {
  color: #fbbf24;
  background: rgba(245,158,11,.15);
  border: 1px solid rgba(245,158,11,.4);
}

@media(max-width:900px) {
  nav.top-nav {
    display: none;
  }
}

/* Bottom Nav */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  z-index: 60;
  background: rgba(15,23,42,.95);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(30,41,59,.8);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 20px rgba(0,0,0,.4);
}

.bottom-nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  padding: 8px;
  border-radius: 12px;
  transition: all .25s;
  position: relative;
}

.bottom-nav a::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--gradient-primary);
  opacity: 0;
  border-radius: 12px;
  transition: opacity .25s;
}

.bottom-nav a .ic {
  width: 22px;
  height: 22px;
  position: relative;
  z-index: 1;
  transition: transform .25s;
}

.bottom-nav a.active::before {
  opacity: .15;
}

.bottom-nav a.active {
  color: var(--primary-light);
}

.bottom-nav a.active .ic {
  transform: scale(1.1);
}

@media(max-width:900px) {
  .bottom-nav {
    display: flex;
  }
  main {
    padding-bottom: 100px;
  }
}

/* FAB */
.fab {
  position: fixed;
  inset-inline-start: 18px;
  bottom: calc(84px + env(safe-area-inset-bottom));
  z-index: 70;
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: var(--gradient-primary);
  color: #06231e;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 26px rgba(6,182,212,.5);
  font-size: 24px;
  transition: transform .2s;
}

.fab:active {
  transform: scale(.92);
}

@media(max-width:900px) {
  .fab {
    display: flex;
  }
}

main {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 24px 20px;
  min-height: calc(100vh - 220px);
}

/* Breadcrumbs */
.crumbs {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.crumbs a {
  color: var(--primary-light);
}

.crumbs b {
  color: var(--text-secondary);
}

/* Footer */
footer {
  position: relative;
  z-index: 10;
  background: linear-gradient(180deg, rgba(15,23,42,.95) 0%, rgba(2,6,23,.98) 100%);
  border-top: 2px solid rgba(6,182,212,.3);
  padding: 24px 20px;
  text-align: center;
  margin-top: 40px;
  box-shadow: 0 -4px 20px rgba(0,0,0,.3);
}

footer::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  box-shadow: 0 0 20px var(--primary);
}

.footer-content {
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}

.footer-powered {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 24px;
  background: linear-gradient(135deg, rgba(6,182,212,.15), rgba(139,92,246,.15));
  border: 2px solid rgba(6,182,212,.4);
  border-radius: 99px;
  font: 700 16px 'Changa', sans-serif;
  color: var(--text-primary);
  transition: all .3s;
  cursor: default;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(6,182,212,.3);
}

.footer-powered::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
  transform: translateX(-100%);
  transition: transform .6s;
}

.footer-powered:hover::before {
  transform: translateX(100%);
}

.footer-powered:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: 0 12px 32px rgba(6,182,212,.4);
}

.footer-powered .name {
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 800;
  font-size: 18px;
}

.footer-powered .code-icon {
  width: 20px;
  height: 20px;
  color: var(--primary-light);
  opacity: .8;
}

.footer-subtitle {
  margin-top: 15px;
  font-size: 14px;
  color: #cbd5e1;
  font-weight: 700;
  font-family: 'Changa', sans-serif;
  text-shadow: 0 0 10px rgba(6,182,212,.3);
}

.footer-divider {
  width: 60px;
  height: 2px;
  background: var(--gradient-primary);
  margin: 16px auto 0;
  border-radius: 2px;
  opacity: .5;
}

/* View Animation */
.view {
  animation: fadeUp .5s cubic-bezier(.4,0,.2,1) both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.loading {
  color: var(--text-secondary);
  padding: 60px 0;
  text-align: center;
  font-weight: 600;
  font-size: 16px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--gradient-primary);
  color: var(--bg-primary);
  font: 700 14px 'IBM Plex Sans Arabic';
  padding: 12px 20px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  transition: all .25s;
  box-shadow: 0 8px 20px rgba(6,182,212,.35), inset 0 2px 8px rgba(255,255,255,.2);
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.3), transparent);
  opacity: 0;
  transition: opacity .25s;
}

.btn:hover::before {
  opacity: 1;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(6,182,212,.45), inset 0 2px 8px rgba(255,255,255,.3);
}

.btn:active {
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.btn.ghost {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-primary);
  box-shadow: none;
}

.btn.ghost:hover {
  border-color: var(--primary);
  color: var(--primary-light);
  background: rgba(6,182,212,.1);
}

.btn.navy {
  background: var(--bg-card);
  color: var(--primary-light);
  border: 1.5px solid var(--border);
  box-shadow: none;
}

.btn.navy:hover {
  background: var(--bg-hover);
  border-color: var(--primary);
}

.btn.danger {
  background: transparent;
  border: 1.5px solid rgba(239,68,68,.5);
  color: var(--danger);
  box-shadow: none;
}

.btn.danger:hover {
  background: rgba(239,68,68,.1);
  border-color: var(--danger);
}

.btn.sm {
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 10px;
}

.btn.big {
  padding: 14px 28px;
  font-size: 15px;
  border-radius: 14px;
}

/* Icon Button */
.icon-btn {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .25s;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.icon-btn:hover {
  color: var(--primary-light);
  border-color: var(--primary);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.icon-btn.danger-icon:hover {
  color: var(--danger);
  border-color: var(--danger);
  background: rgba(239,68,68,.1);
}

.icon-btn.is-fav {
  color: var(--accent);
  border-color: var(--accent);
}

.icon-btn .ic {
  width: 18px;
  height: 18px;
}

.spin {
  animation: rot 1s linear infinite;
}

@keyframes rot {
  to {
    transform: rotate(360deg);
  }
}

/* Card */
.card {
  background: linear-gradient(180deg, var(--bg-card), var(--bg-secondary));
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--shadow-xl);
  margin-bottom: 20px;
  transition: all .3s;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gradient-primary);
  opacity: 0;
  transition: opacity .3s;
}

.card:hover::before {
  opacity: 1;
}

.card:hover {
  transform: translateY(-4px);
  border-color: rgba(6,182,212,.3);
  box-shadow: 0 24px 40px rgba(0,0,0,.5);
}

.card h2 {
  font: 700 22px 'Changa';
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--text-primary);
}

.card h2 .ic {
  color: var(--primary);
  width: 24px;
  height: 24px;
}

/* Board Head */
.board-head {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.page-title {
  font: 800 36px 'Changa';
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.page-sub {
  color: var(--text-secondary);
  font-size: 15px;
  margin-top: 4px;
}

.board-head .grow {
  flex: 1;
}

.search {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  color: var(--text-primary);
  padding: 12px 16px;
  font-family: inherit;
  width: 260px;
  transition: all .25s;
  box-shadow: var(--shadow-sm);
}

.search:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(6,182,212,.2), var(--shadow-md);
}

/* Progress */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 0 20px;
  font-size: 14px;
  color: var(--text-secondary);
  font-weight: 600;
}

.progress {
  flex: 1;
  height: 10px;
  border-radius: 99px;
  background: var(--bg-card);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.3);
}

.progress i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--gradient-primary);
  border-radius: 99px;
  transition: width 1.2s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 10px rgba(6,182,212,.5);
}

.progress-wrap b {
  color: var(--primary-light);
  font-family: 'Changa';
  font-size: 16px;
}

/* Stations */
.stations {
  list-style: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  background: var(--bg-secondary);
  box-shadow: var(--shadow-xl);
}

.station-row {
  display: grid;
  grid-template-columns: 64px 1fr auto auto;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  transition: all .25s;
  animation: fadeUp .5s both;
  animation-delay: calc(var(--i) * 40ms);
  position: relative;
}

.station-row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--gradient-primary);
  opacity: 0;
  transition: opacity .25s;
}

.station-row:last-child {
  border-bottom: 0;
}

.station-row:hover {
  background: var(--bg-card);
  padding-inline-start: 24px;
}

.station-row:hover::before {
  opacity: 1;
}

.s-code {
  font: 800 15px 'Changa';
  color: var(--primary-light);
  background: rgba(6,182,212,.1);
  border: 1.5px solid rgba(6,182,212,.4);
  border-radius: 12px;
  text-align: center;
  padding: 10px 0;
  min-width: 60px;
}

.s-name {
  font: 700 18px 'Changa';
  color: var(--text-primary);
}

.s-status {
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-weight: 600;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex: none;
  box-shadow: 0 0 8px currentColor;
}

.s-status.on {
  color: var(--success);
}

.s-status.on .dot {
  background: var(--success);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(16,185,129,.6);
  }
  70% {
    box-shadow: 0 0 0 10px rgba(16,185,129,0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(16,185,129,0);
  }
}

.s-status.late {
  color: var(--warning);
}

.s-status.late .dot {
  background: var(--warning);
}

.s-rev {
  font: 700 16px 'Changa';
  color: var(--accent);
  min-width: 120px;
  text-align: left;
}

.s-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* Chips Bar */
.chips-bar {
  position: sticky;
  top: 76px;
  z-index: 30;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 0;
  margin-bottom: 12px;
}

.chip-btn {
  flex: none;
  padding: 8px 14px;
  border-radius: 99px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font: 600 12px 'IBM Plex Sans Arabic';
  transition: all .2s;
}

.chip-btn:hover {
  border-color: var(--primary);
  color: var(--primary-light);
}

/* Station Sign */
.station-sign {
  position: relative;
  background: linear-gradient(180deg, var(--bg-card), var(--bg-secondary));
  border: 2px solid var(--border);
  border-radius: 20px;
  padding: 24px 30px;
  display: flex;
  align-items: center;
  gap: 20px;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow-xl);
}

.station-sign::after {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1.5px solid rgba(6,182,212,.4);
  border-radius: 16px;
  pointer-events: none;
}

.sign-code {
  font: 800 22px 'Changa';
  color: var(--bg-primary);
  background: var(--gradient-primary);
  padding: 14px 18px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(6,182,212,.4);
}

.station-sign h1 {
  font: 800 clamp(24px, 4vw, 36px) 'Changa';
  color: var(--text-primary);
}

.sign-meta {
  color: var(--text-secondary);
  font-size: 13px;
  margin-top: 4px;
  font-weight: 600;
}

/* Meta Grid */
.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

@media(max-width:600px) {
  .meta-grid {
    grid-template-columns: 1fr;
  }
}

/* Form Section */
.form-sec {
  margin-bottom: 20px;
}

.sec-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.sec-ord {
  min-width: 60px;
  height: 36px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--gradient-primary);
  color: var(--bg-primary);
  font: 800 14px 'Changa';
  display: grid;
  place-items: center;
  box-shadow: 0 6px 16px rgba(6,182,212,.4);
}

.sec-head h3 {
  font: 700 20px 'Changa';
  color: var(--text-primary);
}

.sec-head .ic {
  color: var(--primary);
  width: 24px;
  height: 24px;
}

.sec-sum {
  margin-inline-start: auto;
  font: 700 14px 'Changa';
  color: var(--primary-light);
  background: rgba(6,182,212,.1);
  border: 1px dashed rgba(6,182,212,.45);
  padding: 6px 16px;
  border-radius: 99px;
}

.pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media(max-width:520px) {
  .pair {
    grid-template-columns: 1fr;
  }
}

.sub-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  transition: all .25s;
}

.sub-row:hover {
  border-color: rgba(6,182,212,.3);
}

.sub-row:last-child {
  margin-bottom: 0;
}

.sub-name {
  font: 700 15px 'Changa';
  color: var(--primary-light);
  margin-bottom: 12px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.sub-name::before {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--primary);
  box-shadow: 0 0 10px rgba(6,182,212,.6);
}

/* Field */
.field label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 600;
}

.in-wrap {
  position: relative;
}

.in-wrap input {
  width: 100%;
  background: var(--bg-primary);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text-primary);
  font: 600 18px 'Changa';
  padding: 12px 16px;
  transition: all .25s;
  box-shadow: var(--shadow-sm);
}

.in-wrap input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(6,182,212,.2), var(--shadow-md);
}

.in-wrap input.has-unit {
  padding-left: 56px;
}

.unit {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 700;
}

/* Totals Bar */
.totals-bar {
  position: sticky;
  bottom: 16px;
  margin-top: 24px;
  background: linear-gradient(135deg, var(--accent), #fbbf24);
  color: var(--bg-primary);
  border-radius: 16px;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 28px;
  box-shadow: 0 20px 50px rgba(245,158,11,.4);
  border: 2px dashed rgba(0,0,0,.2);
  z-index: 30;
  flex-wrap: wrap;
}

.tot-item small {
  display: block;
  font-size: 11px;
  color: rgba(30,41,59,.8);
  font-weight: 700;
}

.tot-item b {
  font: 800 26px 'Changa';
  color: var(--bg-primary);
  display: inline-block;
}

.tot-item.money b {
  color: #92400e;
}

.totals-bar .btn {
  margin-inline-start: auto;
}

.bump {
  animation: bump .35s;
}

@keyframes bump {
  45% {
    transform: scale(1.15);
  }
}

/* Dash Controls */
.dash-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin: 20px 0;
}

input[type=date] {
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  color: var(--text-primary);
  border-radius: 12px;
  padding: 10px 14px;
  font-family: inherit;
  font-size: 14px;
  transition: all .25s;
}

input[type=date]:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(6,182,212,.2);
}

.src-badge {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 99px;
  background: var(--bg-card);
}

/* Stats Strip */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--border);
  border-radius: 20px;
  background: linear-gradient(180deg, var(--bg-card), var(--bg-secondary));
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: var(--shadow-xl);
}

.stat {
  padding: 20px 24px;
  border-inline-start: 1px dashed var(--border);
  transition: all .25s;
}

.stat:hover {
  background: rgba(6,182,212,.05);
}

.stat:first-child {
  border-inline-start: 0;
}

.stat small {
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
}

.stat b {
  display: block;
  font: 800 28px 'Changa';
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}

.stat.gold b {
  color: var(--accent);
}

@media(max-width:900px) {
  .stats-strip {
    grid-template-columns: 1fr 1fr;
  }
  .stat:nth-child(3) {
    border-inline-start: 0;
  }
}

/* Table */
.table-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-secondary);
  box-shadow: var(--shadow-xl);
}

table.gt {
  border-collapse: collapse;
  min-width: 1300px;
  width: 100%;
}

.gt th, .gt td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  font-size: 13px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.gt thead th {
  background: var(--bg-card);
  color: var(--primary-light);
  font: 700 13px 'Changa';
  border-bottom: 2px solid rgba(6,182,212,.3);
}

.gt tbody tr {
  transition: all .2s;
}

.gt tbody tr:hover {
  background: rgba(6,182,212,.05);
}

.gt td.st {
  text-align: right;
  font: 700 15px 'Changa';
  color: var(--text-primary);
}

.gt td:first-child, .gt thead th:first-child {
  position: sticky;
  right: 0;
  background: var(--bg-secondary);
  z-index: 1;
}

.gt thead th:first-child {
  background: var(--bg-card);
  z-index: 2;
}

.gt .rev {
  color: var(--accent);
}

.gt tr.miss td {
  color: var(--text-muted);
}

.gt tfoot td {
  background: rgba(16,185,129,.1);
  color: var(--success);
  font: 800 15px 'Changa';
  border-top: 2px solid var(--success);
  border-bottom: 0;
}

.st-pill {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
  display: inline-flex;
  gap: 8px;
  align-items: center;
}

.st-pill.on {
  color: var(--success);
  background: rgba(16,185,129,.1);
}

.st-pill.off {
  color: var(--danger);
  background: rgba(239,68,68,.1);
}

.dash-note {
  color: var(--text-secondary);
  font-size: 13px;
  margin-top: 16px;
}

/* Login Box */
.login-box {
  max-width: 440px;
  margin: 80px auto;
  padding: 40px;
  background: linear-gradient(180deg, var(--bg-card), var(--bg-secondary));
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow-xl);
  position: relative;
  overflow: hidden;
}

.login-box::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--gradient-primary);
}

.login-box h2 {
  font: 800 28px 'Changa';
  text-align: center;
  margin-bottom: 24px;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-box .field {
  margin-bottom: 20px;
}

/* Overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,23,.9);
  backdrop-filter: blur(10px);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 20px;
  animation: fadeUp .4s both;
}

.overlay[hidden] {
  display: none;
}

.success-box {
  text-align: center;
  max-width: 480px;
  width: 100%;
}

.okring {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: rgba(16,185,129,.15);
  border: 3px solid var(--success);
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  animation: pop .6s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 40px rgba(16,185,129,.4);
}

@keyframes pop {
  from {
    transform: scale(.3);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.okring .ic {
  width: 42px;
  height: 42px;
  color: var(--success);
}

.success-box h2 {
  font: 800 28px 'Changa';
  margin-bottom: 6px;
  color: var(--text-primary);
}

.success-box .sub {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 20px;
}

.receipt {
  background: linear-gradient(180deg, #fef3c7, #fde68a);
  color: var(--bg-primary);
  border-radius: 18px;
  padding: 24px 28px;
  text-align: right;
  box-shadow: 0 30px 70px rgba(0,0,0,.5);
  position: relative;
  margin-bottom: 20px;
  border: 2px solid rgba(0,0,0,.1);
}

.receipt h4 {
  font: 800 18px 'Changa';
  text-align: center;
  margin-bottom: 6px;
  color: var(--bg-primary);
}

.receipt .r-sub {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 700;
}

.receipt .perf {
  border-top: 2px dashed rgba(0,0,0,.2);
  margin: 16px 0;
}

.receipt .r-line {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  padding: 4px 0;
}

.receipt .r-line b {
  font-family: 'Changa';
}

.receipt .r-total {
  font-size: 16px;
  color: #92400e;
}

.barcode {
  height: 36px;
  margin-top: 16px;
  background: repeating-linear-gradient(90deg, var(--bg-primary) 0 3px, transparent 3px 6px, var(--bg-primary) 6px 9px, transparent 9px 13px);
  opacity: .8;
}

.success-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.qr-box {
  background: #fef3c7;
  border-radius: 20px;
  padding: 28px;
  text-align: center;
  color: var(--bg-primary);
  max-width: 360px;
  box-shadow: var(--shadow-xl);
}

.qr-box img {
  width: 240px;
  height: 240px;
  border-radius: 12px;
  background: #fff;
  padding: 10px;
  box-shadow: var(--shadow-md);
}

.qr-box h3 {
  font: 800 20px 'Changa';
  margin: 14px 0 6px;
}

.qr-box p {
  font-size: 12px;
  color: var(--text-muted);
  word-break: break-all;
  direction: ltr;
}

/* Audit List */
.audit-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.audit-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  transition: all .25s;
}

.audit-item:hover {
  border-color: rgba(6,182,212,.3);
  transform: translateX(-4px);
}

.audit-item .time {
  color: var(--text-muted);
  font-size: 12px;
  white-space: nowrap;
}

.audit-item .action {
  font-weight: 700;
  color: var(--primary-light);
}

.audit-item .details {
  color: var(--text-secondary);
  font-size: 13px;
  margin-top: 4px;
}

/* Station Management */
.st-mng {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.st-mng-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 16px;
  transition: all .25s;
}

.st-mng-row:hover {
  border-color: rgba(6,182,212,.3);
}

.st-mng-row .s-code {
  padding: 6px 12px;
  min-width: 56px;
}

.st-mng-row b {
  font: 700 16px 'Changa';
  flex: 1;
}

/* Danger Zone */
.danger-zone {
  background: linear-gradient(180deg, rgba(239,68,68,.05), rgba(239,68,68,.02));
  border: 2px solid rgba(239,68,68,.3);
  border-radius: 20px;
  padding: 24px;
  margin-top: 24px;
}

.danger-zone h2 {

  const q = getPend();
  if (!q.length || !navigator.onLine) return 0;

/* ========== Supabase API ========== */
async function supaFetch(p, o = {}, ms = 10000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(BASE + '/' + p, {
      ...o,
      signal: c.signal,
      headers: {...HEADERS, ...(o.headers || {})}
    });
    return {
      status: r.status,
      json: await r.json().catch(() => null),
      ok: r.ok,
      net: true
    };
  } catch(e) {
    useMock = true;
    return {status: 0, json: null, ok: false, net: false};
  } finally {
    clearTimeout(t);
  }
}

  return MOCK_REPORTS.map(fromSnake);
}

/* ========== Auth ========== */
const AUTH_KEY = 'monorail_auth_v1';
const getAuth = () => {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY)); }
  catch(e) { return null; }
};

const setAuth = u => localStorage.setItem(AUTH_KEY, JSON.stringify(u));
const clearAuth = () => localStorage.removeItem(AUTH_KEY);

async function login(u, p) {
  if (useMock) {
    const x = MOCK_USERS.find(x => x.username === u && x.password === p);
    if (x) {
      setAuth({username: x.username, role: x.role});
      return x;
    }
    return null;
  }
  const r = await supaFetch('app_users?select=*');
  if (r.net && r.ok && Array.isArray(r.json)) {
    const x = r.json.find(x => x.username === u && x.password === p);
    if (x) {
      setAuth({username: x.username, role: x.role});
      return x;
    }
  }
  return null;
}

  location.hash = '#/login';

function copyText(t, m) {
  const d = () => toast(m || 'تم النسخ ✓');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(d);
  } else {
    const ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    d();
  }
}

/* ========== Swipe (تنقل بالسحب) ========== */
let tx = 0, ty = 0;

document.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, {passive: true});

document.addEventListener('touchend', e => {
  if (e.target.closest('.table-wrap, input, select, textarea, .pal-box')) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) {
    const order = ['home', 'dash', 'stats', 'audit', 'stations'];
    const cur = order.indexOf(currentPage);
    if (cur < 0) return;
    const nx = dx < 0 ? order[Math.min(cur + 1, 4)] : order[Math.max(cur - 1, 0)];
    if (nx !== currentPage) location.hash = '#/' + (nx === 'home' ? '' : nx);
  }
}, {passive: true});

function animateCounts(root) {
  root.querySelectorAll('[data-cu]').forEach(el => {
    const t = parseFloat(el.dataset.cu) || 0;
    const k = el.dataset.kind || 'num';
    const st = performance.now();
    (function s(n) {
      const p = Math.min(1, (n - st) / 900);
      const e = 1 - Math.pow(1 - p, 3);
      const v = t * e;
      el.textContent = k === 'money' ? money(v) : fmt(v);
      if (p < 1) requestAnimationFrame(s);
    })(st);
  });
}

  function recalc() {
    const v = read();

      showSuccess(rec, false);
    } else if (ok === 'queued') {
      clearUnsaved();
      showSuccess(rec, true);
    } else {
      toast('فشل الإرسال');
    }
    recalc();
  });
}

      f.dispatchEvent(new Event('input'));
    }
  };
}
