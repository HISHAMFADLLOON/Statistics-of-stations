<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1e2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إحصاء المحطات">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg0:#06121e; --bg1:#0b1e2e; --bg2:#10283c; --line:#1d3a54;
  --acc:#38c8b0; --acc-d:#1fa08d; --acc-lite:#8fe9da;
  --gold:#ffb52e; --cream:#f5edd8;
  --ink:#eaf2f8; --muted:#8fa9bf; --green:#34d17b; --red:#ff6b5e;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1100px 560px at 88% -10%, rgba(56,200,176,.08), transparent 60%),
    radial-gradient(900px 520px at 8% 112%, rgba(40,125,195,.13), transparent 60%),
    var(--bg0);
}
::selection{background:rgba(56,200,176,.35)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;touch-action:manipulation}
.btn,nav a,.icon-btn,.bottom-nav a{-webkit-user-select:none;user-select:none;touch-action:manipulation}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:#1d3c59;border-radius:9px}
.ic{width:20px;height:20px;flex:none}

#splash{position:fixed;inset:0;z-index:300;background:var(--bg0);display:grid;place-items:center;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
.splash-in{text-align:center;display:grid;gap:6px;justify-items:center}
.splash-badge{width:86px;height:86px;border-radius:22px;background:linear-gradient(160deg,#4adfc8,#189684);display:grid;place-items:center;font-size:46px;box-shadow:0 12px 40px rgba(56,200,176,.4);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.splash-in b{font:800 24px 'Changa'}
.splash-in small{color:var(--muted);font-weight:600}

.bottom-nav{display:none;position:fixed;bottom:0;inset-inline:0;z-index:60;background:rgba(6,18,30,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;padding:7px 0;border-radius:10px;transition:.2s}
.bottom-nav a .ic{width:21px;height:21px}
.bottom-nav a.active{color:var(--acc-lite)}
@media(max-width:900px){.bottom-nav{display:flex}main{padding-bottom:120px}}

.bg-bridge{position:fixed;inset-inline:0;bottom:0;height:30px;z-index:0;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(90deg, rgba(148,184,210,.07) 0 8px, transparent 8px 96px)}
.bg-bridge::before,.bg-bridge::after{content:'';position:absolute;inset-inline:0;height:2px;background:rgba(148,184,210,.13)}
.bg-bridge::before{top:0}.bg-bridge::after{bottom:6px}
@media(max-width:900px){.bg-bridge{display:none}}

.topbar{position:sticky;top:0;z-index:50;background:rgba(6,18,30,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1160px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-badge{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,#4adfc8,#189684);display:grid;place-items:center;box-shadow:0 5px 16px rgba(56,200,176,.35)}
.brand-badge .ic{width:26px;height:26px;color:#06231e}
.brand b{font:800 19px/1.1 'Changa';display:block}
.brand small{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px}
nav.top-nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
nav.top-nav a{padding:8px 13px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13.5px;transition:.2s;display:flex;gap:7px;align-items:center}
nav.top-nav a .ic{width:16px;height:16px}
nav.top-nav a:hover{color:var(--ink);background:#12314a}
nav a.active{color:var(--acc-lite);background:rgba(56,200,176,.1)}
.head-meta{text-align:left;min-width:90px;display:flex;align-items:center;gap:8px}
#clockTime{font:700 17px 'Changa';color:var(--acc-lite)}
#clockDate{font-size:11px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-block}
.chip.ok{color:#7ee2a8;background:rgba(52,209,123,.12);border:1px solid rgba(52,209,123,.4)}
.chip.warn{color:#ffd27a;background:rgba(255,181,46,.1);border:1px solid rgba(255,181,46,.35)}
@media(max-width:900px){nav.top-nav{display:none}}

.track-strip{position:relative;height:66px;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(56,200,176,.03),transparent)}
.track-strip .ground{position:absolute;inset-inline:0;bottom:6px;height:2px;background:#1c3a55}
.track-strip .pillars{position:absolute;inset-inline:0;bottom:8px;height:24px;
  background:repeating-linear-gradient(90deg, transparent 0 96px, #1d3d59 96px 104px)}
.track-strip .beam{position:absolute;inset-inline:0;bottom:32px;height:7px;
  background:linear-gradient(180deg,#33587a,#1a3852);box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12)}
.mtrain{position:absolute;bottom:37px;left:-280px;animation:ride 24s linear infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
@keyframes ride{to{left:106%}}
.mtrain .body{width:132px;height:21px;background:linear-gradient(180deg,#f4f8fb,#c9d7e2);border-radius:11px 16px 6px 6px;position:relative;overflow:hidden}
.mtrain .body::before{content:'';position:absolute;inset-inline:9px;top:5px;height:7px;
  background:repeating-linear-gradient(90deg,#12314a 0 11px,#e8eef3 11px 14px);border-radius:2px}
.mtrain .body::after{content:'';position:absolute;inset-inline:0;bottom:3px;height:3px;background:var(--acc)}

main{position:relative;z-index:1;max-width:1160px;margin:auto;padding:26px 20px 80px}
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:16px 20px 24px;color:#5f7d97;font-size:12.5px;text-align:center}
.view{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
.loading{color:var(--muted);padding:40px 0;text-align:center;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#4adfc8,#21a893);color:#06231e;font:700 14px 'IBM Plex Sans Arabic';padding:10px 18px;border-radius:11px;border:0;cursor:pointer;transition:.2s;box-shadow:0 6px 16px rgba(31,160,141,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(31,160,141,.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc-lite)}
.btn.navy{background:#132c44;color:var(--acc-lite);border:1.5px solid #2a557d;box-shadow:none}
.btn.navy:hover{background:#1a3a58}
.btn.danger{background:transparent;border:1.5px solid rgba(255,107,94,.5);color:var(--red);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.big{padding:12px 26px;font-size:15px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#0e2437;color:var(--muted);cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--acc-lite);border-color:var(--acc);transform:translateY(-2px)}
.icon-btn .ic{width:17px;height:17px}
.spin{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.board-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-title{font:800 30px 'Changa'}
.page-sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.board-head .grow{flex:1}
.search{background:#0a1c2d;border:1.5px solid var(--line);border-radius:11px;color:var(--ink);padding:10px 14px;font-family:inherit;width:220px;transition:.2s}
.search:focus{outline:0;border-color:var(--acc)}
.progress-wrap{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:13px;color:var(--muted);font-weight:600}
.progress{flex:1;height:9px;border-radius:99px;background:#10293f;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4adfc8,#1fa08d);border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.progress-wrap b{color:var(--acc-lite);font-family:'Changa'}
.stations{list-style:none;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b1f31;box-shadow:0 14px 40px rgba(2,8,15,.35)}
.station-row{display:grid;grid-template-columns:58px 1fr auto auto;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #14304a;transition:background .2s;animation:fadeUp .5s both;animation-delay:calc(var(--i)*35ms)}
.station-row:last-child{border-bottom:0}
.station-row:hover{background:#103050}
.s-code{font:800 14px 'Changa';color:var(--acc-lite);background:rgba(56,200,176,.08);border:1.5px solid rgba(56,200,176,.4);border-radius:10px;text-align:center;padding:9px 0}
.s-name{font:700 17px 'Changa'}
.s-status{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#54748f;flex:none}
.s-status.on{color:#7ee2a8}
.s-status.on .dot{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,209,123,.5)}70%{box-shadow:0 0 0 7px rgba(52,209,123,0)}100%{box-shadow:0 0 0 0 rgba(52,209,123,0)}}
.s-rev{font:700 15px 'Changa';color:#ffd27a;min-width:105px;text-align:left}
.s-actions{display:flex;gap:8px;align-items:center}
.add-station{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.add-station input{flex:1;min-width:200px;background:#0a1c2d;border:1.5px solid var(--line);border-radius:11px;color:var(--ink);padding:10px 14px;font-family:inherit}
.add-station input:focus{outline:0;border-color:var(--acc)}
.warn-banner{background:rgba(255,181,46,.08);border:1px solid rgba(255,181,46,.4);color:#ffd27a;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;margin-bottom:16px}

.back-link{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:14px;transition:.2s}
.back-link:hover{color:var(--acc-lite)}
.station-sign{position:relative;background:linear-gradient(180deg,#0e2a45,#0a1f35);border:2px solid #2a557d;border-radius:18px;padding:20px 26px;display:flex;align-items:center;gap:18px;overflow:hidden;margin-bottom:16px}
.station-sign::after{content:'';position:absolute;inset:7px;border:1.5px solid rgba(56,200,176,.45);border-radius:12px;pointer-events:none}
.sign-code{font:800 20px 'Changa';color:#06231e;background:linear-gradient(160deg,#4adfc8,#1fa08d);padding:12px 15px;border-radius:12px;box-shadow:0 6px 16px rgba(31,160,141,.35)}
.station-sign h1{font:800 clamp(22px,4vw,32px) 'Changa'}
.sign-meta{color:var(--muted);font-size:12.5px;margin-top:3px;font-weight:600}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:560px){.meta-grid{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#0f2740,#0c2033);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 30px rgba(2,8,15,.35);transition:transform .25s,border-color .25s}
.card:hover{border-color:#2b527a}
.form-sec{margin-bottom:16px}
.form-sec:hover{transform:translateY(-2px)}
.sec-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.sec-ord{min-width:56px;height:32px;padding:0 10px;border-radius:10px;background:linear-gradient(160deg,#4adfc8,#1fa08d);color:#06231e;font:800 13.5px 'Changa';display:grid;place-items:center;box-shadow:0 4px 10px rgba(31,160,141,.3)}
.sec-head h3{font:700 19px 'Changa'}
.sec-head .ic{color:var(--acc);width:22px;height:22px}
.sec-sum{margin-inline-start:auto;font:700 13.5px 'Changa';color:var(--acc-lite);background:rgba(56,200,176,.07);border:1px dashed rgba(56,200,176,.45);padding:4px 13px;border-radius:999px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.pair{grid-template-columns:1fr}}
.sub-row{background:#0d2438;border:1px solid #1c3c5a;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sub-row:last-child{margin-bottom:0}
.sub-name{font:700 14px 'Changa';color:#9fc4e4;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.sub-name::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--acc)}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.in-wrap{position:relative}
.in-wrap input{width:100%;background:#0a1c2d;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);font:600 18px 'Changa';padding:11px 14px;transition:border-color .2s,box-shadow .2s}
.in-wrap input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,200,176,.18)}
.in-wrap input.has-unit{padding-left:52px}
.unit{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-weight:700}
.hint-exist{font-size:12.5px;color:#ffd27a;background:rgba(255,181,46,.08);border:1px dashed rgba(255,181,46,.4);border-radius:10px;padding:8px 13px;margin-top:10px;display:none}
.totals-bar{position:sticky;bottom:14px;margin-top:22px;background:var(--cream);color:#16324a;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:24px;box-shadow:0 16px 40px rgba(0,0,0,.5);border:2px dashed #b8a76f;z-index:30;flex-wrap:wrap}
.tot-item small{display:block;font-size:10.5px;color:#6b7c8d;font-weight:700}
.tot-item b{font:800 23px 'Changa';color:#122b42;display:inline-block}
.tot-item.money b{color:#a86300}
.totals-bar .btn{margin-inline-start:auto}
.bump{animation:bump .35s}
@keyframes bump{45%{transform:scale(1.14)}}

.dash-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
input[type=date]{background:#0a1c2d;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px}
input[type=date]:focus{outline:0;border-color:var(--acc)}
.src-badge{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.ticker{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#0d2438;margin-bottom:16px;position:relative}
.ticker::before,.ticker::after{content:'';position:absolute;top:0;bottom:0;width:55px;z-index:2;pointer-events:none}
.ticker::before{right:0;background:linear-gradient(-90deg,#0d2438,transparent)}
.ticker::after{left:0;background:linear-gradient(90deg,#0d2438,transparent)}
.ticker-track{display:flex;width:max-content;animation:marq 30s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{padding:9px 0 9px 45px;font:600 13.5px 'IBM Plex Sans Arabic';color:var(--acc-lite);white-space:nowrap}
@keyframes marq{to{transform:translateX(50%)}}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0f2740,#0b1e30);overflow:hidden;margin-bottom:16px}
.stat{padding:15px 18px;border-inline-start:1px dashed #1e3f5e}
.stat:first-child{border-inline-start:0}
.stat small{color:var(--muted);font-size:11.5px;font-weight:700}
.stat b{display:block;font:800 25px 'Changa';margin-top:2px;font-variant-numeric:tabular-nums}
.stat.gold b{color:var(--gold)}
@media(max-width:860px){.stats-strip{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#0c2033;box-shadow:0 14px 40px rgba(2,8,15,.35)}
table.gt{border-collapse:collapse;min-width:1250px;width:100%}
.gt th,.gt td{padding:9px 10px;border-bottom:1px solid #16324c;text-align:center;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gt thead th{background:#102b44;color:var(--acc-lite);font:700 12.5px 'Changa';border-bottom:2px solid #24507a}
.gt tbody tr{transition:background .15s}
.gt tbody tr:hover{background:#11304c}
.gt tbody tr:hover td:first-child{background:#11304c}
.gt td.st{text-align:right;font:700 14.5px 'Changa'}
.gt td:first-child,.gt thead th:first-child{position:sticky;right:0;background:#0c2033;z-index:1}
.gt thead th:first-child{background:#102b44;z-index:2}
.gt .rev{color:#ffce6b}
.gt tr.miss td{color:#54748f}
.gt tfoot td{background:#0f3a41;color:#9df0dd;font:800 14px 'Changa';border-top:2px solid var(--acc);border-bottom:0}
.st-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.st-pill.on{color:#7ee2a8;background:rgba(52,209,123,.1)}
.st-pill.off{color:#ff9a90;background:rgba(255,107,94,.08)}
.dash-note{color:var(--muted);font-size:12px;margin-top:12px}

.setup-grid{display:grid;gap:16px}
.setup-grid h2{font:700 20px 'Changa';margin-bottom:12px;display:flex;gap:9px;align-items:center}
.setup-grid h2 .ic{color:var(--acc)}
.steps{counter-reset:st;list-style:none}
.steps li{counter-increment:st;position:relative;padding:11px 48px 11px 14px;margin-bottom:8px;background:#0d2438;border:1px solid var(--line);border-radius:12px;font-size:13.5px;color:#cfe2f2;line-height:1.7}
.steps li::before{content:counter(st);position:absolute;right:12px;top:14px;width:25px;height:25px;border-radius:8px;background:linear-gradient(160deg,#4adfc8,#1fa08d);color:#06231e;font:800 13px 'Changa';display:grid;place-items:center}
.codebox{position:relative;background:#061421;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;direction:ltr;text-align:left;font:12px/1.75 Consolas,Menlo,monospace;color:#9fd0f2;max-height:320px}
.codebox .copy-code{position:absolute;top:8px;right:8px}
.url-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.url-row input{flex:1;min-width:240px;background:#0a1c2d;border:1.5px solid var(--line);border-radius:11px;color:var(--ink);padding:10px 14px;font-family:inherit;direction:ltr}
.url-row input:focus{outline:0;border-color:var(--acc)}
.test-result{font-size:13px;font-weight:700;margin-top:10px}
.st-mng{display:flex;flex-direction:column;gap:8px}
.st-mng-row{display:flex;align-items:center;gap:12px;background:#0d2438;border:1px solid var(--line);border-radius:11px;padding:9px 14px}
.st-mng-row .s-code{padding:5px 10px;min-width:52px}
.st-mng-row b{font:700 15px 'Changa';flex:1}

.overlay{position:fixed;inset:0;background:rgba(4,10,17,.82);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:20px;animation:fadeUp .3s}
.overlay[hidden]{display:none}
.success-box{text-align:center;max-width:440px;width:100%}
.okring{width:76px;height:76px;border-radius:50%;background:rgba(52,209,123,.12);border:2px solid var(--green);display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.okring .ic{width:36px;height:36px;color:var(--green)}
.success-box h2{font:800 24px 'Changa';margin-bottom:4px}
.success-box .sub{color:var(--muted);font-size:13px;margin-bottom:16px}

  #clockTime,#clockDate{display:none}

}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="splash"><div class="splash-in">
  <span class="splash-badge">🚝</span>
  <b>إحصاء المحطات</b>
  <small>مونوريل شرق النيل</small>
</div></div>
<div class="bg-bridge" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/">
      <span class="brand-badge" id="brandIcon"></span>
      <span><b>إحصاء المحطات</b><small>مونوريل شرق النيل</small></span>
    </a>
    <nav class="top-nav">
      <a href="#/" data-nav="home">لوحة المحطات</a>
      <a href="#/dash" data-nav="dash">لوحة التجميع</a>

</div>

<main id="app"></main>
<footer>منظومة إحصاء المحطات — مونوريل شرق النيل • البيانات تُجمع على Supabase وتُصدَّر إلى Excel من لوحة التجميع</footer>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="overlay" hidden></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS={stations:'monorail_stations_v1',records:'monorail_records_v1',settings:'monorail_settings_v2'};
const TABLE='station_reports';
const NUM_FIELDS=['ticketsCount','ticketsRevenue','weekCount','weekRevenue','monthCount','monthRevenue','quarterCount','quarterRevenue','subCardsCount','subCardsRevenue','walletCardsCount','walletCardsRevenue','rechargeCount','rechargeRevenue'];
const COUNT_FIELDS=NUM_FIELDS.filter(f=>f.endsWith('Count'));
const REV_FIELDS=NUM_FIELDS.filter(f=>f.endsWith('Revenue'));
const FIELDS=['stationCode','stationName','date',...NUM_FIELDS,'totalCount','totalRevenue','submittedBy','submittedAt'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)&&n>0?n:0;};
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n||0);
const money=n=>fmt(n)+' ج.م';
const norm=s=>String(s).replace(/[٠-٩]/g,d=>'١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳٤٥٧٨٩'.indexOf(d)).replace(/[,،٬\s]/g,'');
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDateAr(iso){try{return new Date(iso+'T12:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return iso;}}
function store(k){try{const x=JSON.parse(localStorage.getItem(k));return x===null?undefined:x;}catch(e){return undefined;}}

const COL_MAP={
 stationCode:'station_code',stationName:'station_name',date:'report_date',
 ticketsCount:'tickets_count',ticketsRevenue:'tickets_revenue',
 weekCount:'week_count',weekRevenue:'week_revenue',
 monthCount:'month_count',monthRevenue:'month_revenue',
 quarterCount:'quarter_count',quarterRevenue:'quarter_revenue',
 subCardsCount:'sub_cards_count',subCardsRevenue:'sub_cards_revenue',
 walletCardsCount:'wallet_cards_count',walletCardsRevenue:'wallet_cards_revenue',
 rechargeCount:'recharge_count',rechargeRevenue:'recharge_revenue',
 totalCount:'total_count',totalRevenue:'total_revenue',
 submittedBy:'submitted_by',submittedAt:'submitted_at'
};
const REV_MAP={};Object.entries(COL_MAP).forEach(([k,v])=>REV_MAP[v]=k);
const toSnake=rec=>{const o={};for(const k in rec){if(COL_MAP[k])o[COL_MAP[k]]=rec[k];}return o;};
const fromSnake=row=>{const o={};for(const k in row){if(REV_MAP[k])o[REV_MAP[k]]=row[k];}return o;};
function supaCfg(){const c=getSettings();return (c.supabaseUrl&&c.supabaseKey)?{base:String(c.supabaseUrl).replace(/\/+$/,'')+'/rest/v1',key:c.supabaseKey}:null;}
function supaHeaders(){const c=supaCfg();return {apikey:c.key,Authorization:'Bearer '+c.key};}

const ICONS={
train:'<rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14"/><circle cx="9" cy="13.5" r=".7"/><circle cx="15" cy="13.5" r=".7"/><path d="M8 16l-2.5 4M16 16l2.5 4M9.5 20h5"/>',
ticket:'<path d="M4 7a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2.5a2.5 2.5 0 0 0 0-5z"/><path d="M14 6v2.2m0 3.6v2.2m0 3.6V18" stroke-dasharray="2 2.6"/>',
pass:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.7 16.5c.6-1.8 5-1.8 5.6 0"/><path d="M14 9.5h4.5M14 13h4.5"/>',
wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v13a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1"/><circle cx="16.5" cy="14" r="1"/>',
zap:'<path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5z"/>',
download:'<path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
qr:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h3v3h-3zM20 20h-3M20 14v.01M14 20v.01"/>',
check:'<path d="M4 12.5 9.5 18 20 6.5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
trash:'<path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V7"/>',
refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1.5 1.5"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1.5-1.5"/>',
send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
board:'<path d="M3 4h18v12H3z"/><path d="M8 20h8M12 16v4"/>',
sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/>',
sliders:'<path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 18h2"/>',
spinner:'<path d="M21 12a9 9 0 1 1-6.2-8.56"/>'
};
const ic=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
$('#brandIcon').innerHTML=ic('train');

const DEFAULT_STATIONS=[
  ['EST','الاستاد'],
  ['NOZ','النزهة'],
  ['SIK','طريق السويس'],
  ['BAD','البادية'],
  ['SHR','الشروق'],
  ['SKH','طريق العين السخنة'],
  ['NCP','العاصمة الجديدة'],
  ['CAP','الكابيتال']
].map(([code,name])=>({code,name}));

const getStations=()=>store(LS.stations)||DEFAULT_STATIONS;
const saveStations=v=>localStorage.setItem(LS.stations,JSON.stringify(v));
const getLocalRecords=()=>store(LS.records)||[];
const saveLocalRecords=v=>localStorage.setItem(LS.records,JSON.stringify(v));
const getSettings=()=>store(LS.settings)||{};
const saveSettings=v=>localStorage.setItem(LS.settings,JSON.stringify(v));
const recKey=r=>String(r.stationCode)+'|'+String(r.date);
function upsertLocal(rec){const arr=getLocalRecords().filter(r=>recKey(r)!==recKey(rec));arr.push(rec);saveLocalRecords(arr);}

async function fetchJson(url,opts={},ms=9000){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{...opts,signal:c.signal});return {status:r.status,json:await r.json().catch(()=>null)};}
  finally{clearTimeout(t);}
}
async function getAllRecords(){
  const local=getLocalRecords(), cfg=supaCfg();
  if(!cfg) return {rows:local,source:'local'};
  try{
    const res=await fetchJson(cfg.base+'/'+TABLE+'?select=*',{headers:supaHeaders()});
    if(res.status!==200||!Array.isArray(res.json)) throw new Error('bad');
    const map=new Map();local.forEach(r=>map.set(recKey(r),r));
    res.json.map(fromSnake).forEach(r=>map.set(recKey(r),r));
    return {rows:[...map.values()],source:'remote'};
  }catch(e){console.error('Fetch error:',e);return {rows:local,source:'local-error'};}
}
async function saveRecord(rec){
  upsertLocal(rec);
  const cfg=supaCfg();
  if(cfg){
    try{
      const res=await fetchJson(cfg.base+'/'+TABLE,{
        method:'POST',
        headers:{...supaHeaders(),'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify(toSnake(rec))
      },15000);
      if(res.status===200||res.status===201)return{sent:true};
      return{sent:false,msg:'خطأ من الخادم ('+res.status+')'};
    }catch(e){return{sent:false,msg:'تعذر الاتصال بـ Supabase'};}
  }
  return{sent:false};
}
function stationLink(s){return location.origin+location.pathname+'#/s/'+encodeURIComponent(s.code)+'/'+encodeURIComponent(s.name);}
function copyText(t,msg){
  const done=()=>toast(msg||'تم النسخ ✓');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
let toastTimer;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function openOverlay(html){const o=$('#overlay');o.innerHTML=html;o.hidden=false;}
function closeOverlay(){const o=$('#overlay');o.hidden=true;o.innerHTML='';}
function updateChip(){const c=$('#modeChip');const on=!!supaCfg();
  c.className='chip '+(on?'ok':'warn');c.textContent=on?'متصل — Supabase':'وضع محلي (تجريبي)';}
function setActive(k){$$('nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===k));}
function fileWarn(){return location.protocol==='file:'?'<div class="warn-banner">⚠️ التطبيق مفتوح من الملف مباشرة — حتى تعمل لينكات المحطات على أجهزة الموظفين، ارفعه على الإنترنت (مثل GitHub Pages).</div>':'';}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function makeIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');
  const r=size*0.22;
  const g=x.createLinearGradient(0,0,size,size);
  g.addColorStop(0,'#4adfc8');g.addColorStop(1,'#189684');
  x.beginPath();
  x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();
  x.fillStyle=g;x.fill();
  x.font=Math.round(size*0.52)+'px serif';x.textAlign='center';x.textBaseline='middle';
  x.fillText('🚝',size/2,size*0.56);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    const icon192=makeIcon(192),icon512=makeIcon(512),icon180=makeIcon(180);
    const manifest={
      name:'إحصاء المحطات — مونوريل شرق النيل',
      short_name:'إحصاء المحطات',
      start_url:location.pathname,
      scope:location.pathname.replace(/[^/]*$/,''),
      display:'standalone',
      background_color:'#06121e',
      theme_color:'#0b1e2e',
      dir:'rtl',lang:'ar',
      icons:[{src:icon192,sizes:'192x192',type:'image/png'},{src:icon512,sizes:'512x512',type:'image/png'}]
    };
    const l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
    const a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon180;document.head.appendChild(a);
    if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
  }catch(e){}
}
function injectBottomNav(){
  document.body.insertAdjacentHTML('beforeend',`<nav class="bottom-nav">
    <a href="#/" data-nav="home">${ic('board')}<span>المحطات</span></a>
    <a href="#/dash" data-nav="dash">${ic('sheet')}<span>التجميع</span></a>
    <a href="#/setup" data-nav="setup">${ic('sliders')}<span>الإعدادات</span></a>
  </nav>`);
}
function hideSplash(){const sp=$('#splash');if(!sp)return;setTimeout(()=>{sp.classList.add('off');setTimeout(()=>sp.remove(),600);},450);}

function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const seg=h.split('?')[0].split('/').filter(Boolean);
  closeOverlay();window.scrollTo(0,0);
  if(seg[0]==='dash')return renderDash();
  if(seg[0]==='setup')return renderSetup();
  if(seg[0]==='s')return renderForm(seg[1]||'',decodeURIComponent(seg[2]||''));
  renderHome();
}
window.addEventListener('hashchange',route);

async function renderHome(){
  setActive('home');
  const app=$('#app');
  app.innerHTML='<div class="view"><p class="loading">جارٍ تحميل لوحة المحطات…</p></div>';
  const {rows}=await getAllRecords();
  const stations=getStations(), today=todayISO();
  const recToday=new Map(rows.filter(r=>String(r.date)===today).map(r=>[String(r.stationCode),r]));
  const done=stations.filter(s=>recToday.has(s.code)).length;
  const pct=stations.length?Math.round(done/stations.length*100):0;

  app.innerHTML=`<div class="view">
    ${fileWarn()}
    <div class="board-head">
      <div><h1 class="page-title">لوحة المحطات</h1>
        <p class="page-sub">بيان اليوم — ${fmtDateAr(today)}</p></div>
      <div class="grow"></div>
      <input class="search" id="stSearch" placeholder="ابحث عن محطة…" autocomplete="off">
      <a class="btn ghost sm" href="#/dash">${ic('board')} لوحة التجميع</a>
    </div>
    <div class="progress-wrap"><span>اكتمال بيانات اليوم: <b>${pct}%</b> (${done} من ${stations.length})</span>
      <div class="progress"><i id="progBar"></i></div></div>
    <ol class="stations" id="stList">
      ${stations.map((s,i)=>{const r=recToday.get(s.code);
        return `<li class="station-row" style="--i:${i}" data-search="${esc(s.name)} ${esc(s.code)}">
          <span class="s-code">${esc(s.code)}</span>
          <div><div class="s-name">${esc(s.name)}</div>
            <div class="s-status ${r?'on':''}"><span class="dot"></span>${r?('مسجّل اليوم • إيراد '+money(num(r.totalRevenue))):'في انتظار التسجيل'}</div></div>
          <span class="s-rev">${r?money(num(r.totalRevenue)):''}</span>
          <div class="s-actions">
            <a class="btn sm" href="#/s/${encodeURIComponent(s.code)}/${encodeURIComponent(s.name)}">${ic('ticket')} تسجيل البيان</a>
            <button class="icon-btn" title="نسخ رابط المحطة" data-copy="${esc(stationLink(s))}">${ic('link')}</button>
            <button class="icon-btn" title="QR للمشاركة" data-qr="${esc(s.name)}" data-qrl="${esc(stationLink(s))}">${ic('qr')}</button>
          </div></li>`;}).join('')}
    </ol>
    <div class="add-station">
      <input id="newStName" placeholder="اسم محطة جديدة (اختياري)" autocomplete="off">
      <button class="btn ghost" id="addStBtn">${ic('plus')} إضافة محطة</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>{const b=$('#progBar');if(b)b.style.width=pct+'%';});
  $('#stSearch').addEventListener('input',e=>{const q=e.target.value.trim();
    $$('#stList .station-row').forEach(li=>li.style.display=li.dataset.search.includes(q)?'':'none');});
  $('#addStBtn').addEventListener('click',()=>{
    const name=$('#newStName').value.trim();if(!name)return toast('اكتب اسم المحطة أولاً');
    const st=getStations();let code,n=st.length+1;
    do{code='ST'+String(n).padStart(2,'0');n++;}while(st.some(s=>s.code===code));
    st.push({code,name});saveStations(st);toast('تمت إضافة محطة '+name+' ✓');renderHome();});
}
document.addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){copyText(cp.dataset.copy,'تم نسخ رابط المحطة ✓');return;}
  const qr=e.target.closest('[data-qr]');
  if(qr){openQR(qr.dataset.qr,qr.dataset.qrl);return;}
});
function openQR(name,link){
  openOverlay(`<div class="qr-box">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=230x230&data=${encodeURIComponent(link)}" alt="QR">
    <h3>محطة ${esc(name)}</h3><p>${esc(link)}</p>
    <div class="success-actions" style="margin-top:12px">
      <button class="btn sm" id="qrCopy">${ic('copy')} نسخ الرابط</button>
      <button class="btn ghost sm" id="qrClose">إغلاق</button></div></div>`);
  $('#qrCopy').onclick=()=>copyText(link,'تم نسخ الرابط ✓');
  $('#qrClose').onclick=closeOverlay;
}

const SECTIONS=[
 {id:'tickets',ord:'أولاً',title:'التذاكر',icon:'ticket',rows:[{label:'التذاكر',c:'ticketsCount',r:'ticketsRevenue'}]},
 {id:'subs',ord:'ثانيًا',title:'الاشتراكات',icon:'pass',rows:[
   {label:'اشتراك أسبوعي',c:'weekCount',r:'weekRevenue'},
   {label:'اشتراك شهري',c:'monthCount',r:'monthRevenue'},

function buildDayRows(records,dateStr){
  const stations=getStations();
  const byCode=new Map(records.filter(r=>String(r.date)===dateStr).map(r=>[String(r.stationCode),r]));
  const mk=(code,name,rec)=>{const z={};NUM_FIELDS.forEach(f=>z[f]=rec?num(rec[f]):0);
    return {code,name,...z,
      totalCount:COUNT_FIELDS.reduce((a,f)=>a+z[f],0),
      totalRevenue:REV_FIELDS.reduce((a,f)=>a+z[f],0),
      present:!!rec};};
  const rows=stations.map(s=>mk(s.code,s.name,byCode.get(s.code)));
  byCode.forEach((r,code)=>{if(!stations.some(s=>s.code===code))rows.push(mk(code,r.stationName||code,r));});
  return rows;
}

function exportLogExcel(records){
  const AR={stationCode:'كود المحطة',stationName:'المحطة',date:'التاريخ',ticketsCount:'عدد التذاكر',ticketsRevenue:'إيراد التذاكر',weekCount:'اشتراك أسبوعي (عدد)',weekRevenue:'اشتراك أسبوعي (إيراد)',monthCount:'اشتراك شهري (عدد)',monthRevenue:'اشتراك شهري (إيراد)',quarterCount:'اشتراك ربع سنوي (عدد)',quarterRevenue:'اشتراك ربع سنوي (إيراد)',subCardsCount:'كروت اشتراكات (عدد)',subCardsRevenue:'كروت اشتراكات (إيراد)',walletCardsCount:'كروت محفظة (عدد)',walletCardsRevenue:'كروت محفظة (إيراد)',rechargeCount:'شحن محفظة (عدد)',rechargeRevenue:'شحن محفظة (إيراد)',totalCount:'إجمالي العدد',totalRevenue:'إجمالي الإيراد',submittedBy:'المُسجِّل',submittedAt:'وقت التسجيل'};
  const sorted=[...records].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const aoa=[FIELDS.map(f=>AR[f]),...sorted.map(r=>FIELDS.map(f=>r[f]??''))];
  if(!window.XLSX)return exportXLSFallback('سجل البيانات الكامل',[['السجل',aoa]]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:20},{wch:12},...Array(16).fill({wch:15}),{wch:14},{wch:20}];
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:FIELDS.length-1}})};
  setNumFmt(ws);
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,ws,'السجل الكامل');
  XLSX.writeFile(wb,'سجل بيانات مونوريل شرق النيل.xlsx');
  toast('تم تنزيل السجل الكامل ✓');
}
function exportXLSFallback(filename,sheets){
  let html='<html><head><meta charset="UTF-8"></head><body dir="rtl">';
  sheets.forEach(([title,aoa])=>{html+='<h3>'+esc(title)+'</h3><table border="1" cellspacing="0">'+
    aoa.map(r=>'<tr>'+r.map(c=>'<td>'+(typeof c==='number'?c:esc(c??''))+'</td>').join('')+'</tr>').join('')+'</table><br>';});
  html+='</body></html>';
  dlBlob(new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'}),filename+'.xls');
}

      <ol class="steps">
        <li>اعمل حساب مجاني على <b>supabase.com</b> واضغط <b>New project</b> (اختار اسم المشروع وباسورد وأقرب Region ليك).</li>
        <li>من القائمة الجانبية افتح <b>SQL Editor</b> واضغط <b>New query</b>، الصق كود SQL بالأسفل واضغط <b>Run</b> — هيعمل جدول واحد لكل الأيام مع صلاحيات آمنة.</li>
        <li>من <b>Project Settings</b> (أيقونة الترس) → <b>API</b>: انسخ <b>Project URL</b> و<b>anon public key</b>.</li>
        <li>الصقهم هنا بالأسفل واضغط <b>حفظ واختبار</b>.</li>
        <li>بعد رفع التطبيق على GitHub Pages، أرسل لكل محطة لينكها من زر النسخ في لوحة المحطات — البيانات هتوصلك فورًا.</li>
      </ol>
      <div class="codebox"><button class="icon-btn copy-code" id="copySql" title="نسخ SQL">${ic('copy')}</button><pre dir="ltr">${esc(SUPA_SQL)}</pre></div>
    </div>

    <div class="card"><h2>${ic('link')} بيانات الاتصال بـ Supabase</h2>
      <div class="url-row">
        <input id="supaUrl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(cfg.supabaseUrl||'')}">
        <input id="supaKey" placeholder="anon public key (يبدأ بـ eyJ…)" value="${esc(cfg.supabaseKey||'')}">
        <button class="btn" id="saveCfg">${ic('check')} حفظ واختبار</button>
        ${on?'<button class="btn danger" id="removeCfg">إلغاء الربط</button>':''}
      </div>
      <div class="test-result" id="testResult"></div>
      <p style="color:var(--muted);font-size:12px;margin-top:10px">ملاحظة: مفتاح anon آمن للاستخدام هنا، لأنه مقيّد بصلاحيات (RLS) تسمح فقط بالقراءة والكتابة في جدول البيانات — لا يسمح بأي شيء آخر في قاعدة البيانات.</p>
    </div>

    <div class="card"><h2>${ic('train')} إدارة المحطات</h2>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">عدّل أسماء المحطات الافتراضية أو أضِف باقي محطات الخط — اللينك الخاص بكل محطة يتولّد تلقائيًا.</p>
      <div class="st-mng">
        ${st.map(s=>`<div class="st-mng-row"><span class="s-code">${esc(s.code)}</span><b>${esc(s.name)}</b>
          <button class="icon-btn" data-copy="${esc(stationLink(s))}" title="نسخ الرابط">${ic('link')}</button>
          <button class="icon-btn" data-del="${esc(s.code)}" title="حذف المحطة">${ic('trash')}</button></div>`).join('')}
      </div>
    </div>

    <div class="card"><h2>${ic('sliders')} البيانات المحلية</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:12px">عدد البيانات المخزّنة على هذا الجهاز: <b style="color:var(--gold)">${getLocalRecords().length}</b> بيان</p>
      <button class="btn danger" id="wipeLocal">${ic('trash')} مسح البيانات المحلية</button>
    </div>
  </div>`;

  const ib=$('#installBtn');
  if(ib)ib.onclick=async ()=>{if(!deferredPrompt)return;deferredPrompt.prompt();
    const ch=await deferredPrompt.userChoice;toast(ch.outcome==='accepted'?'جارٍ تثبيت التطبيق ✓':'تم إلغاء التثبيت');deferredPrompt=null;};
  $('#copySql').onclick=()=>copyText(SUPA_SQL,'تم نسخ كود SQL ✓');
  $('#saveCfg').onclick=async ()=>{
    const url=$('#supaUrl').value.trim(), key=$('#supaKey').value.trim();
    const r=$('#testResult');
    if((url&&!key)||(!url&&key)){r.style.color='#ff9a90';r.textContent='✗ لازم تدخل الرابط والمفتاح معًا';return;}
    if(url&&!url.startsWith('https://')){r.style.color='#ff9a90';r.textContent='✗ الرابط يجب أن يبدأ بـ https://';return;}
    saveSettings({...getSettings(),supabaseUrl:url||undefined,supabaseKey:key||undefined});updateChip();
    if(!url){toast('تم الحفظ — التطبيق الآن في الوضع المحلي');renderSetup();return;}
    r.style.color='#ffd27a';r.textContent='جارٍ اختبار الاتصال…';
    try{
      const c=supaCfg();
      const res=await fetchJson(c.base+'/'+TABLE+'?select=station_code',{headers:supaHeaders()});
      if(res.status===200&&Array.isArray(res.json)){
        toast('تم الربط مع Supabase بنجاح ✓ ('+res.json.length+' بيان محفوظ)');
        renderSetup();
      }else{r.style.color='#ff9a90';r.textContent='✗ تعذر الاتصال — راجع الرابط والمفتاح وتأكد إنك عملت Run لكود SQL';}
    }catch(e){r.style.color='#ff9a90';r.textContent='✗ تعذر الاتصال — راجع الرابط والمفتاح';}
  };
  const rm=$('#removeCfg');if(rm)rm.onclick=()=>{saveSettings({...getSettings(),supabaseUrl:undefined,supabaseKey:undefined});updateChip();toast('تم إلغاء الربط');renderSetup();};
  $$('[data-del]').forEach(b=>b.onclick=()=>{
    const code=b.dataset.del;const s=st.find(x=>x.code===code);
    if(confirm('حذف محطة '+(s?s.name:code)+'؟')){saveStations(st.filter(x=>x.code!==code));toast('تم الحذف');renderSetup();}});
  $('#wipeLocal').onclick=()=>{if(confirm('هل أنت متأكد من مسح كل البيانات المحلية؟')){saveLocalRecords([]);toast('تم المسح');renderSetup();}};
}

function tickClock(){const n=new Date();
  $('#clockTime').textContent=n.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  $('#clockDate').textContent=n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});}
setInterval(tickClock,1000);tickClock();
injectBottomNav();
setupPWA();
updateChip();
route();
hideSplash();
</script>
</body>
</html>
