<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إحصاء المحطات — مونوريل شرق النيل</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0b1e2e; --acc:#38c8b0; --gold:#ffb52e; --ink:#eaf2f8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.ic{width:20px;height:20px}
.btn{background:var(--acc);color:#06231e;padding:10px 18px;border-radius:11px;border:0;cursor:pointer}
.card{background:#0f2740;border:1px solid #1d3a54;border-radius:16px;padding:18px;margin:16px 0}
input,select{background:#0a1c2d;border:1.5px solid #1d3a54;color:var(--ink);padding:10px;border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px;border-bottom:1px solid #16324c;text-align:center}
.chip{padding:3px 10px;border-radius:99px;font-size:11px}
.chip.ok{background:rgba(52,209,123,.12);color:#7ee2a8}
</style>
</head>
<body>
<header style="padding:10px 20px;background:rgba(6,18,30,.86);border-bottom:1px solid #1d3a54">
  <h1>🚝 إحصاء المحطات — مونوريل شرق النيل</h1>
  <span class="chip ok" id="status">متصل</span>
</header>

<main style="max-width:1160px;margin:auto;padding:20px">
  <nav style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">
    <button class="btn" onclick="showView('home')">📋 لوحة المحطات</button>
    <button class="btn" onclick="showView('dash')">📊 لوحة التجميع</button>
  </nav>

  <div id="app"></div>
</main>

<script>
// ==========================================
// 🔧 بيانات Supabase
// ==========================================
const SUPABASE_URL = 'https://hdsohnub.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TQ9SWNIzfgc7ZYt5UdCi4A_g9H-4i';
const TABLE = 'station_reports';
// ==========================================

const BASE_URL = SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/' + TABLE;
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'resolution=merge-duplicates'
};

const STATIONS = [
  {code:'EST',name:'الاستاد'},
  {code:'NOZ',name:'النزهة'},
  {code:'SIK',name:'طريق السويس'},
  {code:'BAD',name:'البادية'},
  {code:'SHR',name:'الشروق'},
  {code:'SKH',name:'طريق العين السخنة'},
  {code:'NCP',name:'العاصمة الجديدة'},
  {code:'CAP',name:'الكابيتال'}
];

const NUM_FIELDS = ['ticketsCount','ticketsRevenue','weekCount','weekRevenue','monthCount','monthRevenue','quarterCount','quarterRevenue','subCardsCount','subCardsRevenue','walletCardsCount','walletCardsRevenue','rechargeCount','rechargeRevenue'];

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmt(n){return new Intl.NumberFormat('en-US').format(n||0);}
function money(n){return fmt(n)+' ج.م';}

// جلب البيانات من Supabase
async function fetchData(){
  try{
    const res = await fetch(BASE_URL + '?select=*', {headers:{apikey:HEADERS.apikey,Authorization:HEADERS.Authorization}});
    if(!res.ok) throw new Error('Failed');
    return await res.json();
  }catch(e){
    console.error('Fetch error:',e);
    return [];
  }
}

// حفظ بيان
async function saveData(data){
  try{
    const res = await fetch(BASE_URL, {
      method:'POST',
      headers:HEADERS,
      body:JSON.stringify(data)
    });
    return res.ok;
  }catch(e){
    console.error('Save error:',e);
    return false;
  }
}

let currentView = 'home';
let allData = [];

async function load(){
  document.getElementById('app').innerHTML = '<p style="text-align:center;padding:40px">جارٍ التحميل...</p>';
  allData = await fetchData();
  if(currentView === 'home') renderHome();
  else renderDash();
}

function showView(v){
  currentView = v;
  load();
}

function renderHome(){
  const todayDate = today();
  const todayRecords = new Map(allData.filter(r=>r.report_date===todayDate).map(r=>[r.station_code,r]));
  
  let html = '<div class="card"><h2>لوحة المحطات - '+todayDate+'</h2><div style="display:grid;gap:12px">';
  
  STATIONS.forEach((s,i)=>{
    const r = todayRecords.get(s.code);
    html += `
      <div style="background:#0d2438;border:1px solid #1c3c5a;border-radius:12px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <b style="font-size:17px">${s.name}</b>
            <span style="color:#8fa9bf;font-size:12px"> (${s.code})</span>
          </div>
          ${r?'<span style="color:#7ee2a8">✓ مسجل</span>':'<span style="color:#8fa9bf">في الانتظار</span>'}
        </div>
        ${r?`<div style="margin-top:8px;color:#ffd27a">الإيراد: ${money(r.total_revenue)}</div>`:''}
        <button class="btn" style="margin-top:10px;width:100%" onclick="openForm('${s.code}','${s.name}')">📝 تسجيل البيان</button>
      </div>
    `;
  });
  
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}

function renderDash(){
  const dateInput = document.createElement('div');
  dateInput.innerHTML = '<input type="date" id="dashDate" value="'+today()+'" style="margin-bottom:10px" onchange="filterDash()">';
  
  const html = `
    <div class="card">
      <h2>لوحة التجميع</h2>
      <input type="date" id="dashDate" value="${today()}" style="margin:10px 0" onchange="filterDash()">
      <div id="dashContent"></div>
    </div>
  `;
  
  document.getElementById('app').innerHTML = html;
  filterDash();
}

async function filterDash(){
  const date = document.getElementById('dashDate').value;
  const dayData = allData.filter(r=>r.report_date===date);
  
  let html = '<table><thead><tr><th>المحطة</th><th>التذاكر</th><th>الإيراد</th><th>الحالة</th></tr></thead><tbody>';
  
  STATIONS.forEach(s=>{
    const r = dayData.find(x=>x.station_code===s.code);
    html += `<tr>
      <td>${s.name}</td>
      <td>${r?fmt(r.tickets_count):'-'}</td>
      <td>${r?money(r.tickets_revenue):'-'}</td>
      <td>${r?'✓':'-'}</td>
    </tr>`;
  });
  
  html += '</tbody></table>';
  document.getElementById('dashContent').innerHTML = html;
}

function openForm(code,name){
  const html = `
    <div class="card">
      <h2>تسجيل بيان - ${name}</h2>
      <div style="margin:10px 0">
        <label>التاريخ</label>
        <input type="date" id="formDate" value="${today()}" style="width:100%;margin-top:5px">
      </div>
      <div style="margin:10px 0">
        <label>عدد التذاكر</label>
        <input type="number" id="ticketsCount" placeholder="0" style="width:100%;margin-top:5px">
      </div>
      <div style="margin:10px 0">
        <label>إيراد التذاكر</label>
        <input type="number" id="ticketsRevenue" placeholder="0" style="width:100%;margin-top:5px">
      </div>
      <div style="margin:10px 0">
        <label>الاشتراكات الأسبوعية (عدد)</label>
        <input type="number" id="weekCount" placeholder="0" style="width:100%;margin-top:5px">
      </div>
      <div style="margin:10px 0">
        <label>الاشتراكات الأسبوعية (إيراد)</label>
        <input type="number" id="weekRevenue" placeholder="0" style="width:100%;margin-top:5px">
      </div>
      <div style="margin:10px 0">
        <label>اسم المسجل (اختياري)</label>
        <input type="text" id="submittedBy" placeholder="موظف المحطة" style="width:100%;margin-top:5px">
      </div>
      <button class="btn" onclick="submitForm('${code}','${name}')" style="width:100%;margin-top:10px">💾 حفظ البيان</button>
      <button class="btn" onclick="load()" style="width:100%;margin-top:10px;background:#1d3a54">❌ إلغاء</button>
    </div>
  `;
  
  document.getElementById('app').innerHTML = html;
}

async function submitForm(code,name){
  const data = {
    station_code: code,
    station_name: name,
    report_date: document.getElementById('formDate').value,
    tickets_count: parseInt(document.getElementById('ticketsCount').value)||0,
    tickets_revenue: parseInt(document.getElementById('ticketsRevenue').value)||0,
    week_count: parseInt(document.getElementById('weekCount').value)||0,
    week_revenue: parseInt(document.getElementById('weekRevenue').value)||0,
    submitted_by: document.getElementById('submittedBy').value,
    submitted_at: new Date().toISOString(),
    total_count: (parseInt(document.getElementById('ticketsCount').value)||0) + (parseInt(document.getElementById('weekCount').value)||0),
    total_revenue: (parseInt(document.getElementById('ticketsRevenue').value)||0) + (parseInt(document.getElementById('weekRevenue').value)||0)
  };
  
  const success = await saveData(data);
  
  if(success){
    alert('✅ تم الحفظ بنجاح في Supabase!');
    allData = await fetchData();
    renderHome();
  }else{
    alert(' فشل الحفظ - تأكد من الاتصال');
  }
}

// تشغيل عند البدء
load();
setInterval(load, 30000); // تحديث كل 30 ثانية
</script>
</body>
</html>
