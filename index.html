.kpi-card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--br);border-radius:16px;padding:18px;position:relative;overflow:hidden;transition:.3s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.kpi-label{font-size:11px;color:var(--tx2);letter-spacing:.5px;font-weight:600;margin-bottom:8px}
.kpi-value{font:800 26px 'Changa';color:var(--tx);margin-bottom:4px}
.kpi-sub{font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.kpi-sub.up{color:var(--ok)}.kpi-sub.down{color:var(--err)}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:900px){.adv-grid{grid-template-columns:1fr}}
.ai-insight{background:linear-gradient(135deg,rgba(34,211,238,.08),rgba(139,92,246,.08));border:1px solid rgba(34,211,238,.3);border-radius:16px;padding:18px;margin-bottom:14px}
.ai-insight-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-insight-icon{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center}
.ai-insight-icon svg{width:20px;height:20px;color:#04121f}
.ai-insight-title{font:700 15px 'Changa'}
.ai-insight-body{font-size:13px;line-height:1.7;color:var(--tx2)}
.ai-insight-body b{color:var(--tx)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:14px;background:var(--glass);border:1px solid var(--br);border-radius:14px}
.filter-bar input,.filter-bar select{background:var(--bg1);border:1px solid var(--br-strong);border-radius:10px;padding:8px 12px;color:var(--tx);font-size:13px}
.filter-bar label{font-size:11px;color:var(--tx2);font-weight:600}
.filter-group{display:flex;flex-direction:column;gap:4px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font:700 12px 'Changa';margin-left:8px}
.rank-badge.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#04121f}
.rank-badge.silver{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#04121f}
.rank-badge.bronze{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff}
.progress-ring{position:relative;width:120px;height:120px;margin:0 auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:10}
.progress-ring .bg{stroke:var(--br)}
.progress-ring .fg{stroke:var(--pr);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.progress-ring .value{position:absolute;inset:0;display:grid;place-items:center;font:800 24px 'Changa'}

<header class="topbar"><div class="topbar-in">

<script>
'use strict';

// ============================================
// ✅ تعريف الدوال الأساسية أولاً
// ============================================
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

// إخفاء Splash Screen
function hideSplash(){
  const s=$('#splash');
  if(s) s.classList.add('off');
}

// ============================================
// Supabase Configuration
// ============================================
const SUPA_URL='https://hdsohnubcqbdwkmtvsvr.supabase.co';
const SUPA_KEY='sb_publishable_TQ9SWNIZfgc7ZYt5UdCi4A_g9H-4ied';
const BASE=SUPA_URL.replace(/\/+$/,'')+'/rest/v1';
const HEADERS={
  apikey:SUPA_KEY,
  Authorization:'Bearer '+SUPA_KEY,
  'Content-Type':'application/json',
  'Prefer':'return=representation'
};

// ============================================
// Authentication Functions
// ============================================
const AUTH_KEY='monorail_auth_v1';
const getAuth=()=>{try{return JSON.parse(localStorage.getItem(AUTH_KEY))}catch(e){return null}};
const setAuth=u=>{try{localStorage.setItem(AUTH_KEY,JSON.stringify({...u,loginAt:Date.now()}))}catch(e){}const sc=$('#sessionChip');if(sc)sc.style.display='';const sb=$('#syncBtn');if(sb)sb.style.display=''};
const clearAuth=()=>{try{localStorage.removeItem(AUTH_KEY)}catch(e){}const sc=$('#sessionChip');if(sc)sc.style.display='none';const sb=$('#syncBtn');if(sb)sb.style.display='none'};

// ============================================
// Mock Data
// ============================================
const MOCK_STATIONS=[
  {id:1,code:'EST',name:'الاستاد'},
  {id:2,code:'HSH',name:'هشام بركات'},
  {id:3,code:'AZH',name:'جامعة الأزهر'},
  {id:4,code:'SB7',name:'الحي السابع'},
  {id:6,code:'ASH',name:'المشير أحمد إسماعيل'},
  {id:7,code:'JSH',name:'جيهان السادات'},
  {id:8,code:'TNT',name:'المشير طنطاوي'},
  {id:9,code:'190',name:'وان ناينتي'},
  {id:10,code:'AIR',name:'المستشفى الجوي'},
  {id:11,code:'NRJ',name:'النرجس'},
  {id:12,code:'MST',name:'المستثمرين'},
  {id:13,code:'LOT',name:'اللوتس'},
  {id:14,code:'GSQ',name:'جولدن سكوير'},
  {id:15,code:'BTN',name:'بيت الوطن'},
  {id:16,code:'FTH',name:'مسجد الفتاح العليم'},
  {id:17,code:'R01',name:'حي R1'},
  {id:18,code:'R02',name:'حي R2'},
  {id:19,code:'MLB',name:'حي المال والأعمال'},
  {id:20,code:'ART',name:'مدينة الفنون والثقافة'},
  {id:21,code:'GOV',name:'الحي الحكومي'},
  {id:22,code:'MSR',name:'مسجد مصر'},
  {id:23,code:'JST',name:'مدينة العدالة'}
];

const MOCK_USERS=[
  {id:1,username:'admin',password:'admin123'},
  {id:2,username:'hisham',password:'hisham123'}
];

const MOCK_REPORTS=[];
const MOCK_AUDIT=[];

let useMock=false;
let hasUnsaved=false;
let currentPage='home';
let accPeriod='30';
let statsTab='overview';
let dashDate=new Date().toISOString().slice(0,10);

const NUM_FIELDS=['ticketsCount','ticketsRevenue','diverseRevenue','bankAhlyDiscount','bankMisrDiscount','weekCount','weekRevenue','monthCount','monthRevenue','quarterCount','quarterRevenue','subCardsCount','subCardsRevenue','walletCardsCount','walletCardsRevenue','rechargeCount','rechargeRevenue','formsCount','formsRevenue','subDiverseRevenue','subBankAhlyDiscount','subBankMisrDiscount','stadiumTicketsCount'];

const COUNT_FIELDS=['ticketsCount','weekCount','monthCount','quarterCount','subCardsCount','walletCardsCount','rechargeCount','formsCount'];

// ============================================
// Utility Functions
// ============================================
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)&&n>0?n:0};
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n||0);
const money=n=>fmt(n)+' ج.م';
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDateAr=i=>{try{return new Date(i+'T12:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return i}};
const timeOf=t=>{try{return new Date(t).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};

// ============================================
// Progress Bar
// ============================================
const startP=()=>{const p=$('#nprogress');if(p){p.classList.add('on');p.firstElementChild.style.width='70%'}};
const doneP=()=>{const p=$('#nprogress');if(p){p.firstElementChild.style.width='100%';setTimeout(()=>{p.classList.remove('on');p.firstElementChild.style.width='0'},250)}};

// ============================================
// Toast Notification
// ============================================
let toastT;
function toast(m){
  const e=$('#toast');
  if(!e)return;
  e.textContent=m;
  e.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>e.classList.remove('show'),3000);
}

// ============================================
// Supabase Fetch with Error Handling
// ============================================
const CSRF_TOKEN=Math.random().toString(36).substring(2)+Date.now().toString(36);

async function supaFetch(p,o={},ms=8000){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  try{
    const headers={...HEADERS,...(o.headers||{}),'X-CSRF-Token':CSRF_TOKEN};
    const r=await fetch(BASE+'/'+p,{...o,signal:c.signal,headers});
    return{status:r.status,json:await r.json().catch(()=>null),ok:r.ok,net:true};
  }catch(e){
    console.error('❌ Supabase Error:',e);
    useMock=true;
    return{status:0,json:null,ok:false,net:false};
  }finally{
    clearTimeout(t);
  }
}

// ============================================
// Data Functions
// ============================================
async function getAllReports(date){
  if(useMock)return MOCK_REPORTS.map(fromSnake).filter(r=>!date||String(r.date)===date);
  const url=date?`station_reports?report_date=eq.${date}&select=*`:'station_reports?select=*';
  const r=await supaFetch(url);
  if(r.net&&r.ok&&Array.isArray(r.json))return r.json.map(fromSnake);
  useMock=true;
  return MOCK_REPORTS.map(fromSnake).filter(x=>!date||String(x.date)===date);
}

async function getAllStations(){
  if(useMock)return MOCK_STATIONS;
  const r=await supaFetch('stations?select=*&order=id');
  if(r.net&&r.ok&&Array.isArray(r.json))return r.json;
  useMock=true;
  return MOCK_STATIONS;
}

// Column Mapping
const COL_MAP={
  stationCode:'station_code',stationName:'station_name',date:'report_date',
  ticketsCount:'tickets_count',ticketsRevenue:'tickets_revenue',
  diverseRevenue:'diverse_revenue',bankAhlyDiscount:'bank_ahly_discount',
  bankMisrDiscount:'bank_misr_discount',weekCount:'week_count',
  weekRevenue:'week_revenue',monthCount:'month_count',
  monthRevenue:'month_revenue',quarterCount:'quarter_count',
  quarterRevenue:'quarter_revenue',subCardsCount:'sub_cards_count',
  subCardsRevenue:'sub_cards_revenue',walletCardsCount:'wallet_cards_count',
  walletCardsRevenue:'wallet_cards_revenue',rechargeCount:'recharge_count',
  rechargeRevenue:'recharge_revenue',formsCount:'forms_count',
  formsRevenue:'forms_revenue',subDiverseRevenue:'sub_diverse_revenue',
  subBankAhlyDiscount:'sub_bank_ahly_discount',
  subBankMisrDiscount:'sub_bank_misr_discount',
  stadiumTicketsCount:'stadium_tickets_count',
  totalCount:'total_count',totalRevenue:'total_revenue',
  submittedBy:'submitted_by',submittedAt:'submitted_at'
};

const REV_MAP={};
Object.entries(COL_MAP).forEach(([k,v])=>REV_MAP[v]=k);

const toSnake=r=>{const o={};for(const k in r)if(COL_MAP[k])o[COL_MAP[k]]=r[k];return o};
const fromSnake=r=>{const o={};for(const k in r)if(REV_MAP[k])o[REV_MAP[k]]=r[k];return o};

// ============================================
// Login/Logout
// ============================================
async function login(u,p){
  if(useMock){
    const x=MOCK_USERS.find(x=>x.username===u&&x.password===p);
    if(x){setAuth({username:x.username});return x}
    return null;
  }
  const r=await supaFetch('app_users?select=*');
  if(r.net&&r.ok&&Array.isArray(r.json)){
    const x=r.json.find(x=>x.username===u);
    if(x){setAuth({username:x.username});return x}
  }
  return null;
}

const logout=()=>{
  clearAuth();
  location.hash='#/login';
  toast('تم تسجيل الخروج');
};

// ============================================
// Update Mode Chip
// ============================================
function updateModeChip(){
  const c=$('#modeChip');
  if(!c)return;
  if(!navigator.onLine){
    c.className='chip warn';
    c.textContent='بدون نت';
  }else if(useMock){
    c.className='chip warn';
    c.textContent='محاكاة';
  }else{
    c.className='chip ok';
    c.textContent='متصل';
  }
}

// ============================================
// Render Home Page
// ============================================
async function renderHome(){
  currentPage='home';
  $$('nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav==='home'));
  $('#logoutBtn').style.display='';
  updateModeChip();
  
  $('#app').innerHTML=`<div class="view">${skStats()}${skList(6)}</div>`;
  
  try{
    const today=todayISO();
    const [reports,stations]=await Promise.all([getAllReports(today),getAllStations()]);
    
    const done=stations.length;
    const pct=100;
    
    $('#app').innerHTML=`
      <div class="view">
        <div class="board-head">
          <div>
            <h1 class="page-title">لوحة المحطات</h1>
            <p class="page-sub">بيان اليوم — ${fmtDateAr(today)}</p>
          </div>
        </div>
        <div class="stats-strip">
          <div class="stat gold"><small>عدد المحطات</small><b>${stations.length}</b></div>
          <div class="stat"><small>الحالة</small><b>${useMock?'محلي':'متصل'}</b></div>
        </div>
        <div class="card">
          <h2>📊 المحطات المتاحة</h2>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">
            ${stations.map(s=>`
              <div style="background:var(--glass);border:1px solid var(--br);border-radius:12px;padding:16px">
                <div style="font:700 16px 'Changa';color:var(--prl)">${esc(s.code)}</div>
                <div style="color:var(--tx2);margin-top:4px">${esc(s.name)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
    
    doneP();
    if(window.lucide)lucide.createIcons();
  }catch(e){
    console.error('Render error:',e);
    $('#app').innerHTML=`<div class="empty">⚠️ خطأ في تحميل البيانات</div>`;
    doneP();
  }
}

// ============================================
// Skeleton Loading
// ============================================
const skList=n=>`<div class="stations sk-wrap">${Array.from({length:n},()=>'<div class="skeleton sk-row"></div>').join('')}</div>`;
const skStats=()=>`<div class="stats-strip">${Array.from({length:4},()=>'<div class="stat"><div class="skeleton" style="height:14px;width:70%;margin-bottom:12px"></div><div class="skeleton" style="height:32px;width:50%"></div></div>').join('')}</div>`;

// ============================================
// Router
// ============================================
function route(){
  startP();
  const h=location.hash.replace(/^#\/?/,'');
  const seg=h.split('?')[0].split('/').filter(Boolean);
  
  window.scrollTo(0,0);
  
  if(seg[0]==='login')return renderLogin();
  if(!getAuth()&&seg[0]!=='login'){location.hash='#/login';return}
  
  renderHome();
}

function renderLogin(){
  currentPage='login';
  $$('nav a').forEach(a=>a.classList.remove('active'));
  $('#logoutBtn').style.display='none';
  
  $('#app').innerHTML=`
    <div class="view">
      <div class="login-box">
        <h2>🔐 تسجيل الدخول</h2>
        <form id="loginForm">
          <div class="field">
            <label>اسم المستخدم</label>
            <div class="in-wrap">
              <input type="text" id="loginUser" required>
            </div>
          </div>
          <div class="field">
            <label>كلمة المرور</label>
            <div class="in-wrap">
              <input type="password" id="loginPass" required>
            </div>
          </div>
          <button class="btn big" type="submit" style="width:100%">دخول</button>
          <p style="color:var(--tx2);font-size:12px;margin-top:16px;text-align:center">admin / admin123</p>
        </form>
      </div>
    </div>
  `;
  
  doneP();
  
  $('#loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const u=$('#loginUser').value.trim();
    const p=$('#loginPass').value;
    const b=e.target.querySelector('button');
    
    b.disabled=true;
    b.textContent='جاري...';
    
    const user=await login(u,p);
    
    if(user){
      toast('مرحبًا '+user.username);
      updateModeChip();
      location.hash='#/';
    }else{
      toast('بيانات خاطئة');
      b.disabled=false;
      b.textContent='دخول';
    }
  });
}

// ============================================
// Clock
// ============================================
function tick(){
  const n=new Date();
  const ct=$('#clockTime');
  if(ct)ct.textContent=n.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  const cd=$('#clockDate');
  if(cd)cd.textContent=n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
}

// ============================================
// Initialize App
// ============================================
function initApp(){
  console.log('🚀 Initializing app...');
  
  // إخفاء Splash بعد ثانية ونصف
  setTimeout(hideSplash,1500);
  
  // بدء الساعة
  setInterval(tick,1000);
  tick();
  
  // Logout button
  $('#logoutBtn').onclick=logout;
  
  // Theme toggle
  $('#themeBtn').onclick=()=>{
    const current=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme',current==='light'?'dark':'light');
  };
  
  // Bottom nav
  document.body.insertAdjacentHTML('beforeend',`
    <nav class="bottom-nav">
      <a href="#/" data-nav="home"><span> المحطات</span></a>
      <a href="#/dash" data-nav="dash"><span>📊 التجميع</span></a>
      <a href="#/stats" data-nav="stats"><span>📈 إحصاء</span></a>
      <a href="#/stations" data-nav="stations"><span>⚙️ إدارة</span></a>
    </nav>
  `);
  
  // Route handling
  window.addEventListener('hashchange',route);
  
  // Initial route
  route();
  
  console.log('✅ App initialized successfully');
  console.log('📡 Supabase:',SUPA_URL);
  console.log('🔑 Mode:',useMock?'Mock':'Live');
}

// Start the app when DOM is ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initApp);
}else{
  initApp();
}
</script>
