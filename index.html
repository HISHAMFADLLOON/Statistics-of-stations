function buildAOA(rows,T){const a=[['تقرير'],['التاريخ: '+dashDate],[],['المحطة',...GROUPS.flatMap(g=>[g.t+' عدد',g.t+' إيراد']),'حالة']];rows.forEach(r=>a.push([r.name,...GROUPS.flatMap(g=>[r[g.c],r[g.r]]),r.present?'مسجّل':'—']));return a}
async function exportDayExcel(rows){toast('⏳ تجهيز…');const T=totalsOf(rows);let wb;try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv(buildAOA(rows,T),'تقرير');toast('CSV بديل');return}try{wb.views=[{rightToLeft:true}];const ws=wb.addWorksheet('تقرير');const logo=await loadLogo();if(logo){const im=wb.addImage({base64:logo,extension:'png'});ws.addImage(im,{tl:{col:0,row:0},ext:{width:60,height:60}})}ws.addRow([]);ws.addRow(['تقرير إحصاء المحطات — مونوريل شرق النيل']);ws.addRow(['التاريخ: '+dashDate]);ws.addRow([]);const h=ws.addRow(['المحطة',...GROUPS.flatMap(g=>[g.t+' عدد',g.t+' إيراد']),'الحالة']);h.eachCell(c=>{c.font={bold:true,color:{argb:'FF67E8F9'}}});rows.forEach(r=>ws.addRow([r.name,...GROUPS.flatMap(g=>[r[g.c],r[g.r]]),r.present?'مسجّل':'—']));const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/octet-stream'}),'إحصاء '+dashDate+'.xlsx');toast('✅ تم التنزيل')}catch(e){csv(buildAOA(rows,T),'تقرير');toast('CSV بديل')}}
async function exportLogExcel(rec){toast(' تجهيز…');let wb;const H=['كود','المحطة','التاريخ',...NUM_FIELDS,'إجمالي عدد','إجمالي','المسجل'];try{await ensureExcelJS();wb=new ExcelJS.Workbook()}catch(e){csv([H,...rec.map(r=>[r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy])],'سجل');return}try{wb.views=[{rightToLeft:true}];const ws=wb.addWorksheet('سجل');const logo=await loadLogo();if(logo){const im=wb.addImage({base64:logo,extension:'png'});ws.addImage(im,{tl:{col:0,row:0},ext:{width:60,height:60}})}ws.addRow([]);const h=ws.addRow(H);h.eachCell(c=>{c.font={bold:true,color:{argb:'FF67E8F9'}}});[...rec].sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(r=>ws.addRow([r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy]));const buf=await wb.xlsx.writeBuffer();dl(new Blob([buf],{type:'application/octet-stream'}),'سجل.xlsx');toast('✅ تم')}catch(e){csv([H,...rec.map(r=>[r.stationCode,r.stationName,r.date,...NUM_FIELDS.map(f=>r[f]),r.totalCount,r.totalRevenue,r.submittedBy])],'سجل')}}
function tick(){const n=new Date();$('#clockTime').textContent=n.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});$('#clockDate').textContent=n.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
setInterval(tick,1000);tick();$('#logoutBtn').onclick=logout;
document.body.insertAdjacentHTML('beforeend',`<nav class="bottom-nav"><a href="#/" data-nav="home">${ic('home')}<span>المحطات</span></a><a href="#/dash" data-nav="dash">${ic('board')}<span>التجميع</span></a><a href="#/stats" data-nav="stats">${ic('stats')}<span>إحصاء</span></a><a href="#/stations" data-nav="stations">${ic('settings')}<span>إدارة</span></a></nav>`);
syncPend();route();setTimeout(()=>{$('#splash').classList.add('off')},800);
setInterval(()=>{const a=getAuth();if(a&&['#/','#/dash','#/stats'].includes(location.hash))route()},30000);
</script>
</body>
